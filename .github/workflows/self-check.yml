name: Self-check (workflows)

# This repository is workflows, not an application: there is no app to test,
# so nothing here was ever checked before merge. That is the wrong way round —
# these files ARE the product for every repo that calls them, and an invalid
# workflow aborts with no jobs, no logs and a misleading event, which is
# precisely the failure a consumer cannot diagnose from their own repo.
#
# So: every push and pull request parses every workflow and asserts the house
# rules (timeouts, SHA-pinned actions, and a run-summary block explaining what
# each job is for). Runs on GitHub-hosted runners deliberately — a check on
# the self-hosted pipeline must not depend on the self-hosted pipeline.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflows parse and follow the house rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Workflows parse and follow the house rules

          Checks this repository's own reusable workflows before anyone depends on them: each file parses as YAML and declares triggers and jobs, each job has an explicit timeout and pinned actions, and each job writes a block to its run summary saying why it exists and what to do when it goes red.

          ❌ Do not pin this commit. An unparseable or GitHub-invalid workflow fails in the CONSUMER repo with no jobs and no logs; an unpinned action is somebody else's write access to a privileged pipeline; a missing timeout can hold a self-hosted runner slot for six hours; and a job with no summary block is a check nobody can act on when it goes red.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      # Locked and script-free: this job's whole point is to be the careful
      # one. `npm ci` honours the committed lockfile's integrity hashes, and
      # --ignore-scripts means no dependency executes code on a runner that
      # holds the checkout and the job token.
      - name: Install the pinned YAML parser
        run: npm ci --ignore-scripts

      # actionlint validates what a YAML parser cannot: GitHub's own schema
      # and expression syntax. `if: ${{ github.ref == }}` is perfectly valid
      # YAML and passes every structural check below, yet GitHub rejects the
      # workflow at startup — no jobs, no logs, in the CONSUMER repo. That is
      # precisely the failure this self-check exists to prevent, so parsing
      # alone was never enough.
      #
      # Pinned by version AND verified by checksum, like the gitleaks install
      # in muk-ci.yml: a linter that runs on every push is not a place to
      # trust a mutable download. It also runs shellcheck over every `run:`
      # block, which matters in a repo that is mostly shell.
      #
      # Dependabot does NOT move this pin: its github-actions ecosystem only
      # updates `uses: owner/repo@ref` references, not a release download
      # named in an env var. It is bumped by hand, and this step warns on
      # every run once rhysd/actionlint has a newer release; to bump, set
      # ACTIONLINT_VERSION to it and ACTIONLINT_SHA256 to the
      # linux_amd64.tar.gz line of that release's
      # actionlint_<version>_checksums.txt, in the same pull request.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" --version

          # Informational: a newer release is a warning on the run, never a
          # failure, since nothing else would say the hand-kept pin is stale.
          if latest="$(gh api repos/rhysd/actionlint/releases/latest --jq '.tag_name' 2>/dev/null)"; then
            if [ "$latest" != "v$ACTIONLINT_VERSION" ]; then
              echo "::warning file=.github/workflows/self-check.yml::actionlint $latest is out; self-check.yml pins $ACTIONLINT_VERSION. Bump ACTIONLINT_VERSION and ACTIONLINT_SHA256 together (Dependabot does not track this download)."
            fi
          else
            echo "Could not read rhysd/actionlint's latest release; not checking the pin."
          fi

      - name: Workflows are valid GitHub Actions syntax
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/actionlint" -no-color -oneline

      - name: Workflows follow the house rules
        run: node scripts/check-workflows.mjs
