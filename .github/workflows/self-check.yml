name: Self-check (workflows)

# This repository is workflows, not an application: there is no app to test,
# so nothing here was ever checked before merge. That is the wrong way round —
# these files ARE the product for every repo that calls them, and an invalid
# workflow aborts with no jobs, no logs and a misleading event, which is
# precisely the failure a consumer cannot diagnose from their own repo.
#
# So: every push and pull request parses every workflow and asserts the house
# rules (timeouts, SHA-pinned actions, and a run-summary block explaining what
# each job is for). Runs on GitHub-hosted runners deliberately — a check on
# the self-hosted pipeline must not depend on the self-hosted pipeline.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflows parse and follow the house rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Workflows parse and follow the house rules

          Checks this repository's own reusable workflows before anyone depends on them: each file parses as YAML and declares triggers and jobs, each job has an explicit timeout and pinned actions, and each job writes a block to its run summary saying why it exists and what green and red mean.

          **Green means** the workflows are safe to pin from a consuming repository.

          **Red means** do not pin this commit. An unparseable workflow fails in the CONSUMER repo with no jobs and no logs; an unpinned action is somebody else's write access to a privileged pipeline; a missing timeout can hold a self-hosted runner slot for six hours; and a job with no summary block is a check nobody can act on when it goes red.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Check every workflow
        run: node scripts/check-workflows.mjs
