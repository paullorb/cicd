name: muk.events browser matrix

# PR CI runs Chromium only, to stay fast. Firefox and WebKit run here, weekly,
# so cross-browser breakage still surfaces without putting six extra minutes on
# every pull request. (WebKit is the flaky one; retries are already configured
# in playwright.config.ts.)

on:
  workflow_call:
    secrets:
      NEXT_PUBLIC_SUPABASE_URL:
        required: true
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:
        required: true
      # The VAPID PUBLIC key — see muk-ci.yml's secrets block for why a value
      # that ships in every client bundle is passed like a secret. This suite
      # runs the same specs as the PR shards, so without it the notification
      # row is missing from the build here too and its spec cannot run.
      # required: false keeps the call working for a caller that has no key.
      NEXT_PUBLIC_VAPID_PUBLIC_KEY:
        required: false
      SUPABASE_DB_URL:
        required: true
      E2E_ADMIN_NAME:
        required: true
      E2E_ADMIN_PASSWORD:
        required: true
      E2E_ADMIN_EMAIL:
        required: true
      E2E_STAFF_NAME:
        required: true
      E2E_STAFF_PASSWORD:
        required: true
      E2E_STAFF_EMAIL:
        required: true
      E2E_TOGGLE_NAME:
        required: true
      E2E_TOGGLE_PASSWORD:
        required: true
      E2E_TOGGLE_EMAIL:
        required: true
      E2E_KIOSK_NAME:
        required: true
      E2E_KIOSK_PASSWORD:
        required: true
      E2E_KIOSK_EMAIL:
        required: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright ${{ matrix.browser }}
    # Routed like ci.yml: self-hosted muk-ci pool, with the MUK_CI_LABELS
    # variable as the offline-runner escape hatch (see runner-watchdog.yml).
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 40
    env:
      # Same dedicated port as ci.yml's e2e shard 1 — safe because this workflow
      # joins that shard's e2e-prod-set-1 group and so never runs beside it.
      E2E_PORT: "3100"
      # See ci.yml's e2e job: the install-time cache GC hangs on TCC-protected
      # paths when run from a launchd runner.
      PLAYWRIGHT_SKIP_BROWSER_GC: "1"
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    # This suite runs against account SET 1 (it doesn't set E2E_ACCOUNT_SET), so
    # it shares ci.yml's e2e-prod-set-1 lock: firefox and webkit never run at the
    # same time as each other or as a PR's shard-1, which mutates the same shared
    # accounts (mutations.spec.ts demotes/re-promotes the toggle account). A PR's
    # shard-2 uses set 2 and is free to run alongside. Queued, not cancelled.
    concurrency:
      group: e2e-prod-set-1
      cancel-in-progress: false
    steps:
      # Without the E2E_* secrets the authenticated suites self-skip and the
      # weekly cross-browser canary silently proves nothing. Fail loudly.
      - name: Required secrets are present
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          E2E_ADMIN_NAME: ${{ secrets.E2E_ADMIN_NAME }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_STAFF_NAME: ${{ secrets.E2E_STAFF_NAME }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
          E2E_TOGGLE_NAME: ${{ secrets.E2E_TOGGLE_NAME }}
          E2E_TOGGLE_PASSWORD: ${{ secrets.E2E_TOGGLE_PASSWORD }}
          E2E_TOGGLE_EMAIL: ${{ secrets.E2E_TOGGLE_EMAIL }}
          E2E_KIOSK_NAME: ${{ secrets.E2E_KIOSK_NAME }}
          E2E_KIOSK_PASSWORD: ${{ secrets.E2E_KIOSK_PASSWORD }}
          E2E_KIOSK_EMAIL: ${{ secrets.E2E_KIOSK_EMAIL }}
        run: |
          missing=""
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
                      SUPABASE_DB_URL \
                      E2E_ADMIN_NAME E2E_ADMIN_PASSWORD E2E_ADMIN_EMAIL \
                      E2E_STAFF_NAME E2E_STAFF_PASSWORD E2E_STAFF_EMAIL \
                      E2E_TOGGLE_NAME E2E_TOGGLE_PASSWORD E2E_TOGGLE_EMAIL \
                      E2E_KIOSK_NAME E2E_KIOSK_PASSWORD E2E_KIOSK_EMAIL; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing — the authenticated suites would self-skip and this canary would silently prove nothing."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          # The self-hosted box persists ~/.npm. GitHub's remote cache is much
          # larger and slower to restore than a warm npm ci on this runner.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # See the identical step in ci.yml — clears a dead run's leftover server.
      - name: Free the e2e port
        shell: bash
        run: lsof -ti :"$E2E_PORT" | xargs kill 2>/dev/null || true

      - name: Run e2e tests
        run: npm run test:e2e -- --project=${{ matrix.browser }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          E2E_ADMIN_NAME: ${{ secrets.E2E_ADMIN_NAME }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_STAFF_NAME: ${{ secrets.E2E_STAFF_NAME }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
          E2E_TOGGLE_NAME: ${{ secrets.E2E_TOGGLE_NAME }}
          E2E_TOGGLE_PASSWORD: ${{ secrets.E2E_TOGGLE_PASSWORD }}
          E2E_TOGGLE_EMAIL: ${{ secrets.E2E_TOGGLE_EMAIL }}
          E2E_KIOSK_NAME: ${{ secrets.E2E_KIOSK_NAME }}
          E2E_KIOSK_PASSWORD: ${{ secrets.E2E_KIOSK_PASSWORD }}
          E2E_KIOSK_EMAIL: ${{ secrets.E2E_KIOSK_EMAIL }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7

      # Same run-scoped sweep as ci.yml — see the comment there. Both matrix
      # jobs share this run id, but the e2e-prod concurrency group serializes
      # them, so one job's sweep can only ever catch this run's own debris.
      - name: Sweep this run's test events
        if: ${{ always() }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then exit 0; fi
          psql "$SUPABASE_DB_URL" --no-psqlrc --tuples-only --command \
            "with removed as (delete from muk.events where source = 'muk-events-admin' and title like 'E2E-TEST r${{ github.run_id }} %' returning id) select 'swept ' || count(*) || ' stranded test event(s)' from removed"
