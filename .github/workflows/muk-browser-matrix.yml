name: muk.events browser matrix

# PR CI runs Chromium only, to stay fast. Firefox and WebKit run here, weekly,
# so cross-browser breakage still surfaces without putting six extra minutes on
# every pull request. (WebKit is the flaky one; retries are already configured
# in playwright.config.ts.)

on:
  workflow_call:
    secrets:
      NEXT_PUBLIC_SUPABASE_URL:
        required: true
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:
        required: true
      # The VAPID PUBLIC key — see muk-ci.yml's secrets block for why a value
      # that ships in every client bundle is passed like a secret. This suite
      # runs the same specs as the PR shards, so without it the notification
      # row is missing from the build here too and its spec cannot run.
      # required: false keeps the call working for a caller that has no key.
      NEXT_PUBLIC_VAPID_PUBLIC_KEY:
        required: false
      SUPABASE_DB_URL:
        required: true
      # Optional, exactly as in muk-ci.yml: the invite-acceptance,
      # access-request and password-reset completion specs create a real
      # (test-flagged) member and delete it again through the admin UI, whose
      # delete is a Next.js server action needing the service-role client.
      # Without the key those five specs self-skip, so this suite was checking
      # 43 of the 48 specs the PR shards check. required: false keeps forks and
      # any other caller working.
      SUPABASE_SERVICE_ROLE_KEY:
        required: false
      E2E_ADMIN_NAME:
        required: true
      E2E_ADMIN_PASSWORD:
        required: true
      E2E_ADMIN_EMAIL:
        required: true
      E2E_STAFF_NAME:
        required: true
      E2E_STAFF_PASSWORD:
        required: true
      E2E_STAFF_EMAIL:
        required: true
      E2E_TOGGLE_NAME:
        required: true
      E2E_TOGGLE_PASSWORD:
        required: true
      E2E_TOGGLE_EMAIL:
        required: true
      E2E_KIOSK_NAME:
        required: true
      E2E_KIOSK_PASSWORD:
        required: true
      E2E_KIOSK_EMAIL:
        required: true

permissions:
  contents: read

jobs:
  e2e:
    # ONE job for both engines, on purpose. This used to be a two-leg matrix
    # (firefox, webkit) serialized through the concurrency group below, and
    # that shape has a hole GitHub's semantics leave open: a group holds at
    # most one RUNNING and one PENDING job, and a job that becomes pending
    # cancels the job that was pending before it — `cancel-in-progress: false`
    # protects only the running one. So a run dispatched while another was in
    # flight queued both its legs at once, the second cancelled the first, and
    # the run ended `cancelled` with Firefox never having started (run
    # 33726913780, 2026-09-03). One job per run means one pending job per
    # run, and Playwright runs both projects off a single build and server —
    # one `npm run build` instead of two, which is the six minutes the old
    # comment below counted.
    name: Playwright firefox + webkit
    # Routed like ci.yml: self-hosted muk-ci pool, with the MUK_CI_LABELS
    # variable as the offline-runner escape hatch (see runner-watchdog.yml).
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    # Both engines in one job measure ~12 minutes against production (one
    # build, then ~5-6 minutes per engine), and the point of the cap is a
    # wedged WebKit — which used to hold a runner for a full 40 (2026-07-19,
    # ~2h of blocked CI across legs; 2026-08-16, a 200-minute cancelled run).
    # Twice the measured run is still comfortably below the stuck-run reaper.
    timeout-minutes: 25
    env:
      # :3100 is the port the PR e2e job USED to own. That job now runs in a
      # lane with a port of its own (3101-3104, scripts/stack-lane.mjs in
      # muk.events), so nothing else on the box binds 3100 any more and this
      # weekly run has it to itself. Kept explicit so the next reader does not
      # reach for 3000 and collide with a developer's `npm run dev`.
      E2E_PORT: "3100"
      # See ci.yml's e2e job: the install-time cache GC hangs on TCC-protected
      # paths when run from a launchd runner.
      PLAYWRIGHT_SKIP_BROWSER_GC: "1"
    # THE ONLY SUITE LEFT THAT WRITES TO PRODUCTION. Since 2026-08-10 the PR
    # e2e builds its own local stack, so nothing on the merge path touches
    # these accounts any more — which also means nothing on the merge path
    # would reveal a sweep that stopped cleaning up after itself. This weekly,
    # unattended run is now the whole of that surface
    # (muk.events docs/audit-2026-08-12-ci-cd.md, C3).
    #
    # The group therefore guards one thing: two RUNS never drive account SET 1
    # at the same time (nothing here sets E2E_ACCOUNT_SET, and
    # mutations.spec.ts demotes and re-promotes the toggle account). It used
    # to be shared with ci.yml's shard 1; that membership is gone, and the
    # name is kept because renaming a concurrency group mid-flight lets an
    # in-flight run through it. A run dispatched during another waits for it;
    # a THIRD dispatched while one is already waiting replaces the waiting one
    # (see the job comment above) — which is the right outcome for a manual
    # re-run, and the only shape the group's semantics allow.
    concurrency:
      group: e2e-prod-set-1
      cancel-in-progress: false
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Playwright firefox + webkit

          Weekly cross-browser regression. Pull requests run Chromium only, to stay fast; Firefox and WebKit run here — both engines off one build — so cross-browser breakage still surfaces without adding minutes to every pull request.

          ❌ Something is broken in one of these engines specifically; the Playwright summary names which. This suite is the only one that meets the PRODUCTION database, so before reading a failure as a browser regression check whether it is a property of the live data (a seat that was registered but never seeded, a released evening that does not exist this week). WebKit is the historically flaky one and already has retries configured.
          TLDR

      # Without the E2E_* secrets the authenticated suites self-skip and the
      # weekly cross-browser canary silently proves nothing. Fail loudly.
      - name: Required secrets are present
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          E2E_ADMIN_NAME: ${{ secrets.E2E_ADMIN_NAME }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_STAFF_NAME: ${{ secrets.E2E_STAFF_NAME }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
          E2E_TOGGLE_NAME: ${{ secrets.E2E_TOGGLE_NAME }}
          E2E_TOGGLE_PASSWORD: ${{ secrets.E2E_TOGGLE_PASSWORD }}
          E2E_TOGGLE_EMAIL: ${{ secrets.E2E_TOGGLE_EMAIL }}
          E2E_KIOSK_NAME: ${{ secrets.E2E_KIOSK_NAME }}
          E2E_KIOSK_PASSWORD: ${{ secrets.E2E_KIOSK_PASSWORD }}
          E2E_KIOSK_EMAIL: ${{ secrets.E2E_KIOSK_EMAIL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
                      SUPABASE_DB_URL \
                      E2E_ADMIN_NAME E2E_ADMIN_PASSWORD E2E_ADMIN_EMAIL \
                      E2E_STAFF_NAME E2E_STAFF_PASSWORD E2E_STAFF_EMAIL \
                      E2E_TOGGLE_NAME E2E_TOGGLE_PASSWORD E2E_TOGGLE_EMAIL \
                      E2E_KIOSK_NAME E2E_KIOSK_PASSWORD E2E_KIOSK_EMAIL; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing — the authenticated suites would self-skip and this canary would silently prove nothing."
            exit 1
          fi
          # Optional (see the secrets block), so this warns rather than fails —
          # but it must not pass unremarked: five specs self-skipping is exactly
          # the quiet loss of coverage this step exists to make visible.
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY is absent — the invite-acceptance, access-request and password-reset completion specs will self-skip, so this run checks 43 of 48 specs."
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          # The self-hosted box persists ~/.npm. GitHub's remote cache is much
          # larger and slower to restore than a warm npm ci on this runner.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps firefox webkit

      # See the identical step in ci.yml — clears a dead run's leftover server.
      - name: Free the e2e port
        shell: bash
        run: lsof -ti :"$E2E_PORT" | xargs kill 2>/dev/null || true

      - name: Run e2e tests
        run: npm run test:e2e -- --project=firefox --project=webkit
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          # Read by the app under test, not by Playwright: the admin UI's
          # delete-user server action needs the service-role client to remove
          # the member the completion specs create. Playwright reads it too,
          # but only to decide whether those specs may run at all.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ADMIN_NAME: ${{ secrets.E2E_ADMIN_NAME }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_STAFF_NAME: ${{ secrets.E2E_STAFF_NAME }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
          E2E_TOGGLE_NAME: ${{ secrets.E2E_TOGGLE_NAME }}
          E2E_TOGGLE_PASSWORD: ${{ secrets.E2E_TOGGLE_PASSWORD }}
          E2E_TOGGLE_EMAIL: ${{ secrets.E2E_TOGGLE_EMAIL }}
          E2E_KIOSK_NAME: ${{ secrets.E2E_KIOSK_NAME }}
          E2E_KIOSK_PASSWORD: ${{ secrets.E2E_KIOSK_PASSWORD }}
          E2E_KIOSK_EMAIL: ${{ secrets.E2E_KIOSK_EMAIL }}

      # The twin of muk-ci.yml's "Release the lane's app port". Without it a
      # CANCELLED matrix run leaves Playwright's `sh -c "npm run build && npm
      # run start"` chain alive on :3100 — cancellation kills the step, not the
      # server, and the pre-step above only runs on this job's NEXT visit to
      # the same runner, a week later. The 04:59 UTC run on 2026-08-23 was
      # cancelled and its `next start` was still serving an 8-hour-old commit
      # on runner 1 that afternoon (muk.events
      # docs/audit-2026-08-23-concurrency.md, C3). `always()` runs on cancel.
      - name: Release the e2e port
        if: ${{ always() }}
        shell: bash
        run: lsof -ti :"$E2E_PORT" | xargs kill 2>/dev/null || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-browser-matrix
          path: playwright-report/
          # Three days, not seven. This report is failure debris — it is
          # uploaded on every run but weighs ~200 MB only when the suite is
          # red, and one red week was 40% of the caller's whole shared-storage
          # allowance on its own (muk.events#1400, measured 2026-09-15). The
          # suite runs weekly and the canary files its issue the next morning,
          # so three days covers the triage that actually happens and
          # guarantees the report is gone before the next week's run replaces
          # it. A report worth keeping past that is downloaded, which is the
          # honest way to keep one.
          retention-days: 3

      # Same run-scoped sweep as ci.yml — see the comment there. One job per
      # run now, so this sweep can only ever catch this run's own debris.
      - name: Sweep this run's test events
        if: ${{ always() }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then exit 0; fi
          psql "$SUPABASE_DB_URL" --no-psqlrc --tuples-only --command \
            "with removed as (delete from muk.events where source = 'muk-events-admin' and title like 'E2E-TEST r${{ github.run_id }} %' returning id) select 'swept ' || count(*) || ' stranded test event(s)' from removed"
