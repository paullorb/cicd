name: muk.events runner watchdog

# The alarm for the self-hosted pool, from outside it. Every other workflow
# reads its runs-on labels from the MUK_CI_LABELS repo variable; this is the
# only scheduled job that must stay on GitHub-hosted runners, because its
# whole purpose is to work when the runner box does not.
#
# It no longer fails CI over to hosted runners. Until 2026-11 it flipped
# MUK_CI_LABELS to ["ubuntu-latest"] when the pool was down, and that flip is
# not narrow: the variable routes EVERY workflow, so the heartbeat (every 15
# minutes), the reaper, the nightlies and each PR's browser suite all moved to
# billed minutes at once. The one episode of November 2026 (06 to 07) cost 263
# hosted minutes in a day, 42% of the repo's month, for a box that needed one
# login. A queue that waits for the box costs nothing; so the pool being down
# is now an alarm and a task, never a spend:
#
#   - no `muk-ci` runner online: the run fails (GitHub emails the owner) and
#     one `for-paul` issue is opened with the restart command, so it shows on
#     status.paullorber.com until the pool is back, when it closes itself;
#   - no runner carries `muk-e2e` while MUK_E2E_LABELS asks for it: the same
#     alarm, since the required browser check would queue for ever;
#   - routing is only ever moved HOME: a MUK_CI_LABELS or MUK_E2E_LABELS left
#     on a hosted label by hand is set back to the pool once it is online, so
#     the manual escape hatch cannot be forgotten switched on.
#
# The escape hatch itself stays manual and deliberate: set MUK_CI_LABELS to
# ["ubuntu-latest"] in Settings → Secrets and variables → Actions → Variables.
# That is a decision to spend the quota, which is why no job takes it.
#
# The Mac-side dead-man's switch (muk.events' scripts/runner-heartbeat.mjs,
# healthchecks.io, every 5 minutes) is the fast alarm; this is the slow second
# one that does not depend on that script or its URL file, which is why the
# caller schedules it once a day and not every six hours.
#
# Two modes:
#   - With the RUNNER_WATCHDOG_TOKEN secret (fine-grained PAT for this repo,
#     Administration: read + Variables: read/write): reads the runners' real
#     status.
#   - Without it: cannot read runner status, so it only looks for runs stuck
#     in queue and raises the same alarm.

on:
  workflow_call:
    secrets:
      RUNNER_WATCHDOG_TOKEN:
        required: false

permissions:
  actions: read
  issues: write

concurrency:
  group: runner-watchdog
  cancel-in-progress: true

jobs:
  route:
    name: The runner pool is online
    # Hosted on purpose, and the reason is in the header: allowlisted as the
    # watchdog in paullorb/paullorber's scripts/lib/hosted-runners.mjs.
    runs-on: ubuntu-latest
    # A handful of API calls; a billed minute is the unit, so nothing here may
    # install, check out or wait.
    timeout-minutes: 3
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### The runner pool is online

          The alarm for the self-hosted runners, run from outside them: it is the only scheduled job on GitHub-hosted runners, because its entire purpose is to work when the runner machine does not.

          ❌ No `muk-ci` runner is online (or none carries `muk-e2e`), so CI is queueing. Nothing fails over to hosted runners: log in to the Mac Studio and run the command in the `for-paul` issue this job opened. It closes itself on the next green run.
          TLDR

      - name: Check the muk-ci runners
        env:
          GH_TOKEN: ${{ secrets.RUNNER_WATCHDOG_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF_HOSTED: '["self-hosted","muk-ci"]'
          E2E_SELF_HOSTED: '["self-hosted","muk-e2e"]'
          ISSUE_TITLE: "Self-hosted runners are offline: CI is queueing"
        run: |
          set -uo pipefail
          problem=""

          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RUNNER_WATCHDOG_TOKEN not set, so runner status cannot be read. Create a fine-grained PAT for this repo with Administration:read and Variables:read/write and store it as that secret."
            export GH_TOKEN="$FALLBACK_TOKEN"
            # Degraded mode: infer trouble from runs stuck in queue. A run can
            # also queue behind a busy runner, so use a generous age.
            cutoff="$(date -u -d '45 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
            stuck=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?status=queued&per_page=50" \
              --jq "[.workflow_runs[] | select(.created_at < \"$cutoff\")] | length") || {
              # A failed lookup is no evidence the pool is up: fail without
              # touching (or closing) the for-paul issue.
              echo "::error::Could not read the queued runs, so this alarm is blind this time. Any open for-paul issue is left as it is."
              exit 1
            }
            if [ "$stuck" -gt 0 ]; then
              problem="$stuck workflow run(s) have been queued for over 45 minutes, so the muk-ci runners are probably down (or very busy)."
            else
              echo "No stuck runs; assuming the muk-ci pool is healthy."
            fi
          else
            runners="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runners?per_page=100")" || {
              echo "::error::Could not read the runners (RUNNER_WATCHDOG_TOKEN expired, or without Administration:read). Renew it; until then this alarm is blind."
              exit 1
            }
            online=$(jq '[.runners[] | select(.status == "online") | select(any(.labels[]; .name == "muk-ci"))] | length' <<<"$runners")
            e2e_online=$(jq '[.runners[] | select(.status == "online") | select(any(.labels[]; .name == "muk-e2e"))] | length' <<<"$runners")
            echo "$online muk-ci runner(s) online, $e2e_online of them labelled muk-e2e."

            # Home only. A variable that is missing needs nothing: every
            # workflow's `|| '["self-hosted","muk-ci"]'` already routes home.
            current=$(gh api "/repos/$GITHUB_REPOSITORY/actions/variables/MUK_CI_LABELS" --jq '.value' 2>/dev/null || echo "")
            if [ "$online" -ge 1 ] && [ -n "$current" ] && [ "$current" != "$SELF_HOSTED" ]; then
              gh api -X PATCH "/repos/$GITHUB_REPOSITORY/actions/variables/MUK_CI_LABELS" \
                -f name=MUK_CI_LABELS -f value="$SELF_HOSTED" >/dev/null
              echo "::warning::MUK_CI_LABELS was '$current' while the pool is online; set back to '$SELF_HOSTED'."
            fi
            e2e_current=$(gh api "/repos/$GITHUB_REPOSITORY/actions/variables/MUK_E2E_LABELS" --jq '.value' 2>/dev/null || echo "")
            if [ "$e2e_online" -ge 1 ] && [ -n "$e2e_current" ] && [ "$e2e_current" != "$E2E_SELF_HOSTED" ]; then
              gh api -X PATCH "/repos/$GITHUB_REPOSITORY/actions/variables/MUK_E2E_LABELS" \
                -f name=MUK_E2E_LABELS -f value="$E2E_SELF_HOSTED" >/dev/null
              echo "::warning::MUK_E2E_LABELS was '$e2e_current' while a muk-e2e runner is online; set back to '$E2E_SELF_HOSTED'."
            fi

            if [ "$online" -eq 0 ]; then
              problem="No muk-ci runner is online."
            elif [ "$e2e_online" -eq 0 ] && [ "$e2e_current" = "$E2E_SELF_HOSTED" ]; then
              # Counted over the muk-e2e SUBSET: with every one of those
              # offline and an ordinary runner up, the required browser check
              # queues for ever with nothing red to say why.
              problem="$online muk-ci runner(s) are online but none carries the muk-e2e label, so every pull request's browser suite is queueing. Label one: gh api -X POST /repos/$GITHUB_REPOSITORY/actions/runners/<id>/labels -f 'labels[]=muk-e2e'"
            fi
          fi

          # The issue is written with the job's own token: the PAT has no
          # Issues scope and does not need one.
          export GH_TOKEN="$FALLBACK_TOKEN"
          open=$(gh api "/repos/$GITHUB_REPOSITORY/issues?state=open&labels=for-paul&per_page=100" \
            --jq "[.[] | select(.title == \"$ISSUE_TITLE\") | .number] | first // empty" 2>/dev/null || echo "")

          if [ -z "$problem" ]; then
            if [ -n "$open" ]; then
              gh api -X POST "/repos/$GITHUB_REPOSITORY/issues/$open/comments" \
                -f body="The pool is back: the watchdog found it online at $(date -u +%Y-%m-%dT%H:%MZ). Closing." >/dev/null || true
              gh api -X PATCH "/repos/$GITHUB_REPOSITORY/issues/$open" -f state=closed -f state_reason=completed >/dev/null || true
              echo "Closed #$open: the pool is back."
            fi
            exit 0
          fi

          body_file="$RUNNER_TEMP/runner-issue.md"
          {
            echo "$problem Found by the hosted watchdog at $(date -u +%Y-%m-%dT%H:%MZ) ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo "Nothing fails over to GitHub-hosted runners: CI queues until the pool is back, and queued runs start by themselves once it is."
            echo
            echo "On the Mac Studio, logged in (the runners are LaunchAgents, and after a cold boot FileVault waits at the unlock screen):"
            echo
            echo '```sh'
            # shellcheck disable=SC2016 # printed for a person to paste, not expanded here
            echo 'for d in ~/actions-runner-*; do (cd "$d" && ./svc.sh start; ./svc.sh status | tail -2); done'
            echo '```'
            echo
            echo "Still offline after that: the runbook is \"When the runners are down\" in paullorb/cicd's README."
            echo
            echo "This issue closes itself on the watchdog's next green run (dispatch \`Runner watchdog\` to have that now)."
          } > "$body_file"

          if [ -z "$open" ]; then
            gh api -X POST "/repos/$GITHUB_REPOSITORY/issues" \
              -f title="$ISSUE_TITLE" -f "labels[]=for-paul" -F body=@"$body_file" --jq '"Opened #\(.number)."' \
              || echo "::warning::Could not open the for-paul issue (the caller must grant issues: write); the failed run is the only alarm."
          else
            gh api -X PATCH "/repos/$GITHUB_REPOSITORY/issues/$open" -F body=@"$body_file" >/dev/null || true
            echo "Rewrote #$open: still down."
          fi

          echo "::error::$problem CI is queueing, not failing over. See the for-paul issue for the restart command."
          exit 1
