name: muk.events runner watchdog

# The router for the self-hosted migration. Every other workflow reads its
# runs-on labels from the MUK_CI_LABELS repo variable; this is the only job
# that must stay on GitHub-hosted runners, because its whole purpose is to
# work when the runner box does not.
#
# Why a 6-hourly watchdog and not a per-run router job: a router fronting
# every CI run would itself bill one hosted minute per run (~340 CI runs a
# month — more than this month's remaining budget on its own). Flipping a
# variable out-of-band costs ~4 billed minutes a day and routing stays free
# on every actual CI run. The trade-off is failover lag: with the box down,
# CI sits queued for up to 6 hours before the flip. workflow_dispatch is the
# manual override — runnable from the GitHub mobile app.
#
# Two modes:
#   - With the RUNNER_WATCHDOG_TOKEN secret (fine-grained PAT for this repo,
#     Administration: read + Variables: read/write — and, to auto-reroute
#     stranded PRs, Actions: read/write): checks whether any muk-ci runner is
#     online and sets MUK_CI_LABELS to the self-hosted pool or ubuntu-latest
#     accordingly. When it flips to ubuntu-latest it also cancels any PR CI
#     runs stuck in queue against the dead pool, so ci-retry.yml reruns them on
#     the hosted label — no manual dispatch. Fails (= emails the owner)
#     whenever the pool is down, so the flip never happens silently. If the PAT
#     lacks Actions:write the cancel is skipped with a warning; everything else
#     is unaffected.
#   - Without it: cannot read runner status or write variables, so it only
#     looks for CI runs stuck in queue and fails to raise the alarm; routing
#     then has to be flipped by hand in Settings → Secrets and variables →
#     Actions → Variables.

on:
  workflow_call:
    secrets:
      RUNNER_WATCHDOG_TOKEN:
        required: false

permissions:
  actions: read

concurrency:
  group: runner-watchdog
  cancel-in-progress: true

jobs:
  route:
    name: Route CI to a live runner pool
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Route CI to a live runner pool

          The failover switch for the self-hosted runners. Every other job reads its runner labels from a repository variable; this is the only job that must stay on GitHub-hosted runners, because its entire purpose is to work when the runner machine does not.

          ❌ Doubles as the runner-is-down alarm. With the token configured, routing has already flipped to hosted runners automatically and CI keeps working with up to six hours of failover lag; without it, flip `MUK_CI_LABELS` by hand in the repository variables.
          TLDR

      - name: Check muk-ci runners and set MUK_CI_LABELS
        env:
          GH_TOKEN: ${{ secrets.RUNNER_WATCHDOG_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELF_HOSTED: '["self-hosted","muk-ci"]'
          HOSTED: '["ubuntu-latest"]'
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RUNNER_WATCHDOG_TOKEN not set — automatic failover is disabled. Create a fine-grained PAT for this repo with Administration:read and Variables:read/write and store it as that secret."
            export GH_TOKEN="$FALLBACK_TOKEN"
            # Degraded mode: infer trouble from CI runs stuck in queue. A run
            # can also queue behind a busy runner, so use a generous age.
            cutoff="$(date -u -v-45M +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d '45 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
            stuck=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?status=queued&per_page=50" \
              --jq "[.workflow_runs[] | select(.created_at < \"$cutoff\")] | length")
            if [ "$stuck" -gt 0 ]; then
              echo "::error::$stuck workflow run(s) have been queued for over 45 minutes — the muk-ci runners are probably down (or just very busy). Bring the box back, or flip MUK_CI_LABELS to [\"ubuntu-latest\"] in Settings → Variables."
              exit 1
            fi
            echo "No stuck runs; assuming the muk-ci pool is healthy."
            exit 0
          fi

          online=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runners" \
            --jq '[.runners[] | select(.status == "online") | select(any(.labels[]; .name == "muk-ci"))] | length')
          current=$(gh api "/repos/$GITHUB_REPOSITORY/actions/variables/MUK_CI_LABELS" --jq '.value' 2>/dev/null || echo "")

          if [ "$online" -ge 1 ]; then desired="$SELF_HOSTED"; else desired="$HOSTED"; fi

          # PATCH cannot bootstrap a deleted variable (separate create/update
          # endpoints — Codex P2 on PR #144), and routing must keep working in
          # exactly that state, so recreate it when the GET came back empty.
          if [ -z "$current" ]; then
            gh api -X POST "/repos/$GITHUB_REPOSITORY/actions/variables" \
              -f name=MUK_CI_LABELS -f value="$desired"
            echo "MUK_CI_LABELS was missing — created as '$desired' ($online muk-ci runner(s) online)"
          elif [ "$current" != "$desired" ]; then
            gh api -X PATCH "/repos/$GITHUB_REPOSITORY/actions/variables/MUK_CI_LABELS" \
              -f name=MUK_CI_LABELS -f value="$desired"
            echo "MUK_CI_LABELS: '$current' -> '$desired' ($online muk-ci runner(s) online)"
          else
            echo "MUK_CI_LABELS already '$current' ($online muk-ci runner(s) online)"
          fi

          if [ "$online" -eq 0 ]; then
            # Routing now points at ubuntu-latest, but a PR whose CI run was
            # dispatched while the pool was dead is stuck in `queued` against the
            # self-hosted label and will sit there forever: a queued run never
            # reaches the `cancelled` conclusion that ci-retry.yml waits on, so
            # nothing reruns it. Cancel those runs here — the cancel makes
            # ci-retry rerun each one, and the rerun re-reads MUK_CI_LABELS (just
            # flipped to hosted) and lands on ubuntu-latest. No manual dispatch.
            #
            # Only pull_request runs of muk's CI workflow: ci-retry rescues PR
            # runs only, so cancelling a queued main-push run would kill its
            # deploy with nothing to resurrect it — leave those for a returning
            # runner or a human. The >5-min age guard skips a run that was
            # created as the box died and might still get picked up.
            #
            # Cancel with the PAT, never the implicit GITHUB_TOKEN: a run
            # cancelled by GITHUB_TOKEN does NOT emit the workflow_run event that
            # triggers ci-retry, so the rescue would silently do nothing. This
            # needs Actions:write on RUNNER_WATCHDOG_TOKEN (alongside its
            # existing Administration:read + Variables:read/write). Until that
            # scope is added the cancel 403s — warn and carry on, so routing and
            # the alarm below are unaffected and behaviour degrades to today's
            # (flip + manual re-run), not worse.
            cutoff="$(date -u -v-5M +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?status=queued&event=pull_request&per_page=50" \
              --jq ".workflow_runs[] | select(.created_at < \"$cutoff\") | .id" 2>/dev/null \
            | while read -r run_id; do
                [ -n "$run_id" ] || continue
                if gh api -X POST "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1; then
                  echo "Cancelled stranded queued PR run $run_id — ci-retry will rerun it on ubuntu-latest."
                else
                  echo "::warning::Could not cancel queued run $run_id (RUNNER_WATCHDOG_TOKEN likely lacks Actions:write). Add that scope so stranded PRs auto-reroute; until then re-run them by hand from the Actions tab."
                fi
              done || true  # a failed GET must not pre-empt the alarm below
            echo "::error::No muk-ci runner online — CI is routed to ubuntu-latest and is burning paid minutes. Bring the box back; the next watchdog run (or a manual dispatch of this workflow) routes CI home."
            exit 1
          fi
