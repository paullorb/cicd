name: muk.events CI

on:
  workflow_call:
    secrets:
      NEXT_PUBLIC_SUPABASE_URL:
        required: true
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:
        required: true
      SUPABASE_DB_URL:
        required: true
      SUPABASE_ACCESS_TOKEN:
        required: true
      E2E_ADMIN_NAME:
        required: true
      E2E_ADMIN_PASSWORD:
        required: true
      E2E_ADMIN_EMAIL:
        required: true
      E2E_STAFF_NAME:
        required: true
      E2E_STAFF_PASSWORD:
        required: true
      E2E_STAFF_EMAIL:
        required: true
      E2E_TOGGLE_NAME:
        required: true
      E2E_TOGGLE_PASSWORD:
        required: true
      E2E_TOGGLE_EMAIL:
        required: true
      E2E_KIOSK_NAME:
        required: true
      E2E_KIOSK_PASSWORD:
        required: true
      E2E_KIOSK_EMAIL:
        required: true
      # Optional: the Playwright suite's invite-acceptance specs create a test
      # member and then delete it again through the admin UI, whose delete is a
      # Next.js server action needing the service-role client. Without the key
      # those specs self-skip (see tests/invite.spec.ts), so it stays optional
      # and forks keep working.
      SUPABASE_SERVICE_ROLE_KEY:
        required: false
      # Optional: only consumed by the deploy-preview / deploy-app jobs, which
      # are themselves gated on the VERCEL_DEPLOY_ENABLED repo variable. Absent
      # until the Vercel-from-CI cutover, so keep them optional (a missing
      # optional secret passes through as an empty string).
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false

permissions:
  contents: read

env:
  # Not a secret: the project ref is already recorded in supabase/MIGRATIONS.md.
  SUPABASE_PROJECT_REF: dtuisqhdkomdvbxzzifu

# Every job runs on the self-hosted muk-ci pool by default — GitHub-hosted
# minutes were about to breach the plan cap. The labels come from the
# MUK_CI_LABELS repo variable so CI can be re-routed to ubuntu-latest without
# a commit: runner-watchdog.yml flips the variable when no muk-ci runner is
# online (and back), and a human can flip it in Settings → Variables from a
# phone. The fallback literal keeps the expression working if the variable is
# ever deleted. See docs/self-hosted-runners.md.
#
# timeout-minutes on every job is not optional here: a hung job on a
# self-hosted runner holds one of the machine's few slots for the default
# 6 hours.
#
# Dependabot PRs run on ubuntu-latest, not the muk-ci pool: a dependency bump
# is the one PR whose code nobody wrote — a malicious package could target the
# persistent Mac Studio (and the mirrored Dependabot secrets) from an install
# script or a test. Hosted VMs are disposable, so that blast radius dies with
# the job. This is the same execution path as the runner-watchdog hosted
# fallback, so it needs no extra maintenance. Belt-and-braces with this,
# `npm ci --ignore-scripts` below keeps lifecycle scripts from running on ANY
# PR (verified 2026-07-22: check + build + e2e need no install scripts;
# Playwright browsers install in their own explicit step).

jobs:
  quality:
    name: Lint, typecheck, edge functions & build
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          # The self-hosted machine already keeps ~/.npm between jobs. The
          # Actions cache lives in GitHub's cloud and was downloading the same
          # 1.4 GB archive once per job, taking ~7 minutes to save ~10 seconds
          # in npm ci. Keep it off even during the hosted fallback.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `npm audit` is NOT run here. As a step in this required job it would fail
      # every PR and every main push the moment a new advisory is published for a
      # production dependency — an event that has nothing to do with the change
      # under review — and, because auto-merge blocks on this check, would wedge
      # the entire merge queue until someone intervened. The audit runs instead
      # as a nightly hard-fail alarm in muk-scheduled-checks.yml, where a fresh
      # CVE emails the owner within a day without blocking unrelated delivery.

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      # The fast, deterministic per-PR performance gate. It reads the client JS
      # this build just emitted under .next and fails if the gzipped shared or
      # total bundle exceeds bundle-budgets.json — no Chrome, no server, nothing
      # timing-sensitive, so it never flakes when the shared runner pool is busy.
      # It replaced the per-PR Lighthouse "budget" job, whose error-level
      # performance *score* dropped under CPU contention and blocked auto-merge;
      # the full Lighthouse audit (network byte budgets + category scores, 3
      # samples) now runs nightly in muk-scheduled-checks.yml on the idle box.
      # Piggybacking on this already-required job means no second build, no extra
      # load on the pool, and no new required status check.
      - name: Assert bundle budgets
        run: node scripts/assert-bundle-budgets.mjs .next

  # Shift-left secret detection. The pipeline's orbit holds a service-role key,
  # the prod DB URL, a PAT and push keys; a credential committed today would
  # otherwise land on main unnoticed (the repo is private without Advanced
  # Security, so GitHub itself scans nothing). Full history was verified clean
  # on 2026-07-22 (429 commits), so this runs blocking with no baseline config.
  # No secrets needed, so it runs identically on forks and Dependabot PRs.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Scan history, not just the tip: a secret committed and then
          # "removed" in a follow-up commit is still in every clone.
          fetch-depth: 0

      # The pinned binary, not gitleaks/gitleaks-action: the action failed two
      # different ways on day one — a 403 computing its PR scan range (needs
      # pull-requests: read) and a fixed $TMPDIR/gitleaks.tmp download path
      # that collides with its own debris on a persistent self-hosted runner.
      # The raw binary needs no token, no per-event range logic, and a full
      # 429-commit history scan measured ~1s, so every event just scans
      # everything. Checksums pinned from the v8.24.3 release manifest.
      - name: Install gitleaks
        shell: bash
        run: |
          case "$RUNNER_OS $(uname -m)" in
            "macOS arm64")
              asset=gitleaks_8.24.3_darwin_arm64.tar.gz
              sha=b90f13bb8c90ab72083d9b0c842e39dafb82c0e5c3f872f407366b7a58909013 ;;
            "Linux x86_64")
              asset=gitleaks_8.24.3_linux_x64.tar.gz
              sha=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c ;;
            *)
              echo "::error::No pinned gitleaks build for $RUNNER_OS/$(uname -m) — add its checksum here."
              exit 1 ;;
          esac
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/$asset" \
            -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "$sha  $RUNNER_TEMP/gitleaks.tgz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the full history for secrets
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" git . \
            --no-banner --redact --exit-code 1 \
            --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif" \
            || { echo "::error::gitleaks found committed secret(s) — see the log above (values redacted). Rotate the credential first, then rewrite history; deleting the line in a new commit does NOT remove it from clones."; exit 1; }

  # Shift-left half of the dependency story. The nightly audit in
  # muk-scheduled-checks.yml catches advisories published for dependencies we
  # already ship (see the note in the quality job for why that cannot block
  # PRs); this job blocks the other direction — a PR *introducing* a
  # known-vulnerable production dependency. It audits only when the PR touches
  # the lockfile, so an advisory published mid-flight can never wedge unrelated
  # PRs: they skip the audit step and the check stays green.
  deps-audit:
    name: Dependency audit (lockfile PRs)
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Needed to diff against the PR base.
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Audit production dependencies when the lockfile changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qx 'package-lock.json'; then
            echo "package-lock.json untouched — no new dependencies to audit."
            exit 0
          fi
          # Known limitation, accepted: this flags pre-existing high advisories
          # too, not only ones this PR introduces. Such an advisory would have
          # failed the nightly audit within a day anyway — fixing it unblocks
          # both alarms at once.
          npm audit --omit=dev --audit-level=high

  rules:
    name: Project rules
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 15
    steps:
      # Every secret-gated step below self-skips when its secret is absent
      # (correct for forks; this repo is private, so there are none). Without
      # this assertion a rotated/renamed secret — or a Dependabot PR, which
      # only receives *Dependabot* secrets — silently turns the whole job into
      # a no-op that still reports green. Fail loudly instead.
      - name: Required secrets are present
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          missing=""
          [ -n "$SUPABASE_DB_URL" ] || missing="$missing SUPABASE_DB_URL"
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing — every check in this job would silently pass while enforcing nothing. On a Dependabot PR this means the Actions secrets have not been mirrored to Dependabot secrets (gh secret set <NAME> --app dependabot)."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Both sides of the diff have to be present to compare them.
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: New muk RLS policies are scoped to muk membership
        if: github.event_name == 'pull_request'
        run: node scripts/lint-migration-rls.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      # Read-only, and it runs on PRs rather than only at deploy time for two
      # reasons: it catches prod drifting from the repo *before* you stack
      # another migration on top of it, and it proves SUPABASE_DB_URL still
      # works while a failure is still cheap — rather than at the moment the
      # deploy job first needs it.
      #
      # Deliberately NOT strict: a migration awaiting deploy is normal pipeline
      # state here, not drift. The first strict version of this step deadlocked
      # main — deploy-db needs this job green, and this job rejected the very
      # migration deploy-db existed to apply. Renames still fail; "prod never
      # got it" is enforced where it means something: post-deploy and nightly.
      - name: Prod schema is in sync and muk RLS is still scoped
        id: drift
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::SUPABASE_DB_URL not set — skipping the prod schema checks."
            exit 0
          fi

          # psql only treats its argument as a URI when it starts with the
          # scheme; anything else it reads as a bare database name and quietly
          # dials a local unix socket, which fails with a baffling error. Say
          # what is actually wrong instead.
          case "$SUPABASE_DB_URL" in
            postgresql://*|postgres://*) ;;
            *)
              echo "::error::SUPABASE_DB_URL is set but is not a connection URI — psql read it as a database name and tried a local socket. It must start with 'postgresql://'. Copy the Session pooler URI from Supabase → Connect (host aws-*.pooler.supabase.com, port 5432, user postgres.<ref>), substitute the password, and store it with no surrounding quotes and no 'SUPABASE_DB_URL=' prefix. If the password contains @ : / ? # or %, percent-encode it."
              exit 1
              ;;
          esac

          node scripts/check-migration-drift.mjs
          psql "$SUPABASE_DB_URL" --no-psqlrc -v ON_ERROR_STOP=1 -f scripts/assert-rls-scoping.sql

      # Skipped while migrations await deploy: committed types are generated
      # FROM prod, so they cannot match a schema prod doesn't have yet. The
      # nightly run re-checks strictly once the deploy has landed.
      # A custom `if:` drops the implicit success() guard, so without it this
      # step would still run after the drift step above failed. Keep success().
      - name: types/supabase.ts matches the prod schema
        if: success() && (steps.drift.outputs.pending == '' || steps.drift.outputs.pending == '0')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN not set — skipping the generated-types drift check."
            exit 0
          fi
          npx --yes supabase@2.105.0 gen types typescript \
            --project-id "$SUPABASE_PROJECT_REF" --schema muk > /tmp/supabase.ts
          # The comparison lives in muk.events (scripts/ is app-owned): it names
          # the migration that caused the drift instead of only reporting that
          # the file is stale.
          node scripts/check-types-drift.mjs /tmp/supabase.ts

  # Read-only mirror of the two deploy jobs, visible as its own green check on
  # every PR: are prod's schema AND edge functions in sync with what the repo
  # says, and what exactly will the merge deploy? The migrations half repeats
  # the rules job's non-strict drift check purely for visibility; the functions
  # half is the only staleness check the functions have before merge — it
  # catches a main whose function changes never deployed (e.g. the deploy jobs
  # were skipped because another job was red, which happened three merges in a
  # row on 2026-07-13). Both halves self-skip without their secret, so forks
  # stay green.
  sync:
    name: Prod sync (migrations & edge functions)
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 15
    steps:
      # See the identical step in the rules job.
      - name: Required secrets are present
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          missing=""
          [ -n "$SUPABASE_DB_URL" ] || missing="$missing SUPABASE_DB_URL"
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing — both sync checks would silently skip. On a Dependabot PR, mirror the Actions secrets to Dependabot secrets."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The staleness check dates each function's last source change at the
          # BASE of the PR, which needs history beyond the merge commit.
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.105.0 # pinned — this binary holds SUPABASE_ACCESS_TOKEN / the prod DB URL

      - name: Migrations match the prod ledger
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::SUPABASE_DB_URL not set — skipping the migration sync check."
            exit 0
          fi
          # Non-strict: a migration this PR adds is "awaiting deploy", not
          # drift. Renames and lost migrations still fail.
          node scripts/check-migration-drift.mjs

      - name: Edge functions are deployed and not stale
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # The PR's own function changes deploy on merge; only the base
          # branch's sources must already be live.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN not set — skipping the edge function sync check."
            exit 0
          fi
          node scripts/check-functions-sync.mjs

  # Proves every muk migration still applies, in filename order, to an empty
  # database with only the Supabase scaffolding (scripts/ci-db-shim.sql) in
  # place — before deploy-db replays the new ones onto shared prod. This
  # replaced creating a paid Supabase preview branch per check. Scratch
  # databases are named by run id, so concurrent runs — this repo's or any
  # other repo's served by this pipeline — never collide. Files in
  # scripts/ci-db-replay-skip.txt (other apps' migrations recorded in the
  # shared ledger) are skipped, exactly as `supabase db push` skips them.
  migrations:
    name: Migrations replay (scratch Postgres)
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 10
    env:
      SCRATCH_DB: muk_ci_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Ensure a local PostgreSQL with the pg_cron stub
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Hosted fallback (runner-watchdog flipped MUK_CI_LABELS): the
            # ubuntu image ships a stopped PostgreSQL. Its major version may
            # trail prod's 17 — acceptable for a does-it-apply check.
            sudo systemctl start postgresql
            sudo -u postgres createuser --superuser "$(whoami)" || true
            extdir="$(pg_config --sharedir)/extension"
            SUDO="sudo"
            echo "PGHOST=/var/run/postgresql" >> "$GITHUB_ENV"
            export PGHOST=/var/run/postgresql
          else
            # The Mac Studio runs Homebrew postgresql@17 as a brew service
            # (docs/self-hosted-runners.md). Its share dir is user-writable
            # but wiped by brew upgrades, so reinstall the stub every run.
            extdir="/opt/homebrew/opt/postgresql@17/share/postgresql/extension"
            SUDO=""
            echo "PGHOST=/tmp" >> "$GITHUB_ENV"
            export PGHOST=/tmp
          fi
          # Real pg_cron can only be created in the one database named by
          # cron.database_name, which breaks one-scratch-database-per-run.
          # The stub records schedule/unschedule calls in cron.job; nothing
          # executes in the background.
          $SUDO tee "$extdir/pg_cron.control" >/dev/null <<'EOF'
          comment = 'CI stub of pg_cron: schedule/unschedule write to cron.job, no background worker'
          default_version = '1.6'
          relocatable = false
          schema = cron
          EOF
          $SUDO tee "$extdir/pg_cron--1.6.sql" >/dev/null <<'EOF'
          \echo Use "CREATE EXTENSION pg_cron" to load this file. \quit
          create table job (
              jobid bigserial primary key,
              schedule text not null,
              command text not null,
              nodename text not null default 'localhost',
              nodeport int not null default 5432,
              database text not null default current_database(),
              username text not null default current_user,
              active boolean not null default true,
              jobname text unique
          );
          create function schedule(job_name text, schedule text, command text)
          returns bigint language sql as $$
              insert into cron.job (jobname, schedule, command)
              values (job_name, schedule, command)
              on conflict (jobname)
              do update set schedule = excluded.schedule, command = excluded.command
              returning jobid;
          $$;
          create function schedule(schedule text, command text)
          returns bigint language sql as $$
              insert into cron.job (schedule, command) values (schedule, command)
              returning jobid;
          $$;
          create function unschedule(job_name text)
          returns boolean language sql as $$
              delete from cron.job where jobname = job_name;
              select true;
          $$;
          EOF
          psql postgres -v ON_ERROR_STOP=1 -qtAc "select 'postgres ' || current_setting('server_version')"

      - name: Replay migrations onto a scratch database
        shell: bash
        run: |
          psql postgres -v ON_ERROR_STOP=1 -qc "create database \"$SCRATCH_DB\""
          psql "$SCRATCH_DB" -v ON_ERROR_STOP=1 -q -f scripts/ci-db-shim.sql
          for f in supabase/migrations/*.sql; do
            base=$(basename "$f")
            if grep -qxF "$base" scripts/ci-db-replay-skip.txt; then
              # A skipped migration with a same-named file in
              # scripts/ci-db-replay-overrides/ is replaced by that muk-only
              # twin at its own ledger position (see the override's header) —
              # skipping a mixed-app original wholesale would silently lose
              # its muk-side policy rewrites from the scratch schema.
              if [ -f "scripts/ci-db-replay-overrides/$base" ]; then
                echo "applying muk-only override for $base"
                psql "$SCRATCH_DB" -v ON_ERROR_STOP=1 -q -f "scripts/ci-db-replay-overrides/$base"
              else
                echo "skipped $base (another app's migration, see the skip list)"
              fi
              continue
            fi
            echo "applying $base"
            psql "$SCRATCH_DB" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # Same RLS-scoping assertion the deploy and nightly runs make against prod,
      # but here against the just-built scratch schema — so a migration that adds
      # an unscoped policy, a table without RLS, or (as in #163) a new SECURITY
      # DEFINER function granted to authenticated that was never added to the
      # reviewed allowlist FAILS AT PR TIME, before it reaches prod. The prod
      # assertion only sees such an object post-deploy (it queries live prod),
      # which is why #163 turned main red only after merge. The scratch snapshot
      # mirrors prod's hand-created state via scripts/ci-db-shim.sql (e.g. RLS on
      # muk.users); keep that faithful when this fails on an object prod is fine
      # with. It is a subset of prod's objects, so it never flags a policy or
      # function that the prod run would pass.
      - name: RLS scoping holds on the freshly-built schema
        shell: bash
        run: psql "$SCRATCH_DB" --no-psqlrc -v ON_ERROR_STOP=1 -f scripts/assert-rls-scoping.sql

      # The integration tier (tests/integration/*.sql): permission/RLS boundary
      # tests migrated out of the Playwright e2e suite, run against the scratch
      # schema this job just built. Each file seeds its own fixtures,
      # impersonates JWT identities the way PostgREST supplies them (SET ROLE
      # authenticated + request.jwt.claim.*), asserts with DO blocks and rolls
      # back — so an RLS/guard-trigger regression fails at PR time on the exact
      # schema the PR builds, with no live Supabase and no seeded prod
      # accounts. `npm run test:integration` is the local equivalent.
      - name: DB integration tests (RLS/permission boundaries)
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/integration/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no tests/integration/*.sql files in this checkout — nothing to run"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "running $f"
            psql "$SCRATCH_DB" --no-psqlrc -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Drop the scratch database
        if: ${{ always() }}
        run: psql postgres -qc "drop database if exists \"$SCRATCH_DB\"" || true

  # PR-only, and sharded across two independent prod account SETS so the two
  # shards run in parallel without ever mutating the same accounts (see
  # tests/helpers.ts: E2E_ACCOUNT_SET). Two things this buys:
  #   - Once per change. A squash-merge lands the exact tree the PR shards
  #     already exercised, so re-running e2e on the main push proved nothing;
  #     the merge is gated on branch-up-to-date (main ruleset) instead, and
  #     deploy-backend no longer needs e2e. Halves the e2e load on the shared
  #     accounts and drops ~e2e off production delivery.
  #   - Half the wall time. The two shards split the specs by DURATION, not
  #     count: playwright.config.ts keys off E2E_ACCOUNT_SET to put the heavy,
  #     atomic mutations lifecycle (~71s, one un-splittable file) alone on set 1
  #     and everything else on set 2 (~89s) — a balance the old count-based
  #     `--shard` couldn't make (it stacked mutations AND invite on one shard).
  #     Each shard boots its own server on its own port and serializes only
  #     against its own set's e2e-prod-set-<n> group (one PR's shard-1 waits on
  #     another PR's shard-1, never on its own shard-2). muk-browser-matrix.yml
  #     leaves E2E_ACCOUNT_SET unset, so it runs the whole suite on set 1 and
  #     joins e2e-prod-set-1.
  e2e:
    name: Playwright e2e (shard ${{ matrix.shard }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            set: "1"
            port: "3100"
          - shard: 2
            set: "2"
            port: "3101"
    concurrency:
      group: e2e-prod-set-${{ matrix.set }}
      cancel-in-progress: false
    env:
      # A dedicated port per shard keeps the two parallel servers off each
      # other (and off :3200, the Lighthouse port).
      E2E_PORT: ${{ matrix.port }}
      # Picks this shard's account set in tests/helpers.ts.
      E2E_ACCOUNT_SET: ${{ matrix.set }}
      # Marker scope for the events/invites the suite creates. Per-shard (the
      # set suffix) so the sweep below deletes exactly this shard's debris and
      # never the sibling shard's in-flight events — both share GITHUB_RUN_ID.
      E2E_RUN_SCOPE: r${{ github.run_id }}-s${{ matrix.set }}
      # `playwright install`'s cache GC follows its ~/Library/Caches/
      # ms-playwright/.links registry into every checkout that ever ran
      # playwright on the box — including ones under ~/Documents, which macOS
      # TCC-protects. A launchd runner has no Documents grant, so the open()
      # inside that GC blocks forever (observed 2026-07-16: two 13-minute
      # "Install Playwright browsers" hangs, stack stuck in __open). Skipping
      # the GC skips the traversal; the cache just never self-prunes here.
      PLAYWRIGHT_SKIP_BROWSER_GC: "1"
      # The JSON reporter feeds the Actions run summary. The list reporter
      # remains enabled for the live log; no separate HTML artifact is needed.
      PLAYWRIGHT_JSON_OUTPUT_NAME: ".playwright-results.json"
      # Only the original set-1 secrets: higher sets share set 1's password and
      # derive their name/email by rule (tests/helpers.ts forSet()), keyed by
      # E2E_ACCOUNT_SET — so sharding needs no extra secrets.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # Consumed by the app under test, not Playwright: the admin UI's
      # delete-user server action needs it to remove the member the
      # invite-acceptance specs create.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_ADMIN_NAME: ${{ secrets.E2E_ADMIN_NAME }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_STAFF_NAME: ${{ secrets.E2E_STAFF_NAME }}
      E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
      E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
      E2E_TOGGLE_NAME: ${{ secrets.E2E_TOGGLE_NAME }}
      E2E_TOGGLE_PASSWORD: ${{ secrets.E2E_TOGGLE_PASSWORD }}
      E2E_TOGGLE_EMAIL: ${{ secrets.E2E_TOGGLE_EMAIL }}
      E2E_KIOSK_NAME: ${{ secrets.E2E_KIOSK_NAME }}
      E2E_KIOSK_PASSWORD: ${{ secrets.E2E_KIOSK_PASSWORD }}
      E2E_KIOSK_EMAIL: ${{ secrets.E2E_KIOSK_EMAIL }}
    steps:
      # The authenticated specs self-skip without the E2E_* secrets, degrading
      # this check to "the homepage renders" while still reporting green — which
      # is exactly what happens on a Dependabot PR until the Actions secrets are
      # mirrored to Dependabot secrets. Fail loudly. Both shards validate the
      # same set-1 secrets: higher sets derive from them (tests/helpers.ts).
      - name: Required secrets are present
        run: |
          missing=""
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
                      SUPABASE_DB_URL \
                      E2E_ADMIN_NAME E2E_ADMIN_PASSWORD E2E_ADMIN_EMAIL \
                      E2E_STAFF_NAME E2E_STAFF_PASSWORD E2E_STAFF_EMAIL \
                      E2E_TOGGLE_NAME E2E_TOGGLE_PASSWORD E2E_TOGGLE_EMAIL \
                      E2E_KIOSK_NAME E2E_KIOSK_PASSWORD E2E_KIOSK_EMAIL; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing — the authenticated e2e specs would self-skip and this check would pass having proven nothing. On a Dependabot PR, mirror the Actions secrets to Dependabot secrets (gh secret set <NAME> --app dependabot)."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          # See the quality job: the runner-local npm cache is already warm,
          # while setup-node's cloud cache restored a 1.4 GB archive per job.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Self-hosted runners reuse the machine between runs. The port is
      # dedicated to this shard and the e2e-prod-set group serializes its users,
      # so anything still listening on it is a `next start` a killed run left
      # behind — remove it before Playwright fails to boot its own server.
      - name: Free the e2e port
        shell: bash
        run: lsof -ti :"$E2E_PORT" | xargs kill 2>/dev/null || true

      - name: Run e2e tests
        # Authenticated specs self-skip when the E2E_* secrets are absent, and
        # the app deliberately tolerates missing Supabase env (getSupabaseConfig
        # returns null), so the public rendering specs stay meaningful on forks.
        # No --shard: playwright.config.ts partitions the specs by duration via
        # E2E_ACCOUNT_SET (mutations alone on set 1, the rest on set 2).
        run: npm run test:e2e -- --project=chromium --reporter=list,json

      - name: Add Playwright results to run summary
        if: ${{ always() }}
        run: node scripts/write-ci-summary.mjs playwright .playwright-results.json

      # The mutation suite (tests/mutations.spec.ts) deletes its own test event
      # through the UI, but a run that dies mid-test strands it. The suite tags
      # every event it creates with this shard's run scope, so this sweep deletes
      # exactly this shard's debris immediately — never the sibling shard's
      # in-flight events. Scoped to the marker AND the admin source, so a real
      # event can never match. The age-based blanket sweep for runs killed too
      # hard for even `if: always()` lives in scheduled-checks.yml.
      - name: Sweep this shard's test events
        if: ${{ always() }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then exit 0; fi
          psql "$SUPABASE_DB_URL" --no-psqlrc --tuples-only --command \
            "with removed as (delete from muk.events where source = 'muk-events-admin' and title like 'E2E-TEST ${E2E_RUN_SCOPE} %' returning id) select 'swept ' || count(*) || ' stranded test event(s)' from removed"

  # Dedicated PR-blocking UI projects. They are read-only against the stable
  # admin account, so they can use extra runner capacity in parallel with the
  # two mutation-aware e2e shards without sharing a mutable fixture. Keeping
  # them separate prevents broad visual snapshots and touch emulation from
  # multiplying the weekly Firefox/WebKit matrix.
  ui:
    name: Playwright UI (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mobile touch
            project: mobile-chromium
            port: "3102"
          - name: visual regression
            project: visual-chromium
            port: "3103"
    env:
      E2E_PORT: ${{ matrix.port }}
      PLAYWRIGHT_SKIP_BROWSER_GC: "1"
      PLAYWRIGHT_JSON_OUTPUT_NAME: ".playwright-ui-results.json"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      E2E_ADMIN_NAME: ${{ secrets.E2E_ADMIN_NAME }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
    steps:
      - name: Required UI-test secrets are present
        run: |
          missing=""
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
                      E2E_ADMIN_NAME E2E_ADMIN_PASSWORD E2E_ADMIN_EMAIL; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing — the authenticated UI project would skip and prove nothing."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Free the UI-test port
        shell: bash
        run: lsof -ti :"$E2E_PORT" | xargs kill 2>/dev/null || true

      - name: Run ${{ matrix.name }} tests
        run: npm run test:e2e -- --project=${{ matrix.project }} --reporter=list,json

      - name: Add Playwright results to run summary
        if: ${{ always() }}
        run: node scripts/write-ci-summary.mjs playwright .playwright-ui-results.json

  # The required-check gate. The sharded e2e jobs render as "Playwright e2e
  # (shard 1/2)"; this job keeps the exact "Playwright e2e" name the main
  # ruleset requires, and passes only when every shard passed. Fail-closed: it
  # runs `always()` and inspects needs.e2e.result, so a skipped or failed shard
  # blocks the merge instead of silently satisfying the check.
  e2e-gate:
    name: Playwright e2e
    needs: [e2e, ui]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 5
    steps:
      - name: All e2e shards passed
        run: |
          e2e_result="${{ needs.e2e.result }}"
          ui_result="${{ needs.ui.result }}"
          if [ "$e2e_result" != "success" ] || [ "$ui_result" != "success" ]; then
            echo "::error::One or more Playwright jobs did not pass (e2e: $e2e_result, UI: $ui_result)."
            exit 1
          fi
          echo "All e2e shards, mobile touch tests, and visual regressions passed."

  # ---------------------------------------------------------------------------
  # Continuous delivery. Vercel already ships the Next.js app from main via its
  # git integration; these two jobs close the gap the 2026-07-13 audit had to
  # reconcile by hand — the database schema and the edge functions, both of
  # which were applied to production manually until now.
  #
  # Each self-skips when its secret is absent, so the pipeline stays green until
  # the secrets are added (see supabase/MIGRATIONS.md).
  # ---------------------------------------------------------------------------
  # The production-deploy jobs carry "merge to main only" in their names because
  # a PR's run renders them as skipped — which read as "this never deployed". It
  # did: the squash-merge pushes main, that push starts its own run of this same
  # workflow, and THAT run deploys. The PR run's skip is the design, not a
  # failure.
  #
  # Migrations and edge functions deploy in a single job: they were two
  # sequential jobs (deploy-functions needed deploy-db), so each re-paid its own
  # checkout + toolchain setup and a runner handoff — ~half a minute of overhead
  # on the delivery path for two steps that take seconds. One job keeps the exact
  # ordering (schema first, then functions) with one setup. A failure in the
  # migration steps still aborts before any function deploys, same as the old
  # needs: [deploy-db] edge.
  deploy-backend:
    name: Deploy migrations & edge functions (merge to main only)
    # No e2e here: it is PR-only now (run once per change). The main ruleset
    # requires branches to be up to date before merging, so the squash-merged
    # tree is exactly the one the PR's e2e shards passed against — re-running it
    # on this push would prove nothing. quality/rules/migrations still guard the
    # merged commit directly.
    needs: [quality, rules, migrations]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Running deploys self-hosted puts SUPABASE_DB_URL / SUPABASE_ACCESS_TOKEN
    # on our own hardware instead of a disposable VM — accepted 2026-07-16 to
    # stay under the Actions minutes cap; the box already runs everything else
    # under one user. Revisit when hardening (docs/self-hosted-runners.md).
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
      # For the DORA deployment record below.
      deployments: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.105.0 # pinned — this binary holds SUPABASE_ACCESS_TOKEN / the prod DB URL

      - name: Push migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL not set — cannot deploy migrations. A deploy job that decides not to deploy is a failed deploy, not a green one."
            exit 1
          fi
          # --db-url avoids `supabase link` (this repo has no config.toml). Only
          # migrations missing from the remote ledger run; the other apps'
          # migrations are already recorded there and are left untouched.
          supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Assert muk RLS is still scoped to muk membership
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then exit 0; fi
          psql "$SUPABASE_DB_URL" --no-psqlrc -v ON_ERROR_STOP=1 -f scripts/assert-rls-scoping.sql

      # STRICT here: the push above just ran, so anything still missing from the
      # ledger means the deploy genuinely lost it.
      - name: Check for drift
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STRICT: "1"
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then exit 0; fi
          node scripts/check-migration-drift.mjs

      # Functions after the schema they may depend on. Deploys every function
      # rather than only the changed ones: it is idempotent, takes about a
      # minute, and makes source drift between supabase/functions/ and the
      # deployed code structurally impossible — the drift the audit had to rule
      # out by hand. Function secrets live in the Supabase dashboard and are not
      # touched by a deploy.
      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN not set — cannot deploy edge functions."
            exit 1
          fi
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      # DORA instrumentation: one GitHub Deployment per backend deploy, so
      # deployment frequency and lead time are queryable from the API instead
      # of reconstructed from run logs. The nightly DORA summary in
      # muk-scheduled-checks.yml reads these. Reached only when every deploy
      # step above succeeded, so a record always means "this landed".
      - name: Record deployment (DORA)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '{"ref":"%s","environment":"production-backend","auto_merge":false,"required_contexts":[],"description":"Supabase migrations + edge functions"}' "$GITHUB_SHA" \
            | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id' > "$RUNNER_TEMP/deployment-id"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$(cat "$RUNNER_TEMP/deployment-id")/statuses" \
            -f state=success -f description="Deployed by run $GITHUB_RUN_ID"

  # ---------------------------------------------------------------------------
  # Frontend delivery, gated on CI. Historically Vercel's own git integration
  # shipped the Next.js app straight off a push — for BOTH preview and
  # production — with no dependency on the checks in this pipeline, so a red
  # e2e or a not-yet-applied migration could not stop (or even delay) a deploy,
  # and the app could go live tens of minutes before deploy-db/deploy-functions.
  # These jobs move the deploy behind the checks: production only after the
  # schema and functions are live, preview only after the PR is green.
  #
  # OFF until cutover. Both jobs are gated on the VERCEL_DEPLOY_ENABLED repo
  # variable, so re-pinning a consumer to this SHA changes nothing until the
  # variable is set to 'true'. The cutover (see docs) is: create the VERCEL_*
  # secrets, set VERCEL_DEPLOY_ENABLED=true, and disable Vercel's git
  # deployments (vercel.json `git.deploymentEnabled: false`) so the two paths
  # never double-deploy. Vercel still builds remotely here — `vercel deploy`
  # uploads the source exactly as the git integration did.
  # ---------------------------------------------------------------------------
  deploy-preview:
    name: Deploy app to Vercel (preview — PRs only)
    needs: [quality, rules, migrations, e2e-gate]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.VERCEL_DEPLOY_ENABLED == 'true'
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Deploy preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_DEPLOY_ENABLED is 'true' but VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID are not all set. Add the Vercel token and the org/project IDs as secrets, or unset the variable."
            exit 1
          fi
          # Pin the CLI once a version is chosen; @latest keeps this inert path
          # from breaking on a stale pin before cutover.
          url=$(npx --yes vercel@latest deploy --yes --token "$VERCEL_TOKEN")
          echo "Preview deployed: $url"
          printf '### Vercel preview\n%s\n' "$url" >> "$GITHUB_STEP_SUMMARY"

  deploy-app:
    name: Deploy app to Vercel (production — merge to main only)
    # After the backend: the schema and edge functions must be live before the
    # frontend that depends on them. deploy-backend deploys both, schema first.
    needs: [deploy-backend]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      vars.VERCEL_DEPLOY_ENABLED == 'true'
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
      # For the DORA deployment record below.
      deployments: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_DEPLOY_ENABLED is 'true' but VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID are not all set. A production deploy that cannot authenticate is a failed deploy, not a green one."
            exit 1
          fi
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

      # DORA instrumentation: this is THE user-facing production deploy, so the
      # "production" environment record lives here (deploy-backend records
      # "production-backend"). The nightly DORA summary counts these.
      - name: Record deployment (DORA)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '{"ref":"%s","environment":"production","auto_merge":false,"required_contexts":[],"description":"Next.js app on Vercel"}' "$GITHUB_SHA" \
            | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id' > "$RUNNER_TEMP/deployment-id"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$(cat "$RUNNER_TEMP/deployment-id")/statuses" \
            -f state=success -f environment_url="https://muk.events" -f description="Deployed by run $GITHUB_RUN_ID"
