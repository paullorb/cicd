name: muk.events CI

on:
  workflow_call:
    inputs:
      # An input rather than a constant here, because a constant here is a
      # constant the caller cannot see. It used to be one, and when muk moved to
      # its own Frankfurt project on 2026-07-28 the cutover updated every
      # reference in muk.events and could not update this one — leaving
      # `functions deploy` and the generated-types check pointed at the
      # abandoned project, silently, with both still green. Now the ref lives
      # next to the docs that describe it and the scripts that share it, where
      # one repo's test can hold them together.
      supabase_project_ref:
        description: Supabase project the schema, functions and types belong to.
        required: true
        type: string
      # The five account-lifecycle specs (invite acceptance, access-request and
      # password-reset completion) self-skip without SUPABASE_SERVICE_ROLE_KEY,
      # because without it their cleanup is impossible. Right for a fork; too
      # permissive for a repo that DOES provide the key, where a deleted or
      # renamed secret would silently shrink the desktop suite from 48 to 43
      # cases with only a log warning to show for it. A caller that sets this
      # promises the key exists, and the e2e preflight fails when it is absent.
      #
      # INERT since 2026-08-10: the e2e job runs against a local stack that
      # always has a service-role key, so there is no longer a degraded-suite
      # case for this to guard. Kept declared so existing callers stay valid —
      # removing an input is a breaking change for every pinned caller — and to
      # be reclaimed if the suite is ever pointed at a shared instance again.
      require_service_role_e2e:
        default: false
        required: false
        type: boolean
      # tests/integration/*.sql being EMPTY passes the migrations-replay job by
      # default (matching a fresh caller with no SQL tier yet). A caller that
      # has the tier sets this to false — deleting all its files then fails the
      # required check instead of presenting a green "Migrations replay" that
      # replays the schema but asserts nothing about it. The local runner
      # (scripts/test-integration.mjs) already failed on the empty glob; this
      # closes the same door in CI.
      allow_empty_integration_tests:
        default: true
        required: false
        type: boolean
    secrets:
      NEXT_PUBLIC_SUPABASE_URL:
        required: true
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:
        required: true
      SUPABASE_DB_URL:
        required: true
      SUPABASE_ACCESS_TOKEN:
        required: true
      # The E2E_* accounts below are NO LONGER READ by this workflow: since
      # 2026-08-10 the browser suite seeds its own cast into a local stack. They
      # stay declared because removing a secret from workflow_call breaks every
      # pinned caller that passes it, and because muk-browser-matrix.yml — the
      # weekly Firefox/WebKit run — still drives production and still needs
      # them. Retire them here only in the same change that retires them there.
      E2E_ADMIN_NAME:
        required: true
      E2E_ADMIN_PASSWORD:
        required: true
      E2E_ADMIN_EMAIL:
        required: true
      E2E_STAFF_NAME:
        required: true
      E2E_STAFF_PASSWORD:
        required: true
      E2E_STAFF_EMAIL:
        required: true
      E2E_TOGGLE_NAME:
        required: true
      E2E_TOGGLE_PASSWORD:
        required: true
      E2E_TOGGLE_EMAIL:
        required: true
      E2E_KIOSK_NAME:
        required: true
      E2E_KIOSK_PASSWORD:
        required: true
      E2E_KIOSK_EMAIL:
        required: true
      # Optional: the three shared demo accounts (muk docs/demo-accounts.md),
      # seeded 2026-08-03. The visual project's demo-badge specs skip without
      # NAME+PASSWORD, and the ui job's preflight requires all three so the
      # skip cannot happen silently in this pipeline. The EMAIL matters: the
      # suite's login() helper falls back to the real name-login UI without
      # it, and every UI demo login burns the shared demo-login-daily
      # circulation cap (10/24h) that exists to spot forwarded demo links —
      # a normal PR day of CI would trip it.
      E2E_DEMO_NAME:
        required: false
      E2E_DEMO_PASSWORD:
        required: false
      E2E_DEMO_EMAIL:
        required: false
      # Optional: the Playwright suite's invite-acceptance specs create a test
      # member and then delete it again through the admin UI, whose delete is a
      # Next.js server action needing the service-role client. Without the key
      # those specs self-skip (see tests/invite.spec.ts), so it stays optional
      # and forks keep working.
      SUPABASE_SERVICE_ROLE_KEY:
        required: false
      # Optional, and not a secret in any real sense — this is the VAPID PUBLIC
      # key, which every browser receives in the client bundle. It is passed
      # like one because that is how the caller already stores its
      # NEXT_PUBLIC_* build values.
      #
      # It is a BUILD input, not a test credential: components/push-toggle.tsx
      # renders nothing at all unless pushSupported() is true, and that needs
      # this key baked in. Without it the entire notification row — the
      # per-device switch and the per-account category chooser — is absent from
      # the app under test, so no Playwright project can reach it. That is why
      # the switch shipped in muk#282 never had e2e coverage.
      #
      # required: false so callers that do not use Web Push (and forks) keep
      # working. muk's own specs assert the row directly rather than leaning on
      # a presence check here, so a key that goes missing fails loudly in the
      # suite instead of quietly reducing it.
      NEXT_PUBLIC_VAPID_PUBLIC_KEY:
        required: false
      # Optional: only consumed by the deploy-app job, which is itself gated
      # on the VERCEL_DEPLOY_ENABLED repo variable. Absent
      # until the Vercel-from-CI cutover, so keep them optional (a missing
      # optional secret passes through as an empty string).
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false

permissions:
  contents: read

env:
  # Not a secret: the project ref is already recorded in supabase/MIGRATIONS.md.
  SUPABASE_PROJECT_REF: ${{ inputs.supabase_project_ref }}

# Every job runs on the self-hosted muk-ci pool by default — GitHub-hosted
# minutes were about to breach the plan cap. The labels come from the
# MUK_CI_LABELS repo variable so CI can be re-routed to ubuntu-latest without
# a commit: runner-watchdog.yml flips the variable when no muk-ci runner is
# online (and back), and a human can flip it in Settings → Variables from a
# phone. The fallback literal keeps the expression working if the variable is
# ever deleted. See docs/self-hosted-runners.md.
#
# timeout-minutes on every job is not optional here: a hung job on a
# self-hosted runner holds one of the machine's few slots for the default
# 6 hours.
#
# Dependabot PRs run on ubuntu-latest, not the muk-ci pool: a dependency bump
# is the one PR whose code nobody wrote — a malicious package could target the
# persistent Mac Studio (and the mirrored Dependabot secrets) from an install
# script or a test. Hosted VMs are disposable, so that blast radius dies with
# the job. Belt-and-braces with this,
# `npm ci --ignore-scripts` below keeps lifecycle scripts from running on ANY
# PR (verified 2026-07-22: check + build + e2e need no install scripts;
# Playwright browsers install in their own explicit step).
#
# The Dependabot handover. A run Dependabot triggers is served the Dependabot
# secret store, so `rules` fails its secrets assertion in seconds, by design;
# that red is what makes the caller's post-ci push an empty commit as the PAT's
# owner, and the run THAT starts (actor: a person, Actions secrets, the pool)
# is the one that decides the pull request. Dependabot's own run therefore
# decides nothing, and it is the one that bills hosted minutes: in November
# 2026 its seven runs cost 145 minutes of the account's 3,000, 89 of them a
# browser suite that failed on the Linux image six times out of seven. So on
# that run every job but `rules` (the handover red) and the `Playwright e2e`
# gate (fail-closed on a skipped suite) is skipped: two billed minutes a
# Dependabot push instead of about twenty. Two required checks stay red on
# Dependabot's head, so the skipped ones cannot let it merge.
#
# What this does NOT do: the deciding run executes the bumped packages on the
# Mac Studio. Routing it to a hosted VM too (by branch prefix, as app-ci.yml
# does) is the containment this comment's first paragraph describes, and it
# needs the browser suite to pass on Linux first.

jobs:
  quality:
    name: Lint, typecheck, edge functions & build
    # Skipped on Dependabot's own run: see "The Dependabot handover" at the top.
    if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 25
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Lint, typecheck, edge functions & build

          The fast no-browser gate: oxlint, TypeScript, `deno check` on the Supabase edge functions, the unit tests with coverage, a production build, and the gzipped client-JS bundle budgets.

          ❌ Read the step that failed. A lint or type error is yours to fix; a bundle-budget failure means this change grew the client bundle past `bundle-budgets.json` and needs slimming or a deliberate, reviewed budget bump.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          # The self-hosted machine already keeps ~/.npm between jobs. The
          # Actions cache lives in GitHub's cloud and was downloading the same
          # 1.4 GB archive once per job, taking ~7 minutes to save ~10 seconds
          # in npm ci. Keep it off even during the hosted fallback.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `npm audit` is NOT run here. As a step in this required job it would fail
      # every PR and every main push the moment a new advisory is published for a
      # production dependency — an event that has nothing to do with the change
      # under review — and, because auto-merge blocks on this check, would wedge
      # the entire merge queue until someone intervened. The audit runs instead
      # as a nightly hard-fail alarm in muk-scheduled-checks.yml, where a fresh
      # CVE emails the owner within a day without blocking unrelated delivery.

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      # The fast, deterministic per-PR performance gate. It reads the client JS
      # this build just emitted under .next and fails if the gzipped shared or
      # total bundle exceeds bundle-budgets.json — no Chrome, no server, nothing
      # timing-sensitive, so it never flakes when the shared runner pool is busy.
      # It replaced the per-PR Lighthouse "budget" job, whose error-level
      # performance *score* dropped under CPU contention and blocked auto-merge;
      # the full Lighthouse audit (network byte budgets + category scores, 3
      # samples) now runs nightly in muk-scheduled-checks.yml on the idle box.
      # Piggybacking on this already-required job means no second build, no extra
      # load on the pool, and no new required status check.
      - name: Assert bundle budgets
        run: node scripts/assert-bundle-budgets.mjs .next

  # Shift-left secret detection. The pipeline's orbit holds a service-role key,
  # the prod DB URL, a PAT and push keys; a credential committed today would
  # otherwise land on main unnoticed (the repo is private without Advanced
  # Security, so GitHub itself scans nothing). Full history was verified clean
  # on 2026-07-22 (429 commits), so this runs blocking with no baseline config.
  # No secrets needed, so it runs identically on forks and Dependabot PRs.
  secret-scan:
    name: Secret scan (gitleaks)
    # Skipped on Dependabot's own run: see "The Dependabot handover" at the top.
    if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Secret scan (gitleaks)

          Scans the FULL git history for committed credentials on every run. This pipeline handles a service-role key, the production database URL, a PAT and push keys, and the repository is private without GitHub Advanced Security — so nothing else is scanning it.

          ❌ Treat it as a live incident: ROTATE the exposed credential first, then rewrite history to remove it. Deleting the commit alone is not a fix.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Scan history, not just the tip: a secret committed and then
          # "removed" in a follow-up commit is still in every clone.
          fetch-depth: 0

      # The pinned binary, not gitleaks/gitleaks-action: the action failed two
      # different ways on day one — a 403 computing its PR scan range (needs
      # pull-requests: read) and a fixed $TMPDIR/gitleaks.tmp download path
      # that collides with its own debris on a persistent self-hosted runner.
      # The raw binary needs no token, no per-event range logic, and a full
      # 429-commit history scan measured ~1s, so every event just scans
      # everything. Checksums pinned from the v8.24.3 release manifest.
      - name: Install gitleaks
        shell: bash
        run: |
          case "$RUNNER_OS $(uname -m)" in
            "macOS arm64")
              asset=gitleaks_8.24.3_darwin_arm64.tar.gz
              sha=b90f13bb8c90ab72083d9b0c842e39dafb82c0e5c3f872f407366b7a58909013 ;;
            "Linux x86_64")
              asset=gitleaks_8.24.3_linux_x64.tar.gz
              sha=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c ;;
            *)
              echo "::error::No pinned gitleaks build for $RUNNER_OS/$(uname -m) — add its checksum here."
              exit 1 ;;
          esac
          # Retry the download: this turned main red on 2026-08-29 with no
          # secret involved, and the checksum below is what makes retrying safe.
          curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors --retry-max-time 60 \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/$asset" \
            -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "$sha  $RUNNER_TEMP/gitleaks.tgz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the full history for secrets
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks" git . \
            --no-banner --redact --exit-code 1 \
            --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif" \
            || { echo "::error::gitleaks found committed secret(s) — see the log above (values redacted). Rotate the credential first, then rewrite history; deleting the line in a new commit does NOT remove it from clones."; exit 1; }

  # Shift-left half of the dependency story. The nightly audit in
  # muk-scheduled-checks.yml catches advisories published for dependencies we
  # already ship (see the note in the quality job for why that cannot block
  # PRs); this job blocks the other direction — a PR *introducing* a
  # known-vulnerable production dependency. It audits only when the PR touches
  # the lockfile, so an advisory published mid-flight can never wedge unrelated
  # PRs: they skip the audit step and the check stays green.
  deps-audit:
    name: Dependency audit (lockfile PRs)
    # Not on Dependabot's own run: see "The Dependabot handover" at the top.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    # Five 90-second attempts against the advisory endpoint, plus checkout.
    timeout-minutes: 12
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Dependency audit (lockfile PRs)

          Blocks a pull request that INTRODUCES a known-vulnerable production dependency. It audits only when the branch touches `package-lock.json`, so an advisory published mid-flight can never wedge unrelated pull requests.

          ❌ The new dependency tree carries a high-severity advisory. It also reports pre-existing ones, so check whether this change actually introduced it before treating it as a blocker. A ⚠️ saying the endpoint did not answer means nothing was audited and this check passed anyway — registry.npmjs.org was down, and the nightly audit is the backstop.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Needed to diff against the PR base.
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Audit production dependencies when the lockfile changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qx 'package-lock.json'; then
            echo "package-lock.json untouched — no new dependencies to audit."
            exit 0
          fi
          # Known limitation, accepted: this flags pre-existing high advisories
          # too, not only ones this PR introduces. Such an advisory would have
          # failed the nightly audit within a day anyway — fixing it unblocks
          # both alarms at once.
          #
          # The advisory endpoint answers with a heavy tail. On 2026-09-04 the
          # same byte-identical request took between 1 s and 71 s when it was
          # served and blew npm's 5-minute fetch timeout on six CI attempts in a
          # row (muk.events #1169), from the same machine, minutes apart. One
          # request is a coin toss, so make several short ones. Only the
          # endpoint failure is retried: a reported advisory exits 1 without
          # that line and fails on the first attempt, so a red here still means
          # what the summary says. The nightly audit in muk-scheduled-checks.yml
          # carries the same loop.
          # Which of the two happened is read from the REPORT, not from a
          # message: npm exits 1 for "this tree has a high advisory" and for
          # "the registry did not answer" alike, and those need opposite
          # responses. `auditReportVersion` is on every real report and on no
          # error payload, so it is the one honest signal. Matching npm's
          # wording instead would turn a reworded error into an instant red.
          # npm cannot tell these apart: it exits 1 both for "this tree carries a
          # high advisory" and for "the registry did not answer", and those need
          # opposite responses. `auditReportVersion` is on every real report and
          # on no error payload, so it is the one honest signal — matching npm's
          # wording instead would turn a reworded error into an instant red.
          #
          # Written out here rather than committed beside this workflow because
          # a reusable workflow runs in the CALLER's checkout: a file shipped in
          # this repository would not exist when the step runs.
          verdict="$RUNNER_TEMP/audit-verdict.mjs"
          cat > "$verdict" <<'VERDICT'
          // 0 clean - 1 a high or critical advisory, listed - 2 no report to read.
          import { readFileSync } from "node:fs";
          let report;
          try {
            report = JSON.parse(readFileSync(process.argv[2], "utf8"));
          } catch {
            process.exit(2);
          }
          if (!report.auditReportVersion) process.exit(2);

          const counts = report.metadata?.vulnerabilities ?? {};
          console.log(`advisories by severity: ${JSON.stringify(counts)}`);
          const blocking = [];
          for (const [name, found] of Object.entries(report.vulnerabilities ?? {})) {
            if (found.severity !== "high" && found.severity !== "critical") continue;
            const why = (found.via ?? [])
              .map((entry) => (typeof entry === "string" ? entry : entry.title))
              .filter(Boolean)
              .join("; ");
            blocking.push(`  ${found.severity}  ${name}  ${why}`);
          }
          for (const line of blocking.sort()) console.log(line);
          process.exit(blocking.length > 0 ? 1 : 0);
          VERDICT

          for attempt in 1 2 3 4 5; do
            npm audit --omit=dev --audit-level=high --json \
              --fetch-timeout=90000 --fetch-retries=0 \
              >"$RUNNER_TEMP/audit.json" 2>"$RUNNER_TEMP/audit.err" || true
            # The default step shell is `bash -e`: a nonzero verdict from node
            # (1 advisory, 2 no report) must reach the case below, not end the step.
            verdict_rc=0
            node "$verdict" "$RUNNER_TEMP/audit.json" || verdict_rc=$?
            case $verdict_rc in
              0) exit 0 ;;
              1) echo "::error::This tree carries a high or critical advisory (listed above). It may predate this PR — check before treating it as a blocker."; exit 1 ;;
            esac
            echo "attempt $attempt of 5: the advisory endpoint did not answer within 90 s."
            sed -n '1,15p' "$RUNNER_TEMP/audit.err"
            [ "$attempt" -lt 5 ] && sleep $((attempt * 10))
          done

          # A registry that never answered is not a clean tree — and it is not
          # a finding either. Failing here would wedge every lockfile PR on
          # somebody else's outage, which is the wedge this job's own design
          # goes out of its way to avoid; on 2026-09-04 it did exactly that for
          # eight consecutive attempts. The nightly audit below is the alarm,
          # and it DOES fail, so the gap this leaves is at most a day.
          echo "::warning::The advisory endpoint did not answer in five attempts, so nothing was audited. The nightly audit in muk-scheduled-checks.yml still covers this tree."

  rules:
    name: Project rules
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 15
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Project rules

          Enforces the invariants specific to this project rather than to JavaScript: new RLS policies scoped to muk membership (never bare `authenticated`, because the Supabase project is shared with other apps), no production schema drift, and `types/supabase.ts` matching the live schema.

          ❌ An RLS failure is the serious one — an unscoped policy would expose muk data to any logged-in user of any other app on this Supabase project. A types mismatch usually just needs `npm run gen:types`. A migration merely awaiting deploy is normal and does not fail here.
          TLDR

      # Every secret-gated step below self-skips when its secret is absent
      # (correct for forks; this repo is private, so there are none). Without
      # this assertion a rotated/renamed secret — or a Dependabot PR, which
      # only receives *Dependabot* secrets — silently turns the whole job into
      # a no-op that still reports green. Fail loudly instead.
      - name: Required secrets are present
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          missing=""
          [ -n "$SUPABASE_DB_URL" ] || missing="$missing SUPABASE_DB_URL"
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          if [ -n "$missing" ]; then
            # A Dependabot run is served the Dependabot secret store, so this is
            # expected and says so: the red is the handover, not a fault in the
            # bump. Mirroring the secrets across would answer it and is exactly
            # what must not happen (muk.events AGENTS.md), so the message no
            # longer suggests it.
            if [ "${GITHUB_ACTOR:-}" = "dependabot[bot]" ]; then
              echo "::error::Expected on a Dependabot run:$missing are not visible to it, so this job can enforce nothing and refuses to report green. A run under a normal identity follows and is the one that counts. Do NOT mirror these into the Dependabot secret store."
              {
                echo "### This red is the Dependabot handover"
                echo
                echo "A run triggered by Dependabot is served the *Dependabot* secret store, so"
                echo "\`$missing\` are invisible here. This job would otherwise pass while checking"
                echo "nothing, so it fails instead."
                echo
                echo "**This failure is expected and says nothing about the bump itself.** The run"
                echo "that decides this pull request is the next one, started under a normal"
                echo "identity; every other job is skipped here and runs there."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Missing secret(s):$missing — every check in this job would silently pass while enforcing nothing. A secret has been rotated, renamed or deleted; restore it before merging anything."
            fi
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Both sides of the diff have to be present to compare them.
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: New muk RLS policies are scoped to muk membership
        if: github.event_name == 'pull_request'
        run: node scripts/lint-migration-rls.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      # Read-only, and it runs on PRs rather than only at deploy time for two
      # reasons: it catches prod drifting from the repo *before* you stack
      # another migration on top of it, and it proves SUPABASE_DB_URL still
      # works while a failure is still cheap — rather than at the moment the
      # deploy job first needs it.
      #
      # Deliberately NOT strict: a migration awaiting deploy is normal pipeline
      # state here, not drift. The first strict version of this step deadlocked
      # main — deploy-db needs this job green, and this job rejected the very
      # migration deploy-db existed to apply. Renames still fail; "prod never
      # got it" is enforced where it means something: post-deploy and nightly.
      - name: Prod schema is in sync and muk RLS is still scoped
        id: drift
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::SUPABASE_DB_URL not set — skipping the prod schema checks."
            exit 0
          fi

          # psql only treats its argument as a URI when it starts with the
          # scheme; anything else it reads as a bare database name and quietly
          # dials a local unix socket, which fails with a baffling error. Say
          # what is actually wrong instead.
          case "$SUPABASE_DB_URL" in
            postgresql://*|postgres://*) ;;
            *)
              echo "::error::SUPABASE_DB_URL is set but is not a connection URI — psql read it as a database name and tried a local socket. It must start with 'postgresql://'. Copy the Session pooler URI from Supabase → Connect (host aws-*.pooler.supabase.com, port 5432, user postgres.<ref>), substitute the password, and store it with no surrounding quotes and no 'SUPABASE_DB_URL=' prefix. If the password contains @ : / ? # or %, percent-encode it."
              exit 1
              ;;
          esac

          node scripts/check-migration-drift.mjs
          psql "$SUPABASE_DB_URL" --no-psqlrc -v ON_ERROR_STOP=1 -f scripts/assert-rls-scoping.sql

      # Skipped while migrations await deploy: committed types are generated
      # FROM prod, so they cannot match a schema prod doesn't have yet. The
      # nightly run re-checks strictly once the deploy has landed.
      # A custom `if:` drops the implicit success() guard, so without it this
      # step would still run after the drift step above failed. Keep success().
      - uses: ./.github/actions/supabase-cli # the version muk.events pins in .supabase-cli-version
        if: success() && (steps.drift.outputs.pending == '' || steps.drift.outputs.pending == '0')

      - name: types/supabase.ts matches the prod schema
        if: success() && (steps.drift.outputs.pending == '' || steps.drift.outputs.pending == '0')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN not set — skipping the generated-types drift check."
            exit 0
          fi
          supabase gen types typescript \
            --project-id "$SUPABASE_PROJECT_REF" --schema muk > /tmp/supabase.ts
          # The comparison lives in muk.events (scripts/ is app-owned): it names
          # the migration that caused the drift instead of only reporting that
          # the file is stale.
          node scripts/check-types-drift.mjs /tmp/supabase.ts

  # Read-only mirror of the two deploy jobs, visible as its own green check on
  # every PR: are prod's schema AND edge functions in sync with what the repo
  # says, and what exactly will the merge deploy? The migrations half repeats
  # the rules job's non-strict drift check purely for visibility; the functions
  # half is the only staleness check the functions have before merge — it
  # catches a main whose function changes never deployed (e.g. the deploy jobs
  # were skipped because another job was red, which happened three merges in a
  # row on 2026-07-13). Both halves self-skip without their secret, so forks
  # stay green.
  sync:
    name: Prod sync (edge functions)
    # Not on Dependabot's own run: see "The Dependabot handover" at the top.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
      # The staleness check asks whether the base branch's own pipeline is
      # still running (muk.events#1841). The caller must grant it too.
      actions: read
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Prod sync (migrations & edge functions)

          A read-only answer to one question on every pull request: are the edge functions deployed to production still the ones in this repository's base branch? This is the only staleness check the functions get before merge. (Migration drift is checked by the required `Project rules` job; it used to be checked here too, twice per PR for one answer.)

          ✅ ADVISORY, never a required check — it reports the state of production, not of your branch. Read it, then decide.

          ❌ Something merged earlier never reached production, most often because its deploy job was skipped when another job was red. Find what is pending before merging more on top of it.
          TLDR

      # See the identical step in the rules job.
      - name: Required secrets are present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            # See the identical reasoning in the rules job above.
            if [ "${GITHUB_ACTOR:-}" = "dependabot[bot]" ]; then
              echo "::error::Expected on a Dependabot run: SUPABASE_ACCESS_TOKEN is not visible to it, so this check would silently skip. The run under a normal identity that follows is the one that counts. Do NOT mirror it into the Dependabot secret store."
              {
                echo "### This red is the Dependabot handover"
                echo
                echo "A run triggered by Dependabot cannot see \`SUPABASE_ACCESS_TOKEN\`, so this"
                echo "check would skip while reporting green. This failure is expected and says nothing"
                echo "about the bump itself; the next run decides this pull request."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Missing secret SUPABASE_ACCESS_TOKEN — the edge-function sync check would silently skip. It has been rotated, renamed or deleted; restore it."
            fi
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The staleness check dates each function's last source change at the
          # BASE of the PR, which needs history beyond the merge commit.
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/supabase-cli # the version muk.events pins in .supabase-cli-version

      # No migration-drift step here any more: `rules` runs the very same
      # scripts/check-migration-drift.mjs against the very same prod database
      # on every PR, as a REQUIRED check. Running it twice bought a second prod
      # round-trip and a second full-history checkout per PR for an answer the
      # other job had already given (muk.events docs/audit-2026-08-22-ci-cd.md,
      # O5). What this job still owns is the half nothing else checks before
      # merge: are the edge functions that are deployed still the ones in the
      # base branch.
      - name: Edge functions are deployed and not stale
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # The PR's own function changes deploy on merge; only the base
          # branch's sources must already be live.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The base head can be a merge whose own pipeline has not reached
          # its deploy job yet: pending, not stranded. The script asks the
          # base branch's runs (muk.events#1841). Needs actions: read from
          # the caller, and reads as before without it.
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN not set — skipping the edge function sync check."
            exit 0
          fi
          node scripts/check-functions-sync.mjs

  # Proves every muk migration still applies, in filename order, to an empty
  # database with only the Supabase scaffolding (scripts/ci-db-shim.sql) in
  # place — before deploy-db replays the new ones onto shared prod. This
  # replaced creating a paid Supabase preview branch per check. Scratch
  # databases are named by run id, so concurrent runs — this repo's or any
  # other repo's served by this pipeline — never collide. Files in
  # scripts/ci-db-replay-skip.txt (other apps' migrations recorded in the
  # shared ledger) are skipped, exactly as `supabase db push` skips them.
  migrations:
    name: Migrations replay (scratch Postgres)
    # Skipped on Dependabot's own run: see "The Dependabot handover" at the top.
    if: ${{ !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') }}
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 10
    env:
      SCRATCH_DB: muk_ci_${{ github.run_id }}_${{ github.run_attempt }}
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Migrations replay (scratch Postgres)

          Proves every migration still applies, in order, to an empty database — before the merge replays the new ones onto the SHARED production database — then re-asserts RLS scoping on the fresh schema and runs the SQL integration tests.

          ❌ Do not merge. Either a migration is not replayable (it depends on state only production has), or a policy or trigger lets the wrong caller through. Catching an unscoped SECURITY DEFINER function here is the whole point: the production-side assert only sees it after deploy, which is how a past change turned main red post-merge.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Ensure a local PostgreSQL with the pg_cron stub
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Hosted fallback (runner-watchdog flipped MUK_CI_LABELS): the
            # ubuntu image ships a stopped PostgreSQL. Its major version may
            # trail prod's 17 — acceptable for a does-it-apply check.
            sudo systemctl start postgresql
            sudo -u postgres createuser --superuser "$(whoami)" || true
            extdir="$(pg_config --sharedir)/extension"
            SUDO="sudo"
            echo "PGHOST=/var/run/postgresql" >> "$GITHUB_ENV"
            export PGHOST=/var/run/postgresql
          else
            # The Mac Studio runs Homebrew postgresql@17 as a brew service
            # (docs/self-hosted-runners.md). Its share dir is user-writable
            # but wiped by brew upgrades, so reinstall the stub every run.
            extdir="/opt/homebrew/opt/postgresql@17/share/postgresql/extension"
            SUDO=""
            echo "PGHOST=/tmp" >> "$GITHUB_ENV"
            export PGHOST=/tmp
          fi
          # Real pg_cron can only be created in the one database named by
          # cron.database_name, which breaks one-scratch-database-per-run.
          # The stub records schedule/unschedule calls in cron.job; nothing
          # executes in the background.
          $SUDO tee "$extdir/pg_cron.control" >/dev/null <<'EOF'
          comment = 'CI stub of pg_cron: schedule/unschedule write to cron.job, no background worker'
          default_version = '1.6'
          relocatable = false
          schema = cron
          EOF
          $SUDO tee "$extdir/pg_cron--1.6.sql" >/dev/null <<'EOF'
          \echo Use "CREATE EXTENSION pg_cron" to load this file. \quit
          create table job (
              jobid bigserial primary key,
              schedule text not null,
              command text not null,
              nodename text not null default 'localhost',
              nodeport int not null default 5432,
              database text not null default current_database(),
              username text not null default current_user,
              active boolean not null default true,
              jobname text unique
          );
          create function schedule(job_name text, schedule text, command text)
          returns bigint language sql as $$
              insert into cron.job (jobname, schedule, command)
              values (job_name, schedule, command)
              on conflict (jobname)
              do update set schedule = excluded.schedule, command = excluded.command
              returning jobid;
          $$;
          create function schedule(schedule text, command text)
          returns bigint language sql as $$
              insert into cron.job (schedule, command) values (schedule, command)
              returning jobid;
          $$;
          create function unschedule(job_name text)
          returns boolean language sql as $$
              delete from cron.job where jobname = job_name;
              select true;
          $$;
          EOF
          psql postgres -v ON_ERROR_STOP=1 -qtAc "select 'postgres ' || current_setting('server_version')"

      - name: Replay migrations onto a scratch database
        shell: bash
        run: |
          psql postgres -v ON_ERROR_STOP=1 -qc "create database \"$SCRATCH_DB\""
          psql "$SCRATCH_DB" -v ON_ERROR_STOP=1 -q -f scripts/ci-db-shim.sql
          for f in supabase/migrations/*.sql; do
            base=$(basename "$f")
            if grep -qxF "$base" scripts/ci-db-replay-skip.txt; then
              # A skipped migration with a same-named file in
              # scripts/ci-db-replay-overrides/ is replaced by that muk-only
              # twin at its own ledger position (see the override's header) —
              # skipping a mixed-app original wholesale would silently lose
              # its muk-side policy rewrites from the scratch schema.
              if [ -f "scripts/ci-db-replay-overrides/$base" ]; then
                echo "applying muk-only override for $base"
                psql "$SCRATCH_DB" -v ON_ERROR_STOP=1 -q -f "scripts/ci-db-replay-overrides/$base"
              else
                echo "skipped $base (another app's migration, see the skip list)"
              fi
              continue
            fi
            echo "applying $base"
            psql "$SCRATCH_DB" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # Same RLS-scoping assertion the deploy and nightly runs make against prod,
      # but here against the just-built scratch schema — so a migration that adds
      # an unscoped policy, a table without RLS, or (as in #163) a new SECURITY
      # DEFINER function granted to authenticated that was never added to the
      # reviewed allowlist FAILS AT PR TIME, before it reaches prod. The prod
      # assertion only sees such an object post-deploy (it queries live prod),
      # which is why #163 turned main red only after merge. The scratch snapshot
      # mirrors prod's hand-created state via scripts/ci-db-shim.sql (e.g. RLS on
      # muk.users); keep that faithful when this fails on an object prod is fine
      # with. It is a subset of prod's objects, so it never flags a policy or
      # function that the prod run would pass.
      - name: RLS scoping holds on the freshly-built schema
        shell: bash
        run: psql "$SCRATCH_DB" --no-psqlrc -v ON_ERROR_STOP=1 -f scripts/assert-rls-scoping.sql

      # The integration tier (tests/integration/*.sql): permission/RLS boundary
      # tests migrated out of the Playwright e2e suite, run against the scratch
      # schema this job just built. Each file seeds its own fixtures,
      # impersonates JWT identities the way PostgREST supplies them (SET ROLE
      # authenticated + request.jwt.claim.*), asserts with DO blocks and rolls
      # back — so an RLS/guard-trigger regression fails at PR time on the exact
      # schema the PR builds, with no live Supabase and no seeded prod
      # accounts. `npm run test:integration` is the local equivalent.
      - name: DB integration tests (RLS/permission boundaries)
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/integration/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            if [ "${{ inputs.allow_empty_integration_tests }}" = "true" ]; then
              echo "no tests/integration/*.sql files in this checkout — nothing to run"
              exit 0
            fi
            echo "::error::tests/integration/ holds no .sql files, but this caller sets allow_empty_integration_tests: false. The replay job would go green while asserting nothing about the schema it built."
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "running $f"
            psql "$SCRATCH_DB" --no-psqlrc -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Drop the scratch database
        if: ${{ always() }}
        run: psql postgres -qc "drop database if exists \"$SCRATCH_DB\"" || true

  # PR-only, and run against a LOCAL Supabase stack the job brings up itself —
  # not against production. Until 2026-08-10 this was two shards writing to two
  # sets of real production accounts; docs/audit-2026-08-03-careteam-extraction.md
  # step 6 is the move off them.
  #
  # WHAT THAT CHANGES, STATED PLAINLY BECAUSE IT IS A REAL TRADE. Running against
  # deployed prod caught one class of problem nothing else does: a change whose
  # app code is incompatible with the CURRENTLY DEPLOYED schema or edge
  # functions — the "ship a compatibility bridge or land the migration first"
  # tax. That signal is gone from the PR gate. What replaces it, partially:
  # `rules` still compares migrations and functions against prod (name drift,
  # stale deploys), `migrations` replays the whole ledger into scratch Postgres
  # and asserts RLS scoping on it, and the integration tier proves the policies.
  # What is genuinely no longer caught at PR time is app-code-vs-deployed-schema
  # skew, which now surfaces on the main run and post-deploy asserts instead.
  # The audit's answer is instance #0 — a deployed reference that ships FIRST —
  # and that is where this should end up.
  #
  # WHY ONE JOB WHERE THERE WERE FOUR. The two shards existed to split duration
  # AND to keep two runs off each other's production accounts; the two UI
  # variants ran in parallel because they were read-only against those same
  # accounts. A local stack removes the account-isolation reason entirely, and
  # removes most of the duration: the same specs run about twice as fast without
  # a round trip to Frankfurt (measured: the full CI project set is ~8 minutes
  # locally). One job, one stack, one port — far less machine load on a shared
  # three-runner box, and no cross-shard sweep to get wrong.
  #
  # AND IT NEEDS NO SECRETS. Every credential now comes from the stack the job
  # started. That fixes a standing complaint in CLAUDE.md as a side effect: a
  # Dependabot PR is served the Dependabot secret store, so its e2e used to fail
  # in ~5s having tested nothing. It can now run the real suite.
  e2e:
    name: Playwright e2e (lane)
    # Not on Dependabot's own run: see "The Dependabot handover" at the top.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    # MUK_E2E_LABELS is how many e2e jobs may run at once: it names the subset
    # of the pool whose runners are labelled for the browser suite, and a runner
    # executes one job at a time, so "two labelled runners" IS "at most two
    # concurrent e2e runs". Unset, it falls through to the whole pool and
    # nothing changes — which is what makes turning this on a repo-variable
    # edit rather than a deploy.
    #
    # If the runner watchdog ever fails the pool over to ubuntu-latest, it must
    # move THIS variable too, or e2e queues against labels nothing carries.
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON(vars.MUK_E2E_LABELS || vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    # 25 minutes of work plus the box-load wait below (up to 600 s).
    timeout-minutes: 35
    # NO concurrency group any more, and that is the point of the lane work.
    #
    # It used to be `muk-e2e-local-stack`, serializing every PR through one
    # Supabase stack on fixed ports — the second run would bind-collide with the
    # first, or worse, `supabase db reset` under a running suite. Measured cost
    # on 2026-08-22: PRs waiting 4.7, 11.3 and 18.2 minutes for the run ahead.
    #
    # Each runner now drives its OWN lane (scripts/stack-lane.mjs) — private
    # project_id, containers, volumes and ports — so two e2e jobs share nothing
    # to serialize on, and a `db reset` in one is invisible to the other
    # (proven: a 167-migration reset ran inside another lane's suite with no
    # effect on it). The cap on parallelism is the label above, not a queue.
    env:
      # See the note in the old job: a launchd runner has no Documents grant, so
      # playwright's cache GC can block forever traversing into TCC-protected
      # checkouts. Skipping the GC skips the traversal.
      PLAYWRIGHT_SKIP_BROWSER_GC: "1"
      PLAYWRIGHT_JSON_OUTPUT_NAME: ".playwright-results.json"
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Playwright e2e (lane)

          Every browser project — the three golden flows, mobile touch, and visual regression — driven against this runner's own LANE: a private Supabase stack, with its own database, containers and ports, that the job syncs, starts, resets and seeds. It writes to no production account and needs no secrets.

          Because the lane belongs to this runner alone, two of these jobs run at the same time without a queue, and neither can be disturbed by the other — or by somebody's `npm run pre-pr` on the same machine, which claims a lane of its own. How many run at once is set by which runners carry the e2e label (`MUK_E2E_LABELS`), not by a concurrency group.

          ❌ A real user-facing flow is broken, or a UI change left its golden-flow assertions or visual baselines stale (regenerate with `npx playwright test --project=visual-chromium --update-snapshots`, then eyeball them — baselines have leaked real member data before). A test that passed only on retry still counts as failed: find the race rather than widening a timeout.

          Not covered here: app code incompatible with the *currently deployed* schema or edge functions. That used to fail here when the suite ran against production; it now surfaces on the main run and the post-deploy asserts.
          TLDR

      # fetch-depth: 0, because the scope step below diffs against the merge
      # base. The self-hosted pool keeps a warm checkout, so this is an
      # incremental fetch there; a Dependabot PR pays a full clone once.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # CAN THE RUNNING APP SEE THIS CHANGE AT ALL?
      #
      # The caller's own map answers it — `muk-map.mjs scope`, the same module
      # its `pre-pr` asks before running the suite locally, so the two gates
      # cannot disagree about what was tested. A change reaches the app only
      # through the app's import graph, plus the build inputs, the schema and
      # the specs, which no import edge can model.
      #
      # When it reaches none of that, every step below is skipped and the JOB
      # STILL SUCCEEDS. That matters: the required gate is fail-closed on a
      # SKIPPED job, and it stays that way — this is a job that ran and had
      # nothing to do, not a job that never ran.
      #
      # A caller without the command (an older checkout, another app) gets
      # `needed=true` and the full suite, so this is not a breaking change.
      - name: Does this change reach the running app?
        id: scope
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -f scripts/muk-map.mjs ] || [ ! -f muk-map.json ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "This caller has no map; running the suite."
            exit 0
          fi
          node scripts/muk-map.mjs scope \
            --base="${{ github.event.pull_request.base.sha }}" \
            --head="${{ github.event.pull_request.head.sha }}" || {
              echo "needed=true" >> "$GITHUB_OUTPUT"
              echo "::warning::The scope query failed; running the suite."
            }
          # A scope command that succeeds without printing its verdict must not
          # skip the suite: default to running unless an output was written.
          grep -q '^needed=' "$GITHUB_OUTPUT" || echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Nothing here reaches the running app
        if: ${{ steps.scope.outputs.needed != 'true' }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<TLDR
          #### Playwright e2e (lane) — nothing to run

          No file this pull request changes is reachable from the app's own import graph, and none of them is a build input, a schema or edge-function change, or a browser spec. \`muk-map.mjs scope\` said so, and the caller's \`pre-pr\` said the same thing before the push.

          The suite would have measured a picture nobody changed. The golden flows still run against \`main\` nightly.
          TLDR
          echo "Skipped: ${{ steps.scope.outputs.reason }}"

      # One CLI version across every job, pinned in muk.events.
      - uses: ./.github/actions/supabase-cli # the version muk.events pins in .supabase-cli-version
        if: ${{ steps.scope.outputs.needed == 'true' }}

      # The stack needs a container runtime. Linux runners ship Docker; the
      # self-hosted macOS pool uses Colima, which is a user-level VM and may not
      # be running after a reboot. Homebrew's bin is named explicitly because a
      # launchd runner's PATH is minimal.
      - name: Ensure a container runtime
        shell: bash
        if: ${{ steps.scope.outputs.needed == 'true' }}
        run: |
          set -uo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            docker info >/dev/null 2>&1 || { echo "::error::No Docker on this Linux runner."; exit 1; }
            echo "Docker is up."
            exit 0
          fi
          export PATH="/opt/homebrew/bin:$PATH"
          if ! command -v colima >/dev/null 2>&1; then
            echo "::error::colima is not installed on this runner (brew install colima docker)."
            exit 1
          fi
          if ! colima status >/dev/null 2>&1; then
            echo "Colima is not running — starting it."
            # WHICH SIZE? Colima applies `start` flags to an EXISTING instance,
            # so passing the sized form here would silently resize whatever the
            # box was deliberately set to — the muk Mac Studio runs 10 CPU since
            # 2026-08-23 and this step would have put it back to 8 on the first
            # job after a reboot. A saved profile already knows its size, so
            # only a box that has never had one gets the flags.
            #
            # Sized for LANES, not for one stack: each lane is ~1.3 GB of
            # containers (measured 2026-08-22), and this box may hold two CI
            # lanes plus the developer-side ones. 4 CPU / 8 GB was the
            # single-stack budget and is not enough for that.
            if [ -f "$HOME/.colima/${COLIMA_PROFILE:-default}/colima.yaml" ]; then
              colima start || true
            else
              colima start --cpu 8 --memory 16 --disk 100 || true
            fi
          fi
          # `|| true` above, and the real verdict here: two e2e jobs landing on
          # two runners in the same minute after a reboot both see `status`
          # fail and both start. The loser errors on an instance that is already
          # starting — which is not a failure of anything, so what decides the
          # step is whether Docker answers, with a grace period for the winner
          # to finish. Nothing is retried; this only waits.
          for _ in $(seq 1 30); do
            docker info >/dev/null 2>&1 && break
            sleep 10
          done
          docker info >/dev/null 2>&1 || { echo "::error::Colima is up but Docker is unreachable."; exit 1; }
          echo "Colima is up."

          # A VM that was started with the old single-stack budget cannot hold
          # several lanes, and it is NOT this job's business to fix that:
          # restarting Colima destroys every running container on the box —
          # the other runner's lane, a developer's stack, an agent's `pre-pr`
          # mid-suite. So say so and carry on; the suite will simply be slower
          # or, at worst, fail on a lane that could not start.
          vm_mem=$(docker info --format '{{.MemTotal}}' 2>/dev/null || echo 0)
          if [ "$vm_mem" -lt 12000000000 ]; then
            echo "::warning::Colima has $((vm_mem / 1000000000)) GB; lanes want 16. Resize it during a quiet window (nothing else running on this box): colima stop && colima start --cpu 8 --memory 16 --disk 100"
          fi

      - name: Install dependencies
        if: ${{ steps.scope.outputs.needed == 'true' }}
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        if: ${{ steps.scope.outputs.needed == 'true' }}
        run: npx playwright install --with-deps chromium

      # Lanes isolate the database, not the CPU. When somebody runs something
      # heavy on this Mac, the browser suite slows and flakes, and the failure
      # reads as the branch's fault. Say what the box is carrying, then wait
      # while it is over twice its core count. It never refuses: a job that
      # declines is worse than a slow one, the same rule pre-pr follows
      # (muk.events #1479). the repository variable MUK_BOX_LOAD_WAIT=0 skips the wait.
      - name: What the box is carrying
        id: box
        shell: bash
        if: ${{ steps.scope.outputs.needed == 'true' }}
        env:
          MUK_BOX_LOAD_WAIT: ${{ vars.MUK_BOX_LOAD_WAIT || '600' }}
        run: |
          set -uo pipefail
          line="$(node scripts/box-load.mjs --wait 2>&1 | tail -20)" || true
          echo "$line"
          {
            echo "<details><summary>What the box was carrying when this job started</summary>"
            echo
            echo '```'
            echo "$line"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # WHICH LANE? The runner's own name, because a runner executes one job at
      # a time — so a lane pinned to it is exclusive without any lock, and two
      # jobs on two runners can never pick the same one. `tostinn-mac-local-3`
      # takes ci-3; a name with no trailing index (the first runner, or a hosted
      # VM on a Dependabot PR) takes ci-1.
      - name: Pick this runner's lane
        id: lane
        shell: bash
        if: ${{ steps.scope.outputs.needed == 'true' }}
        run: |
          set -euo pipefail
          case "${RUNNER_NAME:-}" in
            *-2) lane=ci-2 ;;
            *-3) lane=ci-3 ;;
            *-4) lane=ci-4 ;;
            *)   lane=ci-1 ;;
          esac
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "Runner ${RUNNER_NAME:-unknown} → lane $lane"

      # Syncs this checkout's migrations, functions and seed into the lane,
      # starts it, resets the database, and proves it is SERVING (not merely
      # up) before a single test runs. Exit 78 means the stack is not answering
      # — the recycle step below acts on that code alone.
      - name: Bring up the lane
        id: stack
        shell: bash
        if: ${{ steps.scope.outputs.needed == 'true' }}
        run: |
          set -uo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          node scripts/stack-lane.mjs up "${{ steps.lane.outputs.lane }}"
          code=$?
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      # The lane's URL, keys and app port into the job environment, so the suite
      # and its seeding scripts all address the same database. E2E_PORT comes
      # from here too: each lane owns a distinct one, which is what lets two
      # `next start` servers coexist on this box.
      - name: Point the suite at the lane
        shell: bash
        if: ${{ steps.scope.outputs.needed == 'true' }}
        run: |
          set -euo pipefail
          node scripts/stack-lane.mjs env "${{ steps.lane.outputs.lane }}" --plain >> "$GITHUB_ENV"

      # Anything still listening on this lane's port is a `next start` a killed
      # run left behind. Lanes make that per-lane rather than machine-wide.
      - name: Free the lane's app port
        shell: bash
        if: ${{ steps.scope.outputs.needed == 'true' }}
        run: lsof -ti :"$E2E_PORT" | xargs kill 2>/dev/null || true

      # visual-chromium is EXCLUDED on Linux, and this is not a convenience.
      # The snapshots in tests/*-snapshots/ were captured on macOS/ARM — the
      # same platform as the self-hosted pool — so on a Linux runner every one
      # of them fails on font rasterisation, for reasons that have nothing to do
      # with the pull request. The only Linux path here is a Dependabot PR, and
      # a dependency bump is not the change that should be re-baselining
      # screenshots. Said out loud rather than silently narrowed: a smaller
      # suite that reads as a full one is the failure mode this workflow's own
      # secret preflights exist to prevent.
      - name: Run the browser suite
        id: suite
        shell: bash
        if: ${{ steps.scope.outputs.needed == 'true' }}
        run: |
          set -uo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          projects="--project=chromium --project=mobile-chromium"
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "::warning::visual-chromium skipped: its baselines are macOS/ARM and cannot pass on a Linux runner."
            {
              echo "> **visual-regression was not run.** Its baselines are macOS/ARM;"
              echo "> this job is on a Linux runner (Dependabot). The golden flows and"
              echo "> mobile touch project did run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            projects="$projects --project=visual-chromium"
          fi
          # The exit code is captured rather than propagated straight away: 78
          # is scripts/e2e-local.mjs's "the stack itself is not answering",
          # which the recycle step below acts on. Every other code — including
          # an ordinary red suite — passes through unchanged.
          set +e
          # shellcheck disable=SC2086
          npm run e2e:local -- $projects --reporter=list,json
          code=$?
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Add Playwright results to run summary
        if: ${{ always() && steps.scope.outputs.needed == 'true' }}
        run: node scripts/write-ci-summary.mjs playwright .playwright-results.json

      # The stack is reused between runs on purpose (see the note below the
      # suite), and `db reset` keeps its DATA clean either way — but neither
      # fixes a CONTAINER that has stopped answering, and a wedged one is
      # inherited by every later run on this box. That happened on 2026-08-12:
      # one PR's golden flows all timed out at the same 20.3s, the next died
      # after eleven green tests, and a third failed seeding with a 502 out of
      # the local Auth API — three symptoms, one stack, and a fail-closed
      # required check in front of all of them
      # (muk.events docs/audit-2026-08-12-ci-cd.md, C8).
      #
      # Recycling only on 78 is the point: a red SUITE must not cost the next
      # run a cold start, and a wedged STACK must not be handed on. The
      # detection lives in muk.events' own preflight, which local developers
      # run too; the recovery lives here, because this job owns the machine.
      # A red suite is read before anything else, so the load at that moment
      # belongs in the same place. A run that failed at load 40 on 14 cores is
      # a different conversation from one that failed on an idle box.
      - name: What the box was carrying when this failed
        if: ${{ failure() && steps.scope.outputs.needed == 'true' }}
        shell: bash
        run: |
          set -uo pipefail
          echo "> **Box at the moment this failed:** $(node scripts/box-load.mjs 2>&1 | tail -1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Recycle a wedged lane
        if: ${{ always() && steps.scope.outputs.needed == 'true' && (steps.suite.outputs.exit-code == '78' || steps.stack.outputs.exit-code == '78') }}
        shell: bash
        run: |
          set -uo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          echo "::warning::This runner's lane was not answering — stopping it so the next run rebuilds."
          {
            echo "> **This runner's lane was recycled.** Its preflight found a"
            echo "> container that was up but not serving, so this job stopped"
            echo "> the lane rather than leave the fault for the next run."
            echo "> Only this runner's lane is affected — other e2e jobs and"
            echo "> local runs have their own."
            echo "> Nothing is wrong with this pull request; re-run the job."
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/stack-lane.mjs down "${{ steps.lane.outputs.lane }}" || true

      # Deliberately NOT stopping the lane: its images and volumes are what make
      # the next run's start a few seconds instead of a few minutes, and
      # `stack-lane up` resets the database, so a leftover lane is never stale
      # state. What does get cleaned is the app server, which would otherwise
      # hold the port.
      - name: Release the lane's app port
        if: ${{ always() && steps.scope.outputs.needed == 'true' }}
        shell: bash
        run: lsof -ti :"$E2E_PORT" | xargs kill 2>/dev/null || true

  # The required-check gate. The work happens in a job whose NAME may change —
  # it has been "Playwright e2e (shard 1/2)" and is now "Playwright e2e (local
  # stack)" — while the main ruleset requires the exact context "Playwright
  # e2e". That indirection is the whole point of this job: the suite can be
  # restructured without touching branch protection, which is the kind of edit
  # that blocks every PR forever when it goes wrong. Fail-closed: it runs
  # `always()` and inspects the result, so a job that was skipped or never ran
  # blocks the merge instead of silently satisfying the check.
  e2e-gate:
    name: Playwright e2e
    needs: [e2e]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ${{ github.actor == 'dependabot[bot]' && 'ubuntu-latest' || fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 5
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Playwright e2e (required-check gate)

          A name-stable gate that the branch protection ruleset can require. The real work happens in the `Playwright e2e (lane)` job; this one passes only when that job passed.

          ❌ The suite failed OR was skipped. Deliberately fail-closed, so a job that never ran blocks the merge instead of quietly satisfying the check — the actual failure is in the job above.
          TLDR

      - name: The browser suite passed
        run: |
          e2e_result="${{ needs.e2e.result }}"
          if [ "$e2e_result" != "success" ]; then
            echo "::error::The Playwright suite did not pass (result: $e2e_result)."
            exit 1
          fi
          echo "Every browser project passed against the local stack."

  # ---------------------------------------------------------------------------
  # Continuous delivery. Vercel already ships the Next.js app from main via its
  # git integration; these two jobs close the gap the 2026-07-13 audit had to
  # reconcile by hand — the database schema and the edge functions, both of
  # which were applied to production manually until now.
  #
  # Each self-skips when its secret is absent, so the pipeline stays green until
  # the secrets are added (see supabase/MIGRATIONS.md).
  # ---------------------------------------------------------------------------
  # The production-deploy jobs carry "merge to main only" in their names because
  # a PR's run renders them as skipped — which read as "this never deployed". It
  # did: the squash-merge pushes main, that push starts its own run of this same
  # workflow, and THAT run deploys. The PR run's skip is the design, not a
  # failure.
  #
  # Migrations and edge functions deploy in a single job: they were two
  # sequential jobs (deploy-functions needed deploy-db), so each re-paid its own
  # checkout + toolchain setup and a runner handoff — ~half a minute of overhead
  # on the delivery path for two steps that take seconds. One job keeps the exact
  # ordering (schema first, then functions) with one setup. A failure in the
  # migration steps still aborts before any function deploys, same as the old
  # needs: [deploy-db] edge.
  deploy-backend:
    name: Deploy migrations & edge functions (merge to main only)
    # No e2e here: it is PR-only now (run once per change). The main ruleset
    # requires branches to be up to date before merging, so the squash-merged
    # tree is exactly the one the PR's e2e shards passed against — re-running it
    # on this push would prove nothing. quality/rules/migrations still guard the
    # merged commit directly.
    needs: [quality, rules, migrations]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Running deploys self-hosted puts SUPABASE_DB_URL / SUPABASE_ACCESS_TOKEN
    # on our own hardware instead of a disposable VM — accepted 2026-07-16 to
    # stay under the Actions minutes cap; the box already runs everything else
    # under one user. Revisit when hardening (docs/self-hosted-runners.md).
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 15
    # Staging for main-only deploy secrets (muk.events M13). Today the
    # environment has no secrets, no protection rules and no branch policy,
    # so this changes nothing: with no environment secret of the same name, the
    # job reads the secret the caller passes, as before. Once the owner restricts
    # the environment to `main` and copies the deploy secrets into it, the
    # environment's copy takes precedence here and the repo-level copy can go.
    # `deployment: false` keeps GitHub from creating a second Deployment record
    # beside the one this job writes for DORA below.
    environment:
      name: production-backend
      deployment: false
    permissions:
      contents: read
      # For the DORA deployment record below.
      deployments: write
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Deploy migrations & edge functions (merge to main only)

          Ships the database schema and the Supabase edge functions to production, then re-asserts RLS scoping and checks strictly for drift. It runs only on a push to main; on a pull request it shows as skipped, which is the design — the squash-merge starts its own run, and THAT run deploys.

          ❌ The app may be live against a backend that is not what this commit expects. Schema and functions cannot silently diverge (a failed migration stops the job before any function deploys), but fix this before merging anything further.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/supabase-cli # the version muk.events pins in .supabase-cli-version

      - name: Push migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL not set — cannot deploy migrations. A deploy job that decides not to deploy is a failed deploy, not a green one."
            exit 1
          fi
          # --db-url avoids `supabase link` (this repo has no config.toml). Only
          # migrations missing from the remote ledger run; the other apps'
          # migrations are already recorded there and are left untouched.
          #
          # --include-all applies muk migrations whose timestamp sorts BEFORE the
          # last one already on remote. Without it, `db push` refuses the whole
          # deploy the moment two migration-carrying PRs are open at once and the
          # later-timestamped one merges first (the older PR's migration is then
          # "inserted before" it) — and because this step aborts before the
          # function deploy below, it strands the edge functions too. That is a
          # recurring, self-inflicted delay, not a safety net: this job runs only
          # on push-to-main, so every migration here is already approved and
          # shipping, and the STRICT drift check right after re-verifies every
          # migration actually landed — a genuinely lost one still fails loudly.
          # It only ever considers muk's local files, so other apps' ledger rows
          # stay untouched exactly as before.
          supabase db push --include-all --db-url "$SUPABASE_DB_URL"

      - name: Assert muk RLS is still scoped to muk membership
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then exit 0; fi
          psql "$SUPABASE_DB_URL" --no-psqlrc -v ON_ERROR_STOP=1 -f scripts/assert-rls-scoping.sql

      # STRICT here: the push above just ran, so anything still missing from the
      # ledger means the deploy genuinely lost it.
      - name: Check for drift
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STRICT: "1"
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then exit 0; fi
          node scripts/check-migration-drift.mjs

      # Functions after the schema they may depend on. Deploys every function
      # rather than only the changed ones: it is idempotent, takes about a
      # minute, and makes source drift between supabase/functions/ and the
      # deployed code structurally impossible — the drift the audit had to rule
      # out by hand. Function secrets live in the Supabase dashboard and are not
      # touched by a deploy.
      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN not set — cannot deploy edge functions."
            exit 1
          fi
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      # DORA instrumentation: one GitHub Deployment per backend deploy, so
      # deployment frequency and lead time are queryable from the API instead
      # of reconstructed from run logs. The nightly DORA summary in
      # muk-scheduled-checks.yml reads these. Reached only when every deploy
      # step above succeeded, so a record always means "this landed".
      - name: Record deployment (DORA)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bookkeeping, not a gate: this backend deploy already landed, and
          # deploy-app needs this JOB to succeed to run at all. A transient
          # GitHub API blip (a 504 hit main on 2026-09-02) must not skip the
          # real deploy behind a metrics record — so this retries a few times
          # and, failing that, warns rather than fails.
          # The deployment is created once; a retry only repeats the status
          # call, so one release never becomes several deployment records.
          record() {
            if [ ! -s "$RUNNER_TEMP/deployment-id" ]; then
              printf '{"ref":"%s","environment":"production-backend","auto_merge":false,"required_contexts":[],"description":"Supabase migrations + edge functions"}' "$GITHUB_SHA" \
                | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id' > "$RUNNER_TEMP/deployment-id" \
                || { rm -f "$RUNNER_TEMP/deployment-id"; return 1; }
            fi
            gh api "repos/$GITHUB_REPOSITORY/deployments/$(cat "$RUNNER_TEMP/deployment-id")/statuses" \
                 -f state=success -f description="Deployed by run $GITHUB_RUN_ID"
          }
          for attempt in 1 2 3; do
            record && exit 0
            echo "::warning::DORA deployment record attempt $attempt failed (GitHub API)."
            sleep $((attempt * 5))
          done
          echo "::warning::Could not record the DORA deployment after 3 attempts — the backend deploy itself succeeded; only the metrics dashboard is missing this row."

  # ---------------------------------------------------------------------------
  # Frontend delivery, gated on CI. Historically Vercel's own git integration
  # shipped the Next.js app straight off a push — for BOTH preview and
  # production — with no dependency on the checks in this pipeline, so a red
  # e2e or a not-yet-applied migration could not stop (or even delay) a deploy,
  # and the app could go live tens of minutes before deploy-db/deploy-functions.
  # This job moves the deploy behind the checks: production only after the
  # schema and functions are live.
  #
  # Gated on the VERCEL_DEPLOY_ENABLED repo variable, so re-pinning a consumer
  # to this SHA changes nothing until the variable is set to 'true'. The
  # cutover (see docs) was: create the VERCEL_* secrets, set
  # VERCEL_DEPLOY_ENABLED=true, and disable Vercel's git deployments
  # (vercel.json `git.deploymentEnabled: false`) so the two paths never
  # double-deploy.
  #
  # THERE IS NO PREVIEW DEPLOY, deliberately (muk.events#660). One used to
  # build every same-repo PR and post a preview URL. What it cost was a second
  # full Next build plus a Vercel upload on every PR, on a three-runner
  # self-hosted pool where runner capacity — not wall-clock — is the scarce
  # resource. What it bought was a URL nobody clicked, and one real thing worth
  # naming since it is now gone: it exercised the `vercel pull/build/deploy
  # --prebuilt` path BEFORE merge, so a break in the prebuilt pipeline itself
  # surfaced on a pull request instead of on the production deploy.
  #
  # That trade is acceptable because the post-merge failure mode is benign and
  # loud rather than silent: deploy-app below verifies that www.muk.events
  # actually serves the new commit before recording success, so a broken
  # prebuilt pipeline turns main red and leaves production on the PREVIOUS
  # commit — stale, not broken. If that ever stops being true, the preview job
  # is the thing to bring back.
  # ---------------------------------------------------------------------------
  deploy-app:
    name: Deploy app to Vercel (production — merge to main only)
    # After the backend: the schema and edge functions must be live before the
    # frontend that depends on them. deploy-backend deploys both, schema first.
    needs: [deploy-backend]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      vars.VERCEL_DEPLOY_ENABLED == 'true'
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 15
    # Staged like deploy-backend's (see there). The "production" Deployment
    # record below names the same environment; GitHub matches names
    # case-insensitively.
    environment:
      name: Production
      deployment: false
    permissions:
      contents: read
      # For the DORA deployment record below.
      deployments: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Deploy app to Vercel (production — merge to main only)

          Ships the web app to production, AFTER the schema and edge functions are live, then polls www.muk.events until it actually serves this commit before recording the deployment.

          ✅ The live site is serving this exact commit — verified, not assumed.

          ❌ Either the deploy failed, or it succeeded but the domain never served the new build (an alias or custom-domain slip). Production is likely still serving the previous commit.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The build reads commit subjects to map each commit to the PR that
          # carried it (muk.events#731), and squash-merge subjects end in
          # "(#NNN)". A depth-1 checkout sees only the tip, so the map would be
          # one entry and every older row would fall back to its hash.
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # BUILT HERE, then shipped. `vercel deploy` without --prebuilt uploads the
      # source and rebuilds it in Vercel's own container: a different machine,
      # a different install, and a toolchain this pipeline does not pin — so the
      # bytes that reached members were never the bytes any check ran against
      # (the 2026-07-30 audit's M1). `vercel build` here produces .vercel/output
      # from the same checkout, the same .nvmrc Node and the same lockfile every
      # job above used, and --prebuilt uploads exactly that.
      #
      # `pull` first because the build needs the project's production
      # environment variables, which live in Vercel's project settings rather
      # than in this pipeline's secrets; it writes them to
      # .vercel/.env.production.local, where `vercel build` reads them.
      #
      # The build's own identity is unaffected: next.config.ts prefers
      # VERCEL_GIT_COMMIT_SHA and falls back to `git rev-parse HEAD`, which in
      # this checkout is the commit being deployed — and the verification step
      # below refuses to record a deployment the domain does not serve under
      # that exact SHA, so a mistake here fails loudly rather than shipping a
      # build labelled as something else.
      #
      # --archive=tgz: the prebuilt output is ~1,000 files, and without the
      # flag the CLI uploads each as its own API request. On 2026-08-22 — a
      # day of 29 CI runs, each with a preview and most with a production
      # deploy — that crossed Vercel's per-day upload cap
      # ("Too many requests - try again in 24 hours (more than 5000, code:
      # api-upload-free)") and the production deploy of muk.events#603 failed
      # AFTER the schema had shipped, leaving prod one commit behind. The
      # archive is one upload per deploy regardless of how many files the
      # build emits, so the ceiling stops being a function of how busy the day
      # was. Deploy semantics are unchanged: Vercel unpacks the archive
      # server-side and the result is the same prebuilt deployment; the
      # verify step below still has to see this commit served before anything
      # is recorded.
      # The token reaches only the pull and deploy steps, through the
      # environment (the CLI reads VERCEL_TOKEN itself, so it is not in any
      # process's arguments). `vercel build` runs this checkout's install and
      # build scripts and gets no token.
      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_DEPLOY_ENABLED is 'true' but VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID are not all set. A production deploy that cannot authenticate is a failed deploy, not a green one."
            exit 1
          fi
          # On 2026-08-29 the upload died on "Error: fetch failed" after the
          # schema had already shipped, which leaves prod a commit behind until
          # somebody re-runs the job by hand. Retrying in place is what that
          # re-run does anyway, and the verify step below is what decides
          # whether the deploy counted, so a duplicate attempt cannot record a
          # build the domain does not serve.
          cat > "$RUNNER_TEMP/retry.sh" <<'RETRY'
          retry() {
            local what="$1"; shift
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 3 ]; then
                echo "::error::$what failed three times. A network-level failure here is Vercel's API rather than this commit; re-run the job."
                return 1
              fi
              echo "::warning::$what failed (attempt $attempt of 3), retrying in $((attempt * 15))s."
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
            done
          }
          RETRY
          . "$RUNNER_TEMP/retry.sh"
          retry "vercel pull" npx --yes vercel@58.4.4 pull --yes --environment=production

      - name: Build production
        run: |
          . "$RUNNER_TEMP/retry.sh"
          retry "vercel build" npx --yes vercel@58.4.4 build --prod

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # The build step above runs this checkout's own scripts, which can
          # write to RUNNER_TEMP; this step holds the token, so it recreates
          # the helper here instead of sourcing a file the build could have
          # replaced.
          retry() {
            local what="$1"; shift
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 3 ]; then
                echo "::error::$what failed three times. A network-level failure here is Vercel's API rather than this commit; re-run the job."
                return 1
              fi
              echo "::warning::$what failed (attempt $attempt of 3), retrying in $((attempt * 15))s."
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
            done
          }
          retry "vercel deploy" npx --yes vercel@58.4.4 deploy --prebuilt --archive=tgz --prod --yes

      # The CLI returning is not the same thing as the site serving this build:
      # an alias/custom-domain slip or a stale edge would be recorded below as
      # a successful production deployment of a commit the domain never served
      # (the deploy above targets whatever www.muk.events is aliased to, and
      # /api/version is force-dynamic + no-store precisely so this probe cannot
      # be answered from a cache). Poll until the domain reports this run's
      # commit; three minutes is generous — alias flips are usually seconds.
      - name: Verify www.muk.events serves this commit
        run: |
          for _ in $(seq 1 36); do
            served=$(curl -fsS --max-time 10 https://www.muk.events/api/version | \
              sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p') || served=""
            if [ "$served" = "$GITHUB_SHA" ]; then
              echo "www.muk.events serves $served"
              exit 0
            fi
            echo "www.muk.events serves ${served:-nothing} — waiting for $GITHUB_SHA"
            sleep 5
          done
          echo "::error::www.muk.events never served $GITHUB_SHA — the deploy returned success but the custom domain still answers with another build. Not recording a successful deployment."
          exit 1

      # DORA instrumentation: this is THE user-facing production deploy, so the
      # "production" environment record lives here (deploy-backend records
      # "production-backend"). The nightly DORA summary counts these.
      - name: Record deployment (DORA)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bookkeeping, not a gate: the domain already proved it serves this
          # commit, and post-deploy-smoke needs this JOB to succeed to run at
          # all. A transient GitHub API blip (a 504 hit main on 2026-09-02)
          # must not skip the real smoke check behind a metrics record — so
          # this retries a few times and, failing that, warns rather than
          # fails.
          # The deployment is created once; a retry only repeats the status
          # call, so one release never becomes several deployment records.
          record() {
            if [ ! -s "$RUNNER_TEMP/deployment-id" ]; then
              printf '{"ref":"%s","environment":"production","auto_merge":false,"required_contexts":[],"description":"Next.js app on Vercel"}' "$GITHUB_SHA" \
                | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id' > "$RUNNER_TEMP/deployment-id" \
                || { rm -f "$RUNNER_TEMP/deployment-id"; return 1; }
            fi
            gh api "repos/$GITHUB_REPOSITORY/deployments/$(cat "$RUNNER_TEMP/deployment-id")/statuses" \
                 -f state=success -f environment_url="https://muk.events" -f description="Deployed by run $GITHUB_RUN_ID"
          }
          for attempt in 1 2 3; do
            record && exit 0
            echo "::warning::DORA deployment record attempt $attempt failed (GitHub API)."
            sleep $((attempt * 5))
          done
          echo "::warning::Could not record the DORA deployment after 3 attempts — the app deploy itself succeeded; only the metrics dashboard is missing this row."

  # ---------------------------------------------------------------------------
  # The only thing that exercises an AUTHENTICATED production flow after a
  # deploy.
  #
  # Until 2026-08-10 the PR suite ran against production, so app code that was
  # incompatible with the deployed schema or edge functions failed at PR time.
  # Moving to a local stack was right — it removed the shared-account
  # contention and the secrets — but the comment above the e2e job claimed the
  # lost signal "surfaces on the main run", and it does not: e2e is
  # pull_request-only, quality/rules/migrations never talk to the deployed app,
  # deploy-app proves the bundle SHIPPED rather than that it works, and the
  # heartbeat probes /api/version plus one anon RPC. A member reporting it was
  # the detector (muk.events docs/audit-2026-08-12-ci-cd.md, C2).
  #
  # This is deliberately a SMOKE and not the suite: a handful of read-only
  # authenticated screens, tagged @smoke in muk's own specs, against the build
  # deploy-app just verified the domain is serving. It writes nothing, so it
  # cannot leave rows in production the way the old prod suite could — the
  # weekly browser matrix remains the only thing that mutates those accounts.
  #
  # Red here means production is serving a build that a signed-in member
  # cannot use. It does not roll back — there is nothing safe to roll back TO
  # without knowing which half broke — it goes red on main and says so.
  post-deploy-smoke:
    name: Post-deploy smoke (production — merge to main only)
    needs: [deploy-app]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      vars.VERCEL_DEPLOY_ENABLED == 'true'
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 20
    # Staged like deploy-backend's (see there). `production-backend`, not
    # `Production`: the service-role key and the E2E logins it reads live there
    # once, beside every nightly that reads them (muk#2266); `Production`
    # holds only the Vercel credentials.
    environment:
      name: production-backend
      deployment: false
    env:
      # Not :3100 and not :3000 — nothing is served here. The suite talks to
      # the public domain, and playwright.config.ts starts no webServer when
      # PLAYWRIGHT_BASE_URL is set.
      PLAYWRIGHT_BASE_URL: https://www.muk.events
      PLAYWRIGHT_SKIP_BROWSER_GC: "1"
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Post-deploy smoke (production)

          A handful of read-only authenticated screens, driven against www.muk.events immediately after the deploy verified the domain serves this commit. The only check in this pipeline that proves a signed-in member can still use production.

          ❌ Production is broken for members right now, most likely app code meeting a schema or function contract it does not match — the failure class the PR suite stopped catching when it moved to a local stack. Nothing rolls back; fix forward, and check `deploy-backend` for what shipped alongside.
          TLDR

      - name: Required secrets are present
        env:
          E2E_ADMIN_NAME: ${{ secrets.E2E_ADMIN_NAME }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ -n "$E2E_ADMIN_NAME" ] || missing="$missing E2E_ADMIN_NAME"
          [ -n "$E2E_ADMIN_PASSWORD" ] || missing="$missing E2E_ADMIN_PASSWORD"
          [ -n "$E2E_ADMIN_EMAIL" ] || missing="$missing E2E_ADMIN_EMAIL"
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ] || missing="$missing NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing — the smoke would self-skip and report green having checked nothing, which is worse than not running it."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Drive the smoke against production
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          # The helper mints a session cookie with this rather than driving the
          # name-login UI, which production rate-limits at 10 per five minutes.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ADMIN_NAME: ${{ secrets.E2E_ADMIN_NAME }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_STAFF_NAME: ${{ secrets.E2E_STAFF_NAME }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
        run: npm run smoke:prod
