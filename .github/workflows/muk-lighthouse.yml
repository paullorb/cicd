name: muk.events Lighthouse

# Lives in its own workflow, NOT in ci.yml, on purpose (Codex review on
# PR #126): ci.yml's workflow-level concurrency group does not cancel on
# main, so a perf job left queued by an offline muk-ci runner would keep
# the main CI run active and queue subsequent pushes — and their DB and
# edge-function deploys — behind it for up to 24 hours. In its own group,
# an unavailable advisory runner can only ever delay Lighthouse itself.

on:
  workflow_call:
    secrets:
      E2E_ADMIN_NAME:
        required: true
      E2E_ADMIN_PASSWORD:
        required: true
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:
        required: true
      NEXT_PUBLIC_SUPABASE_URL:
        required: true

permissions:
  contents: read

jobs:
  perf:
    # GitHub does not expose repository secrets to forked pull requests. Internal
    # PRs and main pushes run the full authenticated matrix; forks keep their
    # ordinary non-secret CI coverage without receiving production credentials.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # Runs on our self-hosted runner (label muk-ci) instead of ubuntu-latest.
    # Authenticated audits use a test account plus the public Supabase config;
    # no service-role, database or deployment credentials reach the box. See
    # docs/self-hosted-runners.md. The box needs Node (via setup-node), Chrome
    # and npm; nothing else. If no muk-ci runner is
    # online the job sits queued — it gates nothing, so a merge never waits.
    name: Lighthouse budget
    runs-on: [self-hosted, muk-ci]
    env:
      # Reserved for CI. Local Next dev keeps its default :3000, so Lighthouse
      # cannot block or accidentally audit a Codex/Claude development server.
      LIGHTHOUSE_PORT: "3200"
      E2E_ADMIN_NAME: ${{ secrets.E2E_ADMIN_NAME }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
    # A self-hosted job that hangs holds the runner slot; the default of
    # 360 minutes is far too generous. The first cold run on the Mac took
    # 13m30s (Node download, cold npm and build caches); desktop-only warm
    # runs took ~9m. The mobile pass doubles the collection (another
    # 7 URLs x 3 runs against the same build), so leave headroom for both
    # passes on a busy box.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          # ~/.npm already persists on the self-hosted box. setup-node's cloud
          # cache downloaded the same 1.4 GB archive in every parallel job.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # LHCI's authenticated-browser hook uses puppeteer-core from Lighthouse's
      # dependency tree. Point it at the runner's installed Chrome explicitly;
      # puppeteer-core deliberately ships without its own browser download.
      - name: Locate Chrome
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            chrome_path="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            chrome_path="$(command -v chromium)"
          elif [[ -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]]; then
            chrome_path="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          else
            echo "Chrome executable not found" >&2
            exit 1
          fi
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      # The port is CI-owned, so a listener here can only be debris from a
      # cancelled Lighthouse run. Clear it without touching the :3000 dev
      # server used by Codex, Claude, or a human.
      - name: Free the Lighthouse port
        shell: bash
        run: lsof -ti :"$LIGHTHOUSE_PORT" | xargs kill 2>/dev/null || true

      # Advisory: deliberately NOT a required check on main, so a merge never
      # waits on it. It reports, it does not gate.
      #
      # Public, authenticated, legacy-redirect and deterministic invalid-token
      # surfaces all share the same hard byte budgets. Scores stay advisory
      # because even a dedicated runner has timing noise; transfer size does not.
      #
      # Two passes over the same URLs and the same production build: desktop
      # first, then mobile (Lighthouse's default form factor and CPU/network
      # throttling — lighthouserc.mobile.json simply sets no desktop preset).
      # `/theke` is intentionally absent until this job has kiosk credentials:
      # an admin session is redirected to `/check-in`, so including it only
      # audits the same page twice and attributes the redirect cost to check-in.
      # Real users are mostly on phones, so the desktop numbers alone would
      # mask CPU-throttled reality. Each `lhci autorun` starts and stops
      # `npm run start` itself against the already-built app, so nothing is
      # rebuilt between passes and port 3200 is never contended. PRs take one
      # sample per route for fast feedback; main keeps three samples for the
      # stable baseline. Uploaded
      # reports land in separate output dirs (.lighthouseci vs
      # .lighthouseci/mobile — nested so the existing gitignore entry covers
      # both) so the passes cannot clobber each other: the mobile pass's
      # collect only clears lhr-*.json/html intermediates in .lighthouseci,
      # never the desktop pass's *.report.* uploads or subdirectories.
      - name: Lighthouse CI (desktop)
        id: lighthouse-desktop
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.json
          runs: ${{ github.event_name == 'pull_request' && '1' || '3' }}

      # Runs even when the desktop pass fails its budgets: both passes are
      # advisory, and the mobile report is exactly the signal you want while
      # diagnosing a regression the desktop pass flagged. It still skips when
      # the desktop pass never ran (setup/build failure, cancellation).
      - name: Lighthouse CI (mobile)
        if: ${{ !cancelled() && steps.lighthouse-desktop.outcome != 'skipped' }}
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.mobile.json
          runs: ${{ github.event_name == 'pull_request' && '1' || '3' }}
