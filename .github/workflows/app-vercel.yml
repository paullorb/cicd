name: App Vercel deploy

# Generic Vercel delivery for independently configured app repositories.
# The caller owns its Vercel project and passes only that repository's IDs and
# token. Git integration should be disabled in vercel.json so CI is the sole
# deploy path.
#
# PRODUCTION ONLY. There was a `preview` job here, deploying every pull
# request. No preview was anyone's environment: nothing linked one, nothing
# tested against one, and the check it posted was required nowhere — while the
# deploys counted against the one per-day quota every project under the
# account shares, which paullorber went through on 2026-10-08 (108 of 100,
# 12 of its previews against 8 production deploys in five hours). A repo that
# wants a preview of a branch can deploy it by hand; it is not something CI
# should do on every push.

on:
  workflow_call:
    inputs:
      node_version_file:
        description: Node version file owned by the caller repository.
        required: false
        default: .node-version
        type: string
      vercel_scope:
        description: Vercel team slug used by the CLI scope flag.
        required: true
        type: string
      required_public_url_env:
        description: Optional environment variable that must contain a valid HTTP(S) URL before building.
        required: false
        default: ""
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: 57.0.0

# The deploy passes --archive=tgz. Every Vercel project under one account
# shares one per-day upload quota, and the CLI's default is one upload request
# per file in .vercel/output — muk.events (~1,000 files a build) exhausted it on
# 2026-08-22 and its production deploy failed. The archive is one upload per
# deploy, whatever the build emits, so this project can neither drain the
# quota for its neighbours nor be drained by them. Deploy semantics are
# unchanged: Vercel unpacks server-side and the result is the same prebuilt
# deployment.

jobs:
  production:
    name: Deploy app to Vercel, production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.CI_LABELS || '["self-hosted","app-ci"]') }}
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ inputs.vercel_scope }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ${{ inputs.node_version_file }}

      - name: Install dependencies
        run: npm ci

      - name: Pull production environment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull \
            --yes --environment=production --scope "$VERCEL_SCOPE" \
            --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN"

      - name: Build locally with production environment
        shell: bash
        env:
          VERCEL_REQUIRED_PUBLIC_URL_ENV: ${{ inputs.required_public_url_env }}
        run: |
          node --env-file=.vercel/.env.production.local <<'NODE'
          const { spawnSync } = require('node:child_process');

          const key = process.env.VERCEL_REQUIRED_PUBLIC_URL_ENV;
          if (key) {
            const value = process.env[key];
            let url;
            try {
              url = new URL(value);
            } catch {
              throw new Error(`${key} must be a valid HTTP(S) URL before production build.`);
            }
            if (!['http:', 'https:'].includes(url.protocol) || !url.hostname) {
              throw new Error(`${key} must be a valid HTTP(S) URL before production build.`);
            }
          }

          const build = spawnSync(
            'npx',
            [
              '--yes',
              `vercel@${process.env.VERCEL_CLI_VERSION}`,
              'build',
              '--prod',
              '--scope',
              process.env.VERCEL_SCOPE,
            ],
            { env: process.env, stdio: 'inherit' },
          );
          if (build.error) throw build.error;
          process.exit(build.status ?? 1);
          NODE

      - name: Deploy prebuilt production output
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy \
            --prebuilt --archive=tgz --prod --yes --scope "$VERCEL_SCOPE" \
            --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Vercel production" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
