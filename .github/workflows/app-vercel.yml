name: App Vercel deploy

# Generic Vercel delivery for independently configured app repositories.
# The caller owns its Vercel project and passes only that repository's IDs and
# token. Git integration should be disabled in vercel.json so CI is the sole
# deploy path.

on:
  workflow_call:
    inputs:
      node_version_file:
        description: Node version file owned by the caller repository.
        required: false
        default: .node-version
        type: string
      vercel_scope:
        description: Vercel team slug used by the CLI scope flag.
        required: true
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      VERCEL_PROJECT_ID:
        required: true

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: 57.0.0

jobs:
  preview:
    name: Deploy app to Vercel, preview
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ${{ fromJSON(vars.CI_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ inputs.vercel_scope }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ${{ inputs.node_version_file }}

      - name: Install dependencies
        run: npm ci

      - name: Build and deploy the tested revision
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull \
            --yes --environment=preview --scope "$VERCEL_SCOPE" \
            --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN"
          npx --yes "vercel@$VERCEL_CLI_VERSION" build \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          url=$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy \
            --prebuilt --yes --target=preview --scope "$VERCEL_SCOPE" \
            --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Vercel preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Deploy app to Vercel, production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.CI_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_SCOPE: ${{ inputs.vercel_scope }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ${{ inputs.node_version_file }}

      - name: Install dependencies
        run: npm ci

      - name: Build and deploy the tested revision
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes "vercel@$VERCEL_CLI_VERSION" pull \
            --yes --environment=production --scope "$VERCEL_SCOPE" \
            --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN"
          npx --yes "vercel@$VERCEL_CLI_VERSION" build \
            --prod --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          url=$(npx --yes "vercel@$VERCEL_CLI_VERSION" deploy \
            --prebuilt --prod --yes --scope "$VERCEL_SCOPE" \
            --project "$VERCEL_PROJECT_ID" --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Vercel production" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
