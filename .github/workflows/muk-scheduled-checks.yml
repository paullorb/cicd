name: muk.events scheduled checks

# The cheap daily sweep: has production drifted from this repo, and has Supabase
# started complaining about anything muk owns? Both are things the 2026-07-13
# audit found by hand; neither should need an audit to surface again.
#
# A failure here emails the repo owner — that is the alert. Missing secrets
# FAIL these jobs rather than skipping them: a nightly canary whose secrets are
# gone must alarm, not fall silent — "the detector for a silently-broken deploy
# was disabled by the exact condition it exists to detect" was 2026-07-14 audit
# finding S1.

on:
  workflow_call:
    inputs:
      # See the identical input in muk-ci.yml for why this is not a constant.
      supabase_project_ref:
        description: Supabase project the schema, functions and types belong to.
        required: true
        type: string
    secrets:
      SUPABASE_DB_URL:
        required: true
      SUPABASE_ACCESS_TOKEN:
        required: true
      # Basic-auth password for the Supabase Metrics API scrape in the
      # db-metrics job. Required, per the header note: a canary whose secret
      # goes missing must alarm, not skip.
      SUPABASE_SERVICE_ROLE_KEY:
        required: true
      # The nightly Lighthouse baseline builds and serves the app, then logs in
      # as the admin to audit the authenticated routes. Optional so a caller that
      # only wants the drift/advisor/sweep/audit canaries stays valid; the
      # lighthouse job self-skips when they are absent.
      NEXT_PUBLIC_SUPABASE_URL:
        required: false
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:
        required: false
      E2E_ADMIN_NAME:
        required: false
      E2E_ADMIN_PASSWORD:
        required: false
      # The same audit from a member's seat (muk.events#739). Optional like the
      # admin pair and gated the same way: the job self-skips when any of the
      # five are absent, so a caller that wants only the other canaries stays
      # valid rather than failing on a seat it never asked to audit.
      E2E_STAFF_NAME:
        required: false
      E2E_STAFF_PASSWORD:
        required: false
      # The quota canary's vendor credential. Required, per the header
      # note — an unwatched meter that everyone believes is watched is worse
      # than no check at all, which is the whole reason that job exists.
      #
      # GH_BILLING_TOKEN cannot be GITHUB_TOKEN, and not for want of trying: a
      # workflow token cannot reach the billing endpoints at all, and the
      # per-repo Actions API it CAN reach measures the wrong thing here. muk.
      # events runs on the self-hosted pool, so its billable minutes are ~0
      # every month while roughly twenty other repos on the same account spend
      # the included allowance — a repo-scoped measurement would report a
      # comfortable zero forever, which is the silent-green failure this job
      # exists to prevent.
      #
      # It does NOT need a purpose-built PAT. Any token that can read the
      # account's billing usage works, so the caller passes one it already
      # holds; the account it reads is derived from github.repository_owner
      # rather than being a second secret to keep in step.
      GH_BILLING_TOKEN:
        required: true
      # Vercel is back as of 2026-08-25: the team moved to Pro, whose billing
      # API answers, and the script itself downgrades gracefully when the plan
      # returns to Hobby (a 404 is the plan gate, not a failure). See the
      # "VERCEL AND THE PLAN GATE" note in muk.events'
      # scripts/assert-quota-budgets.mjs.
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ${{ inputs.supabase_project_ref }}

# Every job here runs on the self-hosted muk-ci pool (routed via MUK_CI_LABELS,
# like ci.yml). If the runner box is down, runner-watchdog.yml re-routes them
# to ubuntu-latest — and its own failure email doubles as the "runner is down"
# alarm, so this canary never falls silent for long.

jobs:
  drift:
    name: Migration & function drift
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
      # Same question as muk-ci.yml's sync job (muk.events#1841).
      actions: read
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Migration & function drift

          The nightly strict check that production still matches this repository: every merged migration applied, no edge function older than its source, RLS still scoped to muk membership, `types/supabase.ts` still matching the live schema. By nightly, anything unapplied is a genuinely lost deploy rather than work in flight.

          ❌ A merge never reached production — most often a deploy job skipped when an unrelated job was red. Find what is pending and deploy it.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The function staleness check dates each function's last source
          # change, which needs more history than the tip commit.
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/supabase-cli # the version muk.events pins in .supabase-cli-version

      # STRICT: by nightly, every merged migration should long since have
      # deployed — anything unapplied here is a genuinely lost deploy.
      - name: Repo migrations match the prod ledger
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STRICT: "1"
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL not set — the nightly drift alarm cannot run."
            exit 1
          fi
          node scripts/check-migration-drift.mjs

      # Same alarm for edge functions: by nightly, every function main touched
      # should long since have redeployed. A stale one means the merge-time
      # deploy never ran for it (e.g. the pipeline was red and the deploy jobs
      # skipped — which is precisely how 2026-07-13 played out, three times).
      - name: Deployed edge functions are not older than their source
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STRICT: "1"
          # A function whose merge is still mid-pipeline is pending, not
          # stale; the script asks main's runs (muk.events#1841). Needs
          # actions: read from the caller, and reads as before without it.
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN not set — the nightly staleness alarm cannot run."
            exit 1
          fi
          node scripts/check-functions-sync.mjs

      - name: muk RLS is scoped to muk membership
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL not set — the nightly RLS assertion cannot run."
            exit 1
          fi
          psql "$SUPABASE_DB_URL" --no-psqlrc -v ON_ERROR_STOP=1 -f scripts/assert-rls-scoping.sql

      # The PR-time types check skips whenever migrations are awaiting deploy
      # (committed types are generated from prod, so they can't match a schema
      # prod doesn't have yet). This is the strict re-check once deploys have
      # landed — M6-class staleness surfaces within a day.
      - name: types/supabase.ts matches the prod schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN not set — the nightly types check cannot run."
            exit 1
          fi
          supabase gen types typescript \
            --project-id "$SUPABASE_PROJECT_REF" --schema muk > /tmp/supabase.ts
          if ! diff -u types/supabase.ts /tmp/supabase.ts; then
            echo "::error::types/supabase.ts is stale. Run 'npm run gen:types' and commit the result."
            exit 1
          fi
          echo "types/supabase.ts is up to date."

  advisors:
    name: Supabase advisors
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 10
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Supabase advisors

          Asks Supabase itself for the security and performance lints it raises against this project — unindexed foreign keys, tables without RLS, and similar findings nobody would otherwise look at.

          ❌ Read the advisor output. A security-category finding on a shared-database project deserves same-day attention.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Security & performance lints
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN not set — the nightly advisor check cannot run."
            exit 1
          fi
          node scripts/check-advisors.mjs

  # One scrape of the Supabase Metrics API (the DB box's Prometheus exporters),
  # asserted against generous nano-instance thresholds: disk, connections,
  # cache hit ratio, replication lag, load and memory. The dashboard graphs
  # these but nothing watches the dashboard; this turns "the data disk has been
  # filling for a week" into a next-morning email instead of an outage. The API
  # is documented as beta, so the script fails loudly on a missing metric name
  # rather than letting a rename silently retire an assertion.
  db-metrics:
    name: Database metrics
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 10
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Database metrics

          One scrape of the Supabase Metrics API asserted against thresholds sized for this instance: disk, connections, cache hit ratio, replication lag, load and memory. The dashboard graphs all of this, but nothing watches the dashboard.

          ❌ A resource trend is heading somewhere bad — this exists to turn a slow squeeze like a filling data disk into a next-morning email instead of an outage. A failure naming a MISSING metric means the beta API renamed something and the assertion needs updating, not that the database is unhealthy.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Disk, connections, cache, lag, load and memory are within budget
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY not set — the nightly DB metrics canary cannot run."
            exit 1
          fi
          node scripts/assert-db-metrics.mjs

  # Quota and budget monitoring — step 11 of the Careteam extraction audit, and
  # not speculative: GitHub-hosted Actions minutes ran out in July 2026, which
  # silently disabled the runner watchdog AND blocked Dependabot's rebases.
  # Neither failure was visible until something downstream broke. Thresholds are
  # 70% warn / 90% fail, because an alert at exhaustion is a post-mortem.
  #
  # Supabase is deliberately absent: db-metrics above already watches its only
  # meter with a real ceiling. Vercel reads the billing charges API, which
  # answers on Pro and 404s on Hobby; the script treats that 404 as a plan
  # gate rather than a failure. See the script's header.
  quota:
    name: Quota & budget
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 10
    # The Vercel token and team id are read from the caller's main-only
    # `Production` environment, so the repo-level copies a PR branch could
    # read can be deleted (muk#2266 stage 4). `deployment: false`: this job
    # deploys nothing and must not write a Deployment record DORA would count.
    # The billing token is still the caller's repo-level one.
    environment:
      name: Production
      deployment: false
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Quota & budget

          One read of the GitHub and Vercel billing meters for the current period, asserted against the ceilings in `quota-budgets.json` — 70% warns, 90% fails. Run-rate projections and Vercel's per-product usage lines are reported but never gate. On the Hobby plan Vercel exposes no usage API; the script reports that plan gate and drops the Vercel budget instead of failing.

          ❌ One of three things, and the failure line says which: a meter is over 90% of its budget (look at the bill), a meter was not measured (a source wired to no budget or vice versa), or a vendor API could not be read. The last two fail rather than skip on purpose — an unwatched meter everyone believes is watched is how July's minute exhaustion went unnoticed.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Metered resources are within budget
        env:
          GH_BILLING_TOKEN: ${{ secrets.GH_BILLING_TOKEN }}
          # The account whose meters are read. In a reusable workflow this is
          # the CALLER's owner, which is what we want and is one less secret.
          GH_BILLING_USER: ${{ github.repository_owner }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          for name in GH_BILLING_TOKEN GH_BILLING_USER VERCEL_TOKEN VERCEL_ORG_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name not set — the nightly quota canary cannot run."
              exit 1
            fi
          done
          node scripts/assert-quota-budgets.mjs

  # The prod-reality half of the app repo's feature-alignment system
  # (lib/feature-registry.ts; the static half PR-gates in the unit tier).
  # One read of the last 30 days of muk.observations, judged against the
  # registry: an unknown kind or a post-epoch actor-class the owning feature
  # does not claim fails the job — the same next-morning email as the other
  # canaries — while rare/dead kinds are only reported. Deliberately nightly
  # and never per-PR: it queries live prod and reasons about time windows,
  # not diffs. No npm ci: the script's only import is the registry, whose
  # type-only imports Node ≥ 23.6 strips natively.
  observation-alignment:
    name: Observation alignment (prod vs feature registry)
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 10
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Observation alignment (prod vs feature registry)

          Reads the last 30 days of real observation rows and judges them against the feature registry: does every kind that production actually emits belong to a feature that claims it?

          ❌ Production is emitting something the registry does not claim — usually a write site added without registering it, or a feature whose actor classes drifted. Rare or dead kinds are only reported, never failed.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Prod observations align with the feature registry
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY not set — the nightly observation-alignment canary cannot run."
            exit 1
          fi
          node scripts/assert-observation-alignment.mjs

  promo-pipeline:
    name: Promo pipeline (dispatchers, token, refusals)
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 5
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Promo pipeline (dispatchers, token, refusals)

          Asks `muk.promo_pipeline_status()` whether the Instagram integration's scheduled halves are awake: the three dispatcher rows in `muk_private.system_webhooks`, the token row's last refresh and expiry, the promo cron jobs' last runs, and any post still carrying a refusal. Names and dates only, never a secret.

          ❌ Somebody has to act: a dispatcher row is missing (the insert is in docs/instagram-promotion.md), the token refresh failed or the token is inside eight days of expiry, a post has carried a refusal for more than a day, or a promo cron job's last run did not succeed. A missing token row alone is a note, not a failure.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: The promo pipeline is awake
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY not set — the nightly promo-pipeline canary cannot run."
            exit 1
          fi
          node scripts/assert-promo-pipeline.mjs

  # Nothing read the error rows the app writes until this job existed. The two
  # error boundaries post `app.crashed` and instrumentation.ts posts
  # `app.action_failed` when a server action throws; both landed in the table
  # and were seen only by whoever happened to open the observation panel. The
  # July resilience audit's "nothing watches production" was about exactly this
  # gap: uptime was covered by the heartbeat, the smoke test and the dead-man
  # switch, and errors were covered by nobody. Same posture as the alignment
  # canary above, and no npm ci for the same reason: the script imports nothing
  # but Node's own.
  production-errors:
    name: Production errors (crashes and failed actions)
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 10
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Production errors (crashes and failed actions)

          Counts the error rows production wrote in the last 24 hours — a screen that showed "Das hat leider nicht geklappt", and a server action that threw where the member could only be told a code — against the worst day of the month behind them.

          **Green means** the app broke no more often than it already has. The counts are printed either way; the previous 24 hours are the line worth reading.

          **Red means** a kind is past its ceiling: twice its own worst day of the previous 30, and never fewer than three. The digest on each row is the same code the member was shown and the server log line carries.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Production broke no more often than it ever has
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY not set — the nightly production-error canary cannot run."
            exit 1
          fi
          node scripts/assert-production-errors.mjs

  # The blanket net for e2e debris. The per-run sweep in ci.yml/browser-matrix
  # deletes a run's own events immediately, but a runner killed too hard for
  # even `if: always()` leaves them behind — this catches those within a day.
  # Scoped to the E2E-TEST marker AND the admin source, so a real event can
  # never match; 2 hours old keeps it clear of any run still in flight.
  sweep:
    name: Sweep stranded e2e events
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 10
    # This job WRITES (it deletes rows), so it takes the owner connection
    # string from the caller's main-only `production-backend` environment and
    # keeps working once the repo-level SUPABASE_DB_URL is narrowed to a
    # read-only role (muk#2266). `deployment: false`: no Deployment record.
    environment:
      name: production-backend
      deployment: false
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Sweep stranded e2e events

          The blanket net for test debris. Each CI run deletes its own test events immediately, but a runner killed too hard for even an `always()` cleanup step leaves rows behind. This catches those within a day.

          ❌ The cleanup query itself could not run — a database connectivity or credentials problem, not a data problem. Real member data is never at risk: the delete is scoped to the test marker AND the admin source, and only to rows over two hours old.
          TLDR

      - name: Delete E2E-TEST events older than 2 hours
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL not set — the nightly sweep cannot run."
            exit 1
          fi
          psql "$SUPABASE_DB_URL" --no-psqlrc --tuples-only --command \
            "with removed as (delete from muk.events where source = 'muk-events-admin' and title like 'E2E-TEST%' and created_at < now() - interval '2 hours' returning id) select 'swept ' || count(*) || ' stranded test event(s)' from removed"

  # Production dependency audit. Deliberately NOT in the required CI quality job:
  # there it would fail every PR and every main push the instant a new advisory
  # lands against a production dependency — unrelated to the change under review
  # — and, since auto-merge blocks on that job, wedge the whole merge queue.
  # Here it is a nightly canary: a fresh high-severity CVE emails the owner
  # within a day (like the drift/advisor alarms) without blocking delivery.
  audit:
    name: Production dependency audit
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 15
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Production dependency audit

          Nightly `npm audit` of production dependencies. It lives here rather than in the PR gate on purpose: as a required check it would fail every unrelated pull request the moment a new advisory landed, and wedge the auto-merge queue.

          ❌ A new CVE affects a production dependency. Delivery is not blocked — that is the trade — so treat it as a same-week task. Most advisories here land on transitive dev dependencies and are answered with a ranged `overrides` entry in package.json rather than a Dependabot PR.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        # Install scripts do not run on the box (muk.events#1484, hole 4).
        run: npm ci --ignore-scripts

      # The same retry loop as muk-ci.yml's deps-audit job, for the same
      # reason: the advisory endpoint drops a fair share of requests past npm's
      # 5-minute fetch timeout, and an alarm that fires on the registry's bad
      # night is one the owner learns to ignore. It ends differently, though —
      # see the comment on the last line.
      - name: Audit production dependencies
        run: |
          # npm cannot tell these apart: it exits 1 both for "this tree carries a
          # high advisory" and for "the registry did not answer", and those need
          # opposite responses. `auditReportVersion` is on every real report and
          # on no error payload, so it is the one honest signal — matching npm's
          # wording instead would turn a reworded error into an instant red.
          #
          # Written out here rather than committed beside this workflow because
          # a reusable workflow runs in the CALLER's checkout: a file shipped in
          # this repository would not exist when the step runs.
          verdict="$RUNNER_TEMP/audit-verdict.mjs"
          cat > "$verdict" <<'VERDICT'
          // 0 clean - 1 a high or critical advisory, listed - 2 no report to read.
          import { readFileSync } from "node:fs";
          let report;
          try {
            report = JSON.parse(readFileSync(process.argv[2], "utf8"));
          } catch {
            process.exit(2);
          }
          if (!report.auditReportVersion) process.exit(2);

          const counts = report.metadata?.vulnerabilities ?? {};
          console.log(`advisories by severity: ${JSON.stringify(counts)}`);
          const blocking = [];
          for (const [name, found] of Object.entries(report.vulnerabilities ?? {})) {
            if (found.severity !== "high" && found.severity !== "critical") continue;
            const why = (found.via ?? [])
              .map((entry) => (typeof entry === "string" ? entry : entry.title))
              .filter(Boolean)
              .join("; ");
            blocking.push(`  ${found.severity}  ${name}  ${why}`);
          }
          for (const line of blocking.sort()) console.log(line);
          process.exit(blocking.length > 0 ? 1 : 0);
          VERDICT

          for attempt in 1 2 3 4 5; do
            npm audit --omit=dev --audit-level=high --json \
              --fetch-timeout=90000 --fetch-retries=0 \
              >"$RUNNER_TEMP/audit.json" 2>"$RUNNER_TEMP/audit.err" || true
            # The default step shell is `bash -e`: a nonzero verdict from node
            # (1 advisory, 2 no report) must reach the case below, not end the step.
            verdict_rc=0
            node "$verdict" "$RUNNER_TEMP/audit.json" || verdict_rc=$?
            case $verdict_rc in
              0) exit 0 ;;
              1) echo "::error::A high or critical advisory affects a production dependency (listed above)."; exit 1 ;;
            esac
            echo "attempt $attempt of 5: the advisory endpoint did not answer within 90 s."
            sed -n '1,15p' "$RUNNER_TEMP/audit.err"
            [ "$attempt" -lt 5 ] && sleep $((attempt * 10))
          done

          # The opposite ending to the PR gate's, deliberately. This is the
          # alarm rather than a gate: nothing is waiting on it, and an alarm
          # that quietly did not run is worse than one that goes off on a bad
          # night at the registry.
          echo "::error::The advisory endpoint did not answer in five attempts, so this tree was NOT audited tonight."
          exit 1

  # The full Lighthouse audit — and, since the per-PR perf job was retired, its
  # sole enforcing home. muk-ci.yml's PR gate is now a fast, deterministic
  # bundle-size check (no Chrome); the timing-sensitive scores that flaked under
  # runner contention moved HERE, where three samples run on an idle box at
  # 03:17 and the measurement is trustworthy. The assert step below hard-fails
  # this job on a blown network byte budget or an error-level category score
  # (performance ≥ 0.9, a11y/best-practices/seo = 1), which emails the owner —
  # the same next-morning alert as the drift/advisor/audit canaries, off the
  # merge path. Self-skips if the credentials are absent, so a minimal caller
  # stays valid.
  lighthouse:
    name: Lighthouse baseline (mobile, 3 samples)
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    # Owns the :3200 port and the single-Lighthouse-at-a-time discipline now
    # that muk-ci.yml's perf job is gone; the `lighthouse` concurrency group
    # still serializes it against any manual workflow_dispatch re-run.
    concurrency:
      group: lighthouse
      cancel-in-progress: false
    # 45, not 30: the staff seat (muk.events#739) adds four routes per sample to
    # the eight that sized the old ceiling, and devtools throttling is the slow
    # kind on purpose.
    timeout-minutes: 45
    env:
      LIGHTHOUSE_PORT: "3200"
      E2E_ADMIN_NAME: ${{ secrets.E2E_ADMIN_NAME }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_STAFF_NAME: ${{ secrets.E2E_STAFF_NAME }}
      E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Lighthouse baseline (mobile, 3 samples)

          The full browser-measured performance, accessibility, best-practices and SEO audit, three samples on an idle machine at 03:17. It is the sole enforcing home of these budgets: the per-PR gate is a fast bundle-size check with no browser, because timing-sensitive scores flaked under CI contention and blocked merges for reasons no commit caused.

          ❌ A real regression in page weight or a category score (performance at or above 0.90; accessibility, best practices and SEO at 1). Off the merge path by design, so it emails rather than blocks. Only the public routes have a hard total-transfer budget; the admin routes move with production content and are advisory.
          TLDR

      - name: Credentials are present
        id: creds
        run: |
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}" ] || [ -z "${E2E_ADMIN_NAME:-}" ] || [ -z "${E2E_ADMIN_PASSWORD:-}" ] || [ -z "${E2E_STAFF_NAME:-}" ] || [ -z "${E2E_STAFF_PASSWORD:-}" ]; then
            echo "::notice::Lighthouse credentials absent — skipping the nightly baseline."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.creds.outputs.ok == 'true'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          # See muk-ci.yml: the runner-local npm cache is already warm; the
          # setup-node cloud cache restored a 1.4 GB archive per job.
          package-manager-cache: false

      - name: Install dependencies
        if: steps.creds.outputs.ok == 'true'
        # Install scripts do not run on the box (muk.events#1484, hole 4).
        run: npm ci --ignore-scripts

      - name: Build
        if: steps.creds.outputs.ok == 'true'
        run: npm run build

      # Install the Chromium build this lockfile's Playwright expects, so the
      # fallback below never depends on which job last ran on the box: after a
      # Playwright bump the cache lacked it and the nightly measured nothing.
      # The cache GC hangs from a launchd runner (muk docs/self-hosted-runners.md).
      - name: Install Playwright Chromium
        if: steps.creds.outputs.ok == 'true'
        run: npx playwright install chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: "1"

      # puppeteer-core (from Lighthouse's tree) ships without a browser; point it
      # at the runner's installed Chrome, or at the Chromium Playwright
      # installed in the step above. An app somebody installed by hand
      # can also be removed by hand: on 2026-10-04 Chrome was gone from the
      # runner and the nightly failed here before measuring anything.
      - name: Locate Chrome
        if: steps.creds.outputs.ok == 'true'
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            chrome_path="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            chrome_path="$(command -v chromium)"
          elif [[ -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]]; then
            chrome_path="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          elif chrome_path="$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())' 2>/dev/null)" && [[ -x "$chrome_path" ]]; then
            echo "::notice::No installed Chrome; auditing with Playwright's Chromium at $chrome_path."
          else
            echo "Chrome executable not found, and Playwright has no Chromium either (npx playwright install chromium)" >&2
            exit 1
          fi
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Free the Lighthouse port
        if: steps.creds.outputs.ok == 'true'
        run: lsof -ti :"$LIGHTHOUSE_PORT" | xargs kill 2>/dev/null || true

      - name: Lighthouse CI (mobile, 3 samples)
        # Advisory at the action level; the assert step below is the gate, so a
        # score/budget breach fails through the detailed breakdown rather than
        # the action's terse exit — mirroring the pattern the retired per-PR
        # perf job used in muk-ci.yml.
        continue-on-error: true
        if: steps.creds.outputs.ok == 'true'
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.json
          runs: "3"

      # This is where the full Lighthouse contract is now ENFORCED, on the idle
      # nightly box instead of the busy PR path: the deterministic network byte
      # budgets AND every error-level category score in lighthouserc.json
      # (performance ≥ 0.9, a11y/best-practices/seo = 1). A failure fails this
      # nightly job, which emails the owner — the same alert as the drift,
      # advisor and audit canaries. Fails closed if the action collected nothing.
      - name: Require byte budgets and category scores
        if: steps.creds.outputs.ok == 'true'
        run: node scripts/assert-lighthouse-byte-budgets.mjs .lighthouseci

      - name: Add Lighthouse results to run summary
        if: ${{ always() && steps.creds.outputs.ok == 'true' }}
        run: node scripts/write-ci-summary.mjs lighthouse .lighthouseci

      # The reports themselves, so a red night can name its failing audit: the
      # summary above carries scores, and a best-practices miss is unreadable
      # without the audit list (muk.events#1836). JSON only (the HTML copies
      # are most of the weight) and three days, for the same storage reason as
      # the Playwright report in muk-browser-matrix.yml.
      - name: Upload Lighthouse reports
        if: ${{ always() && steps.creds.outputs.ok == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci/*.json
          retention-days: 3
          # `.lighthouseci` is a hidden directory and upload-artifact skips
          # hidden files by default, so without this the glob matched nothing.
          include-hidden-files: true
          # A missing report is the thing this step exists to prevent: say so.
          if-no-files-found: warn

  # The four DORA metrics over the trailing 30 days, computed from data the
  # pipeline already produces: GitHub Deployments (recorded by muk-ci.yml's
  # deploy jobs), merged PRs, and main-branch CI runs. Pure reporting — it
  # never blocks anything; the numbers land in this run's summary page.
  # The script lives in the app repo (scripts/dora-metrics.mjs), same pattern
  # as every other app-owned check this pipeline calls. Needs actions: read
  # and pull-requests: read from the caller's permissions block.
  dora:
    name: DORA metrics (30-day window)
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      deployments: read
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### DORA metrics (30-day window)

          The four DORA delivery metrics over the trailing 30 days, from data the pipeline already produces: recorded deployments, merged pull requests, and main-branch CI runs.

          ✅ The numbers are in this summary. This job is pure reporting and never blocks anything.

          ❌ The metrics could not be computed (a GitHub API or permissions problem). Nothing about delivery is broken.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Compute DORA metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/dora-metrics.mjs >> "$GITHUB_STEP_SUMMARY"

  # Nightly code-efficiency canary: duplication percentages (jscpd), dead
  # files/exports/dependencies (knip) and unused CSS selectors (the app repo's
  # own scanner), gated against code-efficiency-budgets.json. The budgets are
  # a ratchet the owner chose to seed at ZERO, so this job stays red — and
  # emails, like every canary above — until the measured backlog is pruned;
  # raising a budget is a deliberate, reviewed acceptance in the app repo.
  # Pure repo analysis: no secrets, no server, no browser. The measure and
  # assert steps are separate so the failure email names the gate while the
  # always() summary still renders the tables the owner reads.
  efficiency:
    name: Code efficiency (duplication & dead code)
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 15
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Code efficiency (duplication & dead code)

          Measures code duplication, dead files, exports and dependencies, and unused CSS selectors, gated against budgets the owner deliberately seeded at ZERO. The backlog that seeding exposed has since been pruned away, so these budgets are met rather than aspirational.

          ❌ A real regression: something newly duplicated, dead or unused, named in the summary above. Raising a budget is a deliberate, reviewed acceptance — never a way to quiet the gate.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          # See muk-ci.yml: the runner-local npm cache is already warm; the
          # setup-node cloud cache restored a 1.4 GB archive per job.
          package-manager-cache: false

      - name: Install dependencies
        # Install scripts do not run on the box (muk.events#1484, hole 4).
        run: npm ci --ignore-scripts

      - name: Measure duplication, dead code and unused CSS
        run: node scripts/measure-code-efficiency.mjs

      - name: Enforce code-efficiency budgets
        run: node scripts/assert-code-efficiency.mjs

      - name: Add code-efficiency report to run summary
        if: always()
        run: node scripts/write-ci-summary.mjs code-efficiency .code-efficiency

  # Nightly code-consistency canary: efficiency (above) asks "is the same code
  # written twice"; this asks the opposite question — "the project already
  # decided how to do this, does every site actually do it that way". Unique
  # code is not penalised on its own; only DIVERGENCE from something already
  # committed to is measured, in two shapes:
  #
  #   - bypass.<convention> — a call site that hand-rolls behaviour a shared
  #     primitive already provides (a hand-built dialog next to ModalShell, a
  #     bare <input> next to FloatField, a bespoke busy flag next to
  #     usePendingAction). Conventions are declared in the app repo's
  #     code-consistency-registry.json.
  #   - singleton.props / classes / tokens — the subtler half: a shared
  #     component, class or design token IS being reused, but one caller
  #     bought its way in with a prop, a shared-stylesheet class, or a token
  #     that only it references.
  #
  # Budgets are zero, ratchet-style like the efficiency job, but the escape
  # hatch is different in kind: almost every finding here has two legitimate
  # answers (adopt the shared primitive, or keep the divergence on purpose),
  # so the app repo's code-consistency-budgets.json takes a PROSE REASON per
  # acknowledged finding rather than a raised ceiling. What accumulates over
  # time is a ledger of every place the project knowingly does one thing two
  # ways, with the reason attached — not a number that quietly grows.
  # Pure repo analysis: no secrets, no server, no browser.
  consistency:
    name: Code consistency (shared-primitive adoption)
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 15
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Code consistency (shared-primitive adoption)

          Asks the question code-efficiency does not: not "is this code duplicated", but "does every site facing the same problem — a confirmation, a typed field, a busy save button, an overlay — go through the primitive the project already built for it". Unique code is never penalised on its own; only DIVERGENCE from an existing convention is.

          ❌ A decision is due, not a breakage. Adopt the shared primitive, or acknowledge why this one stands with a written reason in `code-consistency-budgets.json` — never a raised number, because almost every finding here has two legitimate answers and only the acknowledgement records which one was chosen.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          # See muk-ci.yml: the runner-local npm cache is already warm; the
          # setup-node cloud cache restored a 1.4 GB archive per job.
          package-manager-cache: false

      - name: Install dependencies
        # Install scripts do not run on the box (muk.events#1484, hole 4).
        run: npm ci --ignore-scripts

      - name: Measure shared-primitive adoption and escape hatches
        run: node scripts/measure-code-consistency.mjs

      - name: Enforce code-consistency budgets
        run: node scripts/assert-code-consistency.mjs

      - name: Add code-consistency report to run summary
        if: always()
        run: node scripts/write-ci-summary.mjs code-consistency .code-consistency

  # Nightly copy-quality canary: the two jobs above read the CODE; this one
  # reads the words a member actually sees. It replaces a hand-typed inventory
  # (the app repo's docs/user-facing-copy.json, now deleted) whose own header
  # admitted it "drifts silently" — two UI/UX audits filed that as a finding
  # and neither could fix it, because a hand-copy of 1100 strings cannot stay
  # true. A generated one cannot drift, so the inventory is now output rather
  # than a document, and the run summary carries it in full.
  #
  # Five metrics, budgets all zero, same reason-carrying ledger as the
  # consistency job above (copy-quality-budgets.json):
  #
  #   - punctuation.gedankenstrich — an en/em dash joining clauses. A dash
  #     standing alone is the empty-value placeholder in the schedule tables,
  #     which is typography, and is not flagged.
  #   - umlaut.decomposed — an Umlaut written as a combining sequence (renders
  #     identically, breaks matching and sorting) or spelled out in ASCII.
  #   - verbosity.length — per-string length against a ceiling that depends on
  #     where the string sits; a button and a legal paragraph are not the same
  #     object.
  #   - verbosity.redundant-hint — a hint that restates the label above it.
  #   - copy.duplicate-divergent — one sentence that also exists with a clause
  #     bolted on, which is the drift the app's lib/copy.ts was written for.
  #
  # Red means a copy DECISION is due, not that anything is broken: rewrite the
  # string, or acknowledge it with a reason. Nightly rather than per-PR on
  # purpose — a copy nit is not a reason to block a merge, and the app repo's
  # tests/unit/copy-quality.test.ts already fails at PR time if the tree stops
  # being clean, so a regression does not wait for the night either way.
  # Pure repo analysis: no secrets, no server, no browser.
  copy-quality:
    name: Copy quality (what members actually read)
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 10
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Copy quality (what members actually read)

          Reads every user-facing string in the app — JSX text, copy attributes, copy tables, server-action refusals, push notification bodies — and scores it for dashes used as Gedankenstriche, Umlaute written wrong, copy longer than the slot it sits in, hints that restate their own label, and one sentence written two ways. The full inventory is in the fold below, regenerated every night so it cannot drift.

          ❌ A copy decision is due, not a breakage. Rewrite the string, or acknowledge it with a reason in `copy-quality-budgets.json` — never a raised ceiling. One red differs in kind: if extraction found almost no strings, the READER is broken rather than the copy being clean, and nothing else in the summary can be trusted until that is fixed.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          # See muk-ci.yml: the runner-local npm cache is already warm; the
          # setup-node cloud cache restored a 1.4 GB archive per job.
          package-manager-cache: false

      - name: Install dependencies
        # Install scripts do not run on the box (muk.events#1484, hole 4).
        run: npm ci --ignore-scripts

      - name: Measure every user-facing string
        run: node scripts/measure-copy-quality.mjs

      - name: Enforce copy-quality budgets
        run: node scripts/assert-copy-quality.mjs

      - name: Add copy-quality report to run summary
        if: always()
        run: node scripts/write-ci-summary.mjs copy-quality .copy-quality

  # Nightly tech-stack currency canary: is anything we build on superseded,
  # unmaintained, or newly unblocked? It reads the npm registry's own dist-tags
  # rather than `npm outdated`, which hides versions outside the declared range
  # — with "eslint": "^9" pinned, npm reported nothing at all while ESLint 10
  # shipped and 9 went EOL. Three signals fire: a new MAJOR for a direct
  # dependency, an upstream blocker LIFTING (a peer range that finally admits
  # an upgrade we were waiting on), and a release line reaching end-of-life.
  #
  # Red means a DECISION is due, not that something is broken: the owner reads
  # the summary, then either upgrades or records the wait in the app repo's
  # tech-stack-acknowledged.json. Anything already acknowledged stays quiet, so
  # this job is silent until the ecosystem actually moves. Minor/patch drift is
  # Dependabot's job and never signals here. Reasoning lives in
  # docs/tech-stack.md. Pure registry analysis: no secrets, no server, no
  # browser, and no npm ci (versions come from the lockfile).
  tech-stack:
    name: Tech stack currency (supersession watch)
    runs-on: ${{ fromJSON(vars.MUK_CI_LABELS || '["self-hosted","muk-ci"]') }}
    timeout-minutes: 10
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### Tech stack currency (supersession watch)

          Asks nightly whether anything the project is built on has been superseded, gone end-of-life, or become newly unblocked. It reads the npm registry directly rather than `npm outdated`, which hides versions outside the declared range.

          ❌ A DECISION is due, not a breakage. Read the table above, then either do the upgrade or record why we are waiting in `tech-stack-acknowledged.json`. Minor and patch drift never signals here — that is Dependabot's job. The reasoning behind every tool choice lives in `docs/tech-stack.md`.
          TLDR

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          # See muk-ci.yml: the runner-local npm cache is already warm; the
          # setup-node cloud cache restored a 1.4 GB archive per job.
          package-manager-cache: false

      - name: Measure dependency currency, blockers and end-of-life dates
        run: node scripts/measure-tech-stack.mjs

      - name: Fail on tech-stack signals nobody has decided on yet
        run: node scripts/assert-tech-stack.mjs

      - name: Add tech-stack report to run summary
        if: always()
        run: node scripts/write-ci-summary.mjs tech-stack .tech-stack
