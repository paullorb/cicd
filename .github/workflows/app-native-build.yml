name: App native builds

# Unsigned release artifacts for a standard Capacitor project. This proves the
# native projects compile before store credentials exist. A caller can later
# add signing material without changing the web build or Vercel delivery path.

on:
  workflow_call:
    inputs:
      node_version_file:
        description: Node version file owned by the caller repository.
        required: false
        default: .node-version
        type: string
      ios_project:
        description: Xcode project generated by Capacitor.
        required: false
        default: ios/App/App.xcodeproj
        type: string
      ios_scheme:
        description: Shared Xcode scheme generated by Capacitor.
        required: false
        default: App
        type: string
      app_id:
        description: Optional bundle/application ID to verify in compiled output.
        required: false
        default: ""
        type: string
      display_name:
        description: Optional launcher display name to verify in compiled output.
        required: false
        default: ""
        type: string
      build_android:
        description: >-
          Build the Android bundle. Defaults to true so existing callers are
          unaffected. Set false when the caller repository has no `android/`
          directory: `npx cap sync android` does not create a missing platform
          (only `cap add` does), so the job would fail on checkout rather than
          skip.
        required: false
        default: true
        type: boolean
      build_ios:
        description: >-
          Build the iOS archive. Same contract as `build_android`, so a caller
          can ship one platform without carrying the other's scaffolding.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  android:
    if: inputs.build_android
    name: Build Android release bundle, unsigned
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ${{ inputs.node_version_file }}

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Build unsigned Android artifacts
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify Android identity
        if: inputs.app_id != '' || inputs.display_name != ''
        env:
          EXPECTED_APP_ID: ${{ inputs.app_id }}
          EXPECTED_DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          manifest=$("$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" \
            dump badging android/app/build/outputs/apk/release/app-release-unsigned.apk)
          if [ -n "$EXPECTED_APP_ID" ]; then
            echo "$manifest" | grep -Fq "package: name='$EXPECTED_APP_ID'"
          fi
          if [ -n "$EXPECTED_DISPLAY_NAME" ]; then
            echo "$manifest" | grep -Fq "application-label:'$EXPECTED_DISPLAY_NAME'"
          fi

      - name: Upload Android bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    if: inputs.build_ios
    name: Build iOS release archive, unsigned
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ${{ inputs.node_version_file }}

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci
          npx cap sync ios

      - name: Build unsigned iOS archive
        run: |
          xcodebuild archive \
            -project "${{ inputs.ios_project }}" \
            -scheme "${{ inputs.ios_scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App-unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify iOS identity
        if: inputs.app_id != '' || inputs.display_name != ''
        env:
          EXPECTED_APP_ID: ${{ inputs.app_id }}
          EXPECTED_DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          app_plist="$RUNNER_TEMP/App-unsigned.xcarchive/Products/Applications/App.app/Info.plist"
          if [ -n "$EXPECTED_APP_ID" ]; then
            actual_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app_plist")
            test "$actual_id" = "$EXPECTED_APP_ID"
          fi
          if [ -n "$EXPECTED_DISPLAY_NAME" ]; then
            actual_name=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$app_plist")
            test "$actual_name" = "$EXPECTED_DISPLAY_NAME"
          fi

      - name: Upload iOS archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-release-unsigned
          path: ${{ runner.temp }}/App-unsigned.xcarchive
          if-no-files-found: error
          retention-days: 14
