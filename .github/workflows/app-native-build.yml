name: App native builds

# Unsigned release artifacts for a standard Capacitor project. This proves the
# native projects compile before store credentials exist. A caller can later
# add signing material without changing the web build or Vercel delivery path.

on:
  workflow_call:
    inputs:
      node_version_file:
        description: Node version file owned by the caller repository.
        required: false
        default: .node-version
        type: string
      ios_project:
        description: Xcode project generated by Capacitor.
        required: false
        default: ios/App/App.xcodeproj
        type: string
      ios_scheme:
        description: Shared Xcode scheme generated by Capacitor.
        required: false
        default: App
        type: string
      app_id:
        description: Optional bundle/application ID to verify in compiled output.
        required: false
        default: ""
        type: string
      display_name:
        description: Optional launcher display name to verify in compiled output.
        required: false
        default: ""
        type: string
      build_android:
        description: >-
          Build the Android bundle. Defaults to true so existing callers are
          unaffected. Set false when the caller repository has no `android/`
          directory: `npx cap sync android` does not create a missing platform
          (only `cap add` does), so the job would fail on checkout rather than
          skip.
        required: false
        default: true
        type: boolean
      build_ios:
        description: >-
          Build the iOS archive. Same contract as `build_android`, so a caller
          can ship one platform without carrying the other's scaffolding.
        required: false
        default: true
        type: boolean
      npm_ignore_scripts:
        description: >-
          Install with `--ignore-scripts`. Defaults to false, so an existing
          caller sees no change — a repository whose build depends on a
          postinstall (patch-package and friends) keeps working.

          Pass true when the archive is built on a persistent machine, where a
          dependency's install script would run as the runner's own user
          (paullorb/muk.events#1484, hole 4). It also skips the caller's own
          `prepare`, which CI does not need: it never pushes and never rebases.
        required: false
        default: false
        type: boolean
      artifact_retention_days:
        description: >-
          How long the unsigned archives are kept. Defaults to 7, so an
          existing caller sees no change.

          Worth passing a shorter one for pull requests. The archives are small
          (~4 MB each) but they arrive in PAIRS on every run, and on a busy
          repository a week of them is the largest thing in a shared storage
          allowance — muk.events measured 120 live archives at 465 MB against a
          0.5 GB account allowance in September 2026. Nobody has ever opened a
          PR's archive the day after; a Release-triggered one is the one a store
          submission is built from, and keeps the full window.
        required: false
        default: 7
        type: number
      # Runner routing, as JSON so a caller can pass either a label string
      # ('"macos-15"') or a label array ('["self-hosted","muk-ci"]'). The
      # defaults are the hosted images this workflow has always used, so an
      # existing caller sees no change.
      #
      # muk.events passes its self-hosted pool for iOS: that Mac already has
      # Xcode, and a hosted macOS minute costs ten of a Linux one — an unsigned
      # archive on every native-touching pull request is worth having, and worth
      # not paying ten times over. Android stays on ubuntu-latest, where the
      # image ships the SDK the Gradle build expects.
      # Both default to the caller's own pool, like pr-overlap.yml's `runs_on`:
      # hosted minutes are account-wide (and a macOS one bills as ten), so a
      # hosted image is something a caller asks for by name, with its reason in
      # paullorb/paullorber's scripts/lib/hosted-runners.mjs, never what a
      # caller that passes nothing gets.
      android_runs_on:
        description: JSON runner labels for the Android job. The pool needs the Android SDK; a caller without one passes '"ubuntu-latest"'.
        required: false
        default: '["self-hosted","app-ci"]'
        type: string
      ios_runs_on:
        description: JSON runner labels for the iOS job.
        required: false
        default: '["self-hosted","app-ci"]'
        type: string

permissions:
  contents: read

jobs:
  android:
    if: inputs.build_android
    name: Build Android release bundle, unsigned
    runs-on: ${{ fromJSON(inputs.android_runs_on) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ${{ inputs.node_version_file }}

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci ${{ inputs.npm_ignore_scripts && '--ignore-scripts' || '' }}
          npx cap sync android

      - name: Build unsigned Android artifacts
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify Android identity
        if: inputs.app_id != '' || inputs.display_name != ''
        env:
          EXPECTED_APP_ID: ${{ inputs.app_id }}
          EXPECTED_DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          manifest=$("$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" \
            dump badging android/app/build/outputs/apk/release/app-release-unsigned.apk)
          if [ -n "$EXPECTED_APP_ID" ]; then
            echo "$manifest" | grep -Fq "package: name='$EXPECTED_APP_ID'"
          fi
          if [ -n "$EXPECTED_DISPLAY_NAME" ]; then
            echo "$manifest" | grep -Fq "application-label:'$EXPECTED_DISPLAY_NAME'"
          fi

      - name: Upload Android bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          # Two archives per run at ~3.7 MB each add up fast on a shared
          # storage allowance, and nobody has ever needed one older than the
          # week it was built in. An archive that must outlive its window is
          # downloaded and kept deliberately, which is the honest way to keep
          # one anyway. The upload itself stays unconditional: `if-no-files-
          # found: error` is the assertion that the build produced the file,
          # and that is worth most on the runs there are most of.
          retention-days: ${{ inputs.artifact_retention_days }}

  ios:
    if: inputs.build_ios
    name: Build iOS release archive, unsigned
    runs-on: ${{ fromJSON(inputs.ios_runs_on) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ${{ inputs.node_version_file }}

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci ${{ inputs.npm_ignore_scripts && '--ignore-scripts' || '' }}
          npx cap sync ios

      - name: Build unsigned iOS archive
        run: |
          xcodebuild archive \
            -project "${{ inputs.ios_project }}" \
            -scheme "${{ inputs.ios_scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App-unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify iOS identity
        if: inputs.app_id != '' || inputs.display_name != ''
        env:
          EXPECTED_APP_ID: ${{ inputs.app_id }}
          EXPECTED_DISPLAY_NAME: ${{ inputs.display_name }}
        run: |
          app_plist="$RUNNER_TEMP/App-unsigned.xcarchive/Products/Applications/App.app/Info.plist"
          if [ -n "$EXPECTED_APP_ID" ]; then
            actual_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app_plist")
            test "$actual_id" = "$EXPECTED_APP_ID"
          fi
          if [ -n "$EXPECTED_DISPLAY_NAME" ]; then
            actual_name=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$app_plist")
            test "$actual_name" = "$EXPECTED_DISPLAY_NAME"
          fi

      - name: Upload iOS archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-release-unsigned
          path: ${{ runner.temp }}/App-unsigned.xcarchive
          if-no-files-found: error
          # See the Android upload above: the window is the caller's, the
          # upload is not conditional.
          retention-days: ${{ inputs.artifact_retention_days }}
