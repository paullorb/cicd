name: PR overlap

# Says, on the pull request itself, which OTHER open pull requests change the
# same files.
#
# WHAT THIS IS FOR
#
# Several agents working overlapping issues at once is now the normal way work
# arrives here, and the failure it produces is specific: two pull requests that
# both branched off the same commit are each green, merge one after the other,
# and break main together — because neither was ever built against the other.
# Nothing in a branch ruleset notices. Both ran every required check; the
# second one's CI had simply never seen the first one's change.
#
# It happened twice in one afternoon on 2026-10-06. paullorber #112 and #113
# both rewrote components/dividends/DividendTable.tsx, and #113 — stacked on
# #112's branch — was merged 17 seconds after it opened with an empty check
# rollup; #112's squash swallowed it a minute later, so GitHub still reports
# #113 as merged while its merge commit is not an ancestor of main. careteam #1
# and #2 both rewrote eslint.config.mjs, one adding an ignore to it and the
# other deleting ESLint outright, while #1 was still in flight.
#
# "Require branches to be up to date before merging" is the enforcement answer,
# and the repositories that can afford it have it on. This is the other half,
# and it is deliberately NOT enforcement: it costs nothing, it works on a
# repository that has decided the strict policy is too expensive (muk measured
# that and turned it off — docs/concurrent-branches.md there), and it tells
# whoever is about to merge something what else is in flight on the same lines.
#
# BOTH SIDES ARE TOLD
#
# The comment used to be written on the pull request that triggered the run
# and nowhere else. A pull request opened second was told about the first;
# the first learned nothing until somebody pushed to it, and in a repository
# without the up-to-date rule it could merge second, never rebuilt and never
# warned, which is the very shape this exists to name. So a run now rewrites
# the comment on every other open pull request that shares a file with this
# one, from the current state of all of them, and a caller that also passes
# the `closed` event has those comments cleared when this one merges. A pull
# request whose comment names this one is rewritten too, so one that stops
# overlapping after a push drops out of the other's list. Two runs can still
# race on one comment (each caller serializes per pull request, not per
# repository); the next rewrite of that comment keeps the first and deletes
# the rest, which is cheaper than a repository-wide concurrency group that
# would cancel a pending run and lose a pull request's own update.
#
# IT NEVER FAILS THE PULL REQUEST
#
# Overlap is information, not a verdict. Two pull requests touching one file is
# routine and usually fine; the point is that somebody knows before the second
# one lands, not that a robot refuses it. So every error path here still exits
# 0, and this is not a check worth requiring in a ruleset — a gate that blocks
# on "somebody else edited this file" would be turned off within a week.
#
# WHAT THE CALLER MUST GRANT
#
# The comment is written with the caller's GITHUB_TOKEN, and a reusable
# workflow can only narrow the permissions it inherits, never widen them. The
# job below declares `pull-requests: write`, so a caller whose job grants less
# (a read-only repository default, or `contents: read` alone) fails at startup
# with a permissions error naming this job, instead of running green while
# every comment write is refused and only warned about. The calling job needs:
#
#     permissions:
#       contents: read
#       pull-requests: write
#
# A `pull_request` run from a fork, or one Dependabot triggered, is served a
# read-only token whatever the caller asks for. Those runs stop early with a
# notice and write nothing; the pull request is still named in the comments of
# the other pull requests whenever one of them runs. This workflow never checks
# out or executes pull request code, so a caller that wants those runs to
# write too can trigger it on `pull_request_target` instead, which reads only
# the API and the base branch's own copy of the calling workflow.
on:
  workflow_call:
    inputs:
      ignore:
        description: >-
          Newline-separated path prefixes that do not count as an overlap, for
          files nearly every branch rewrites. A lockfile collision is real but
          it is not the kind a human needs warning about — git resolves it or
          the install does. Empty by default, so a repository opts in to its own
          noise list rather than inheriting a guess.
        required: false
        type: string
        default: ""

jobs:
  overlap:
    name: What else is in flight on these files
    # Only the GitHub API, so it answers while a self-hosted pool is busy —
    # which, on a repository where several branches are open at once, is exactly
    # when this has something to say.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Declared, not just inherited: see WHAT THE CALLER MUST GRANT above.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: What this job is for
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'TLDR'
          #### What else is in flight on these files

          Lists every other open pull request into the same base branch that changes a file this one also changes, as a single comment rewritten whenever any of them opens, pushes or closes, on this pull request and on each one it overlaps. Two separately-green pull requests on one file can still break the base branch together, because neither was built against the other; this is how whoever merges second finds out.

          ❌ The overlap comment is missing or stale, so nothing says what else is in flight. It never blocks a merge and never fails the pull request — read the other open pull requests by hand if this is red.
          TLDR

      - name: Find and report the overlap
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          # The token is read-only on a `pull_request` run from a fork or one
          # Dependabot triggered; `pull_request_target` gets the base
          # repository's token in both cases.
          READ_ONLY: >-
            ${{ github.event_name == 'pull_request' && (
              github.event.pull_request.head.repo.full_name != github.repository
              || github.actor == 'dependabot[bot]') }}
          CLOSED: ${{ github.event.action == 'closed' }}
          IGNORE: ${{ inputs.ignore }}
        run: |
          set -uo pipefail

          # A fork or Dependabot `pull_request` run is served a read-only
          # token, so no comment can be written. Say so and stop, rather than
          # failing the pull request over a permission it was never given.
          if [ "$READ_ONLY" = "true" ]; then
            echo "::notice::This run's token is read-only (a fork or Dependabot pull request), so no overlap comment is written. The other open pull requests still name this one when they run."
            exit 0
          fi

          # Exported, not interpolated into the expression: `gh api` has no
          # --arg flag of its own, and gojq reads the environment.
          export MARKER="<!-- cicd pr-overlap -->"
          files_dir="$RUNNER_TEMP/files"
          mkdir -p "$files_dir"

          # The files one pull request changes, sorted, less the ignore list,
          # read once per pull request however many comparisons need it. The
          # ignore list is matched as literal path PREFIXES, so "supabase/"
          # covers a directory, "package-lock.json" covers one file, and a
          # prefix like "app/[slug]/" means exactly those characters rather
          # than a regular expression.
          files_of() {
            local file="$files_dir/$1"
            if [ ! -e "$file" ]; then
              gh api --paginate "repos/$GH_REPO/pulls/$1/files" --jq '.[].filename' | sort -u > "$file" || : > "$file"
              if [ -n "$IGNORE" ]; then
                while IFS= read -r prefix; do
                  [ -z "$prefix" ] && continue
                  PREFIX="$prefix" awk 'index($0, ENVIRON["PREFIX"]) != 1' "$file" > "$file.tmp"
                  mv "$file.tmp" "$file"
                done <<< "$IGNORE"
              fi
            fi
            cat "$file"
          }

          # Every open, non-draft pull request of this repository into the
          # same base: the only ones that can land on it. On a `closed` event
          # this one is not among them any more, which is the point.
          open_file="$RUNNER_TEMP/open.tsv"
          gh api --paginate "repos/$GH_REPO/pulls?state=open&base=$BASE&per_page=100" \
            --jq '.[] | select(.draft == false) | select(.head.repo.full_name == env.GH_REPO) | "\(.number)\t\(.title)"' > "$open_file" \
            || : > "$open_file"

          # One comment per pull request, rewritten in place from the current
          # state of every open one. A new comment per push would bury the
          # pull request in its own warnings and get muted.
          report() {
            local number="$1" body="$RUNNER_TEMP/body-$1.md" header="$RUNNER_TEMP/header-$1.md"
            local found=0 other title shared mine existing plural
            : > "$body"
            mine="$(files_of "$number")"
            if [ -n "$mine" ]; then
              while IFS=$'\t' read -r other title; do
                if [ -z "$other" ] || [ "$other" = "$number" ]; then continue; fi
                shared="$(comm -12 <(printf '%s\n' "$mine") <(files_of "$other"))"
                [ -z "$shared" ] && continue
                found=$((found + 1))
                {
                  echo "#### #$other — $title"
                  echo
                  # shellcheck disable=SC2016  # `$` here is sed's end-of-line anchor.
                  printf '%s\n' "$shared" | sed 's/^/- `/; s/$/`/'
                  echo
                } >> "$body"
              done < "$open_file"
            fi

            # Streamed per element rather than aggregated: --paginate applies the
            # expression to each page separately, so a `map(...) | .[0]` would
            # answer once PER PAGE and a long thread would yield several ids.
            existing=""
            for id in $(gh api --paginate "repos/$GH_REPO/issues/$number/comments" \
              --jq '.[] | select(.body | contains(env.MARKER)) | .id'); do
              if [ -z "$existing" ]; then
                existing="$id"
              else
                # Two runs for two overlapping pull requests raced on this one
                # and each posted a comment: the first is kept, the rest go.
                gh api -X DELETE "repos/$GH_REPO/issues/comments/$id" >/dev/null \
                  || echo "::warning::Could not delete a duplicate overlap comment on #$number."
              fi
            done

            if [ "$found" -eq 0 ]; then
              if [ "$number" = "$PR" ]; then
                echo "No other open pull request into $BASE changes these files." >> "$GITHUB_STEP_SUMMARY"
              fi
              # An overlap that has since merged, closed or stopped touching
              # the shared files should not leave a warning standing. Nothing
              # is posted when there was never one.
              if [ -n "$existing" ]; then
                # shellcheck disable=SC2016  # the backticks are Markdown, not a command.
                printf '%s\n\n**No longer overlapping.** No other open pull request into `%s` changes a file this one changes: each one that did has merged, closed, or stopped changing those files.\n' \
                  "$MARKER" "$BASE" > "$body"
                gh api -X PATCH "repos/$GH_REPO/issues/comments/$existing" \
                  -F "body=@$body" >/dev/null \
                  || echo "::warning::Could not clear the overlap comment on #$number."
              fi
              return 0
            fi

            plural="pull requests"
            [ "$found" -eq 1 ] && plural="pull request"
            {
              echo "$MARKER"
              echo
              echo "### $found other open $plural change files this one changes"
              echo
              echo "Each of these can be green on its own and still break \`$BASE\` together with this one, because neither was built against the other. Whichever merges second should be brought up to \`$BASE\` and re-checked before it lands."
              echo
              cat "$body"
              echo "<sub>Rewritten by \`pr-overlap.yml\` in paullorb/cicd whenever a pull request into \`$BASE\` opens, pushes or closes. Informational — it never blocks a merge.</sub>"
            } > "$header"

            if [ "$number" = "$PR" ]; then
              cat "$header" >> "$GITHUB_STEP_SUMMARY"
              echo "::notice::$found other open $plural change files this one changes."
            fi

            if [ -n "$existing" ]; then
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$existing" -F "body=@$header" >/dev/null \
                || echo "::warning::Could not update the overlap comment on #$number."
            else
              gh api -X POST "repos/$GH_REPO/issues/$number/comments" -F "body=@$header" >/dev/null \
                || echo "::warning::Could not post the overlap comment on #$number."
            fi
          }

          # This pull request's own comment, unless it has just closed: a
          # merged pull request needs no warning, and its last comment stands
          # as the record of what was in flight when it landed.
          if [ "$CLOSED" != "true" ]; then
            report "$PR"
          fi

          # Then every open pull request that shares a file with this one, so
          # the one opened first is told about the one opened second, and one
          # that just closed drops out of the others' lists. One whose comment
          # names this pull request is rewritten too: a push here that stopped
          # touching the shared file must take this one off its list.
          export NAMED="#### #$PR —"
          names_me() {
            [ -n "$(gh api --paginate "repos/$GH_REPO/issues/$1/comments" \
              --jq '.[] | select(.body | contains(env.MARKER)) | select(.body | contains(env.NAMED)) | .id' | head -1)" ]
          }
          mine="$(files_of "$PR")"
          while IFS=$'\t' read -r other _; do
            if [ -z "$other" ] || [ "$other" = "$PR" ]; then continue; fi
            shared="$(comm -12 <(printf '%s\n' "$mine") <(files_of "$other"))"
            if [ -z "$shared" ] && ! names_me "$other"; then continue; fi
            report "$other"
          done < "$open_file"
